/* ---------------- RESULT / PROGRESSION ---------------- */

// Rarity bonus: a piece that helps match the brief gets a bonus scaled to
// its rarity. A rare-or-above piece that does nothing for the brief still
// gives a small flat bonus, just for being an impressive thing to own.

const RARITY_OFFBRIEF_BONUS = 5;
const HIGH_RARITY = new Set(["Rare", "Iconic", "Legendary"]);

// A piece matches a requirement if it's an exact attr/value hit, or (for a
// rarity requirement) its rarity is one of the acceptable tiers.
//
// Style specifically also checks a piece's secondary style tag (style2, from
// the master spreadsheet's style_tag_2 -- only ~109 cards have one; the rest
// behave exactly as before). A style2 hit only counts at HALF weight of a
// primary style match: most cards' two style tags are common, popular styles
// (Elegant/Classic/Romantic/Daring), and letting both count equally would
// have made those styles trivially easy to satisfy with almost any card in
// the deck, especially for the two clients (Margo, Holly) who share a
// preferred style -- see reqMatchWeight()/preferenceMatchWeight() below for
// where that weight actually gets used.
function reqMatches(r, piece) { return reqMatchWeight(r, piece) > 0; }
function reqMatchWeight(r, piece) {
  if (r.anyOf) return r.anyOf.includes(piece[r.attr]) ? 1 : 0;
  if (piece[r.attr] === r.value) return 1;
  if (r.attr === "style" && piece.style2 === r.value) return 0.5;
  return 0;
}

// Hidden preferences reuse the same { type:"attr", attr, value } shape.
function preferenceMatches(rule, pieces) { return preferenceMatchWeight(rule, pieces) > 0; }
function preferenceMatchWeight(rule, pieces) {
  if (rule.type === "name") return pieces.some((p) => p.name.includes(rule.keyword)) ? 1 : 0;
  if (pieces.some((p) => p[rule.attr] === rule.value)) return 1;
  if (rule.attr === "style" && pieces.some((p) => p.style2 === rule.value)) return 0.5;
  return 0;
}

function preferenceLabel(rule) {
  return rule.type === "name" ? rule.keyword : `${rule.value} ${rule.attr}`;
}

// A stable id for a preference, used to track what's been discovered per
// client (soulProfiles[key].discovered).
function preferenceKey(rule) {
  return rule.type === "name" ? `name:${rule.keyword}` : `${rule.attr}:${rule.value}`;
}

function finishStyling() {
  const client = currentClient();
  const key = currentClientKey();
  const profile = soulProfiles[key];
  const pieces = Object.values(outfit).filter(Boolean);
  const wantList = currentBrief.want || []; // empty for a player-choice (trust) job

  // Per-piece detail — computed once, used for both the aggregate totals and
  // the itemized breakdown, so the two views can never disagree.
  const pieceDetails = pieces.map((piece) => {
    const matchedAttrs = wantList.filter((r) => reqMatches(r, piece));
    const briefPts = wantList.reduce((sum, r) => sum + reqMatchWeight(r, piece) * 25, 0);
    let rarityPts = 0;
    if (matchedAttrs.length > 0) rarityPts = RARITY_FIT_BONUS[piece.rarity] || 0;
    else if (HIGH_RARITY.has(piece.rarity)) rarityPts = RARITY_OFFBRIEF_BONUS;
    return { piece, matchedAttrs, briefPts, rarityPts };
  });

  // Whichever single piece contributed the most points -- shown on the
  // result screen so the player can see exactly what worked.
  let bestPiece = null;
  if (pieceDetails.length > 0) {
    const top = pieceDetails.reduce((best, d) => (d.briefPts + d.rarityPts > best.briefPts + best.rarityPts ? d : best));
    if (top.briefPts + top.rarityPts > 0) bestPiece = top.piece;
  }

  const rawBriefScore = pieceDetails.reduce((sum, d) => sum + d.briefPts, 0);
  const briefScore = Math.min(rawBriefScore, 100);
  const briefCapped = rawBriefScore > 100;
  const rarityBonus = pieceDetails.reduce((sum, d) => sum + d.rarityPts, 0);

  // Hidden preferences — permanent personal taste, separate from the active
  // brief (see the briefing doc's "Hidden Preferences & Discovery"). An
  // "against preference" job can suppress one of these for itself
  // (currentBrief.suppressPreference) so wearing the thing she just asked
  // to avoid doesn't quietly still score. A player-choice (trust) job scores
  // these at +15 each, capped at +60, instead of the usual uncapped +8 each.
  const suppressed = new Set(currentBrief.suppressPreference || []);
  const matchedPreferences = (client.preferences || [])
    .filter((rule) => !suppressed.has(rule.value) && preferenceMatches(rule, pieces));
  const preferencePointValue = currentBrief.playerChoice ? 15 : 8;
  const rawPreferenceScore = matchedPreferences.reduce((sum, rule) => sum + preferenceMatchWeight(rule, pieces) * preferencePointValue, 0);
  const preferenceBonus = currentBrief.playerChoice ? Math.min(rawPreferenceScore, 60) : rawPreferenceScore;
  const preferenceCapped = currentBrief.playerChoice && rawPreferenceScore > 60;

  // A preference scores the moment it's matched, discovered or not (per the
  // doc: "Discovery is knowledge progression, not an unlock for the
  // character's taste") — but it only permanently joins her profile, and
  // only gets the "new preference discovered" callout, the first time.
  const newlyDiscovered = matchedPreferences.filter((rule) => !profile.discovered.includes(preferenceKey(rule)));
  newlyDiscovered.forEach((rule) => profile.discovered.push(preferenceKey(rule)));

  // A signature color combo they personally love.
  let comboBonus = 0;
  let comboNewlyDiscovered = false;
  if (client.combo && client.combo.colors.every((c) => pieces.some((p) => p.color === c))) {
    comboBonus = client.combo.bonus;
    const comboKey = "combo:" + client.combo.colors.join(" + ");
    if (!profile.discovered.includes(comboKey)) {
      profile.discovered.push(comboKey);
      comboNewlyDiscovered = true;
    }
  }

  // Seasonal event bonus — only during the festival's peak month, and only
  // when something already worn happens to fit the occasion.
  const activeEvent = currentMonthEvent();
  const eventDef = activeEvent ? EVENT_BONUSES[activeEvent] : null;
  let eventBonus = 0;
  if (eventDef) {
    const fits = pieces.some((p) =>
      (eventDef.styles && (eventDef.styles.includes(p.style) || eventDef.styles.includes(p.style2))) ||
      (eventDef.colors && eventDef.colors.includes(p.color)) ||
      (eventDef.categories && eventDef.categories.includes(p.category)) ||
      (eventDef.rarities && eventDef.rarities.includes(p.rarity))
    );
    if (fits) eventBonus = 10;
  }

  // A little grace for the first few clients, so the scoring system doesn't
  // feel punishing before the player has learned how matching works. Fades
  // out completely by the 4th visit.
  const WELCOME_BONUS = [20, 12, 6];
  const welcomeBonus = currentYear === 1 ? (WELCOME_BONUS[clientRoundIndex] || 0) : 0;

  const score = briefScore + rarityBonus + preferenceBonus + comboBonus + eventBonus + welcomeBonus;

  // Small penalties for real gaps in the outfit. A jacket (or an accessory)
  // is a bonus layer, never required — but going out with no shoes, or no
  // top/bottom when not wearing a dress, is a real miss worth noting.
  const hasDress = pieces.some((p) => p.category === "Dress");
  const hasShoes = pieces.some((p) => p.category === "Shoes");
  const hasTop = pieces.some((p) => p.category === "Top");
  const hasBottom = pieces.some((p) => p.category === "Bottom");
  let gapPenalty = 0;
  const gaps = [];
  if (!hasShoes) { gapPenalty -= 10; gaps.push("No shoes"); }
  if (!hasDress && !hasTop) { gapPenalty -= 10; gaps.push("No top"); }
  if (!hasDress && !hasBottom) { gapPenalty -= 10; gaps.push("No bottom"); }
  let scoreWithGaps = score + gapPenalty;

  // A complete matching set, but only when the outfit already works. Resolved
  // before totalScore/delightedCount/etc so a newly-discovered set's +20
  // is reflected consistently everywhere the score is used below.
  let setBonusName = null;
  let setBonusId = null;
  let setNewlyDiscovered = false;
  let setBonusCard = null;
  let setPiecesUsed = [];
  if (scoreWithGaps >= 70) {
    const completed = Object.entries(SET_NAMES).find(([setId]) => {
      const setPieces = pieces.filter((p) => p.set === setId);
      const uniqueIds = new Set(setPieces.map((p) => p.id));
      return uniqueIds.size >= 2;
    });
    if (completed) {
      setBonusName = completed[1];
      setBonusId = completed[0];
      setPiecesUsed = pieces.filter((p) => p.set === completed[0]);
      if (!discoveredSets.has(completed[0])) {
        discoveredSets.add(completed[0]);
        setNewlyDiscovered = true;
        scoreWithGaps += 20;
        const rewarded = unlockRandomCards(1);
        if (rewarded.length > 0) {
          rebuildLiveDeckFromUnlocked();
          deckPile.push(rewarded[0].id);
          setBonusCard = rewarded[0];
        }
      }
    }
  }

  totalScore += scoreWithGaps;
  if (scoreWithGaps >= 70) delightedCount += 1;

  let moonCoinsEarned = 0;
  if (scoreWithGaps >= 70) { moonCoins += 1; moonCoinsEarned = 1; } // a genuinely good outfit, not just a perfect one

  let relDelta = scoreWithGaps >= 70 ? 0.5 : 0;
  if (matchedPreferences.length > 0) relDelta += 0.5;
  if (setBonusName) relDelta += 0.5;

  // A single job — however perfect — is one relationship-building moment,
  // not three. Capped at a full heart per visit; the relationship itself
  // caps at 5 hearts total, since this is meant to be a year-long arc, not
  // something maxed out after a handful of good outfits.
  relDelta = Math.min(relDelta, 1);
  relationships[key] = Math.min(5, (relationships[key] || 0) + relDelta);

  // Track this client's best-ever outfit, cards and all, for her profile.
  if (profile.bestScore === null || scoreWithGaps > profile.bestScore) {
    profile.bestScore = scoreWithGaps;
    profile.bestPieces = pieces.map((p) => p.id);
  }

  // Run the normal styling result first, then check the submitted outfit
  // against every undiscovered Aesthetic Achievement recipe. Popups for any
  // matches are shown after the result screen renders (see renderResult()).
  achievementPopupQueue.push(...evaluateAestheticAchievements(pieces));

  discardPile.push(...pieces.map((p) => p.id));
  deckPile.push(...hand);
  hand = [];

  const wantResults = wantList.map((r) => ({
    label: r.label, matched: pieces.some((p) => reqMatches(r, p)),
  }));

  const breakdown = {
    briefScore, briefCapped, rarityBonus, comboBonus, eventBonus, activeEvent, welcomeBonus, gaps, pieceDetails,
    preferenceBonus, preferencePointValue, preferenceCapped, matchedPreferences, newlyDiscovered,
    playerChoice: !!currentBrief.playerChoice,
    comboName: client.combo && comboBonus > 0 ? client.combo.colors.join(" + ") : null,
    comboNewlyDiscovered, setNewlyDiscovered, setBonusCard, setBonusId, setPiecesUsed, bestPiece,
  };

  renderResult(client, scoreWithGaps, wantResults, relDelta, moonCoinsEarned, breakdown, setBonusName);
}

function renderResult(client, score, wantResults, relDelta, moonCoinsEarned, breakdown, setBonusName) {
  let reaction, headline, line;
  if (score >= 100) { reaction = "PERFECT"; headline = "Absolutely delighted!"; line = `${client.name.split(",")[0]} is speechless. This is exactly what they pictured — and then some.`; }
  else if (score >= 70) { reaction = "LOVED IT"; headline = "Delighted."; line = `${client.name.split(",")[0]} twirls once, satisfied. Exactly the vibe they were after.`; }
  else if (score >= 35) { reaction = "MEH"; headline = "It'll do."; line = `${client.name.split(",")[0]} shrugs. Not quite what they pictured, but wearable.`; }
  else { reaction = "OUCH"; headline = "Not it."; line = `${client.name.split(",")[0]} sighs. This is going to haunt them — figuratively, this time.`; }

  // Combine heart/coin/set bonus into one compact box instead of three stacked lines.
  const bondLines = [];
  bondLines.push(relDelta > 0
    ? `+${relDelta} ❤ with ${client.name.split(",")[0]} (now ${heartsHTML(relationships[currentClientKey()])})`
    : `No change in your bond with ${client.name.split(",")[0]}.`);
  if (moonCoinsEarned > 0) bondLines.push(`🌙 +${moonCoinsEarned} mooncoin${moonCoinsEarned > 1 ? "s" : ""}`);
  if (setBonusName) bondLines.push(`✨ Full ${setBonusName} worn together`);
  const bondHTML = `<div class="result-box"><h4>Bond &amp; rewards</h4>${bondLines.map((l) => `<p>${l}</p>`).join("")}</div>`;

  // Aggregate breakdown — always shown, so the math is never a mystery.
  const briefLabel = breakdown.briefCapped ? "Brief match (capped)" : "Brief match";
  const preferenceRows = breakdown.playerChoice
    ? [{
        label: breakdown.preferenceCapped
          ? `Hidden preferences matched (${breakdown.matchedPreferences.length}, capped)`
          : `Hidden preferences matched (${breakdown.matchedPreferences.length})`,
        value: breakdown.preferenceBonus,
      }]
    : breakdown.matchedPreferences.map((rule) => ({ label: `Loves ${preferenceLabel(rule).toLowerCase()}`, value: breakdown.preferencePointValue }));
  const breakdownRows = [
    breakdown.playerChoice ? null : { label: briefLabel, value: breakdown.briefScore },
    breakdown.rarityBonus > 0 ? { label: "Rarity bonus", value: breakdown.rarityBonus } : null,
    ...preferenceRows,
    breakdown.comboBonus > 0 ? { label: `${breakdown.comboName} combo`, value: breakdown.comboBonus } : null,
    breakdown.eventBonus > 0 ? { label: `${EVENT_LABELS[breakdown.activeEvent]} bonus`, value: breakdown.eventBonus } : null,
    breakdown.welcomeBonus > 0 ? { label: "New stylist grace", value: breakdown.welcomeBonus } : null,
    ...breakdown.gaps.map((g) => ({ label: g, value: -10 })),
  ].filter(Boolean);

  const breakdownHTML = `
    <div class="result-box">
      <h4>Score breakdown</h4>
      ${breakdownRows.map((r) => `<div class="score-row"><span>${r.label}</span><span>${r.value >= 0 ? "+" : ""}${r.value}</span></div>`).join("")}
      <div class="score-row total"><span>Total</span><span>${score}</span></div>
    </div>
  `;

  // Per-item detail — exactly what each worn piece did or didn't do, and why.
  const itemRows = breakdown.pieceDetails.map((d) => {
    const bits = [];
    if (d.matchedAttrs.length > 0) {
      bits.push(d.matchedAttrs.map((r) => r.label.toLowerCase()).join(", ") + ` (+${d.briefPts})`);
    }
    if (d.rarityPts > 0) bits.push(`${d.piece.rarity} (+${d.rarityPts})`);
    const verdict = bits.length > 0 ? bits.join(" · ") : "no match, no bonus";
    return `<p><b>${d.piece.name}</b><br>${verdict}</p>`;
  }).join("");
  const itemHTML = `<div class="result-box"><h4>How each piece performed</h4>${itemRows}</div>`;

  const bestPieceHTML = breakdown.bestPiece
    ? `
    <div class="result-box best-piece-box">
      <h4>Best performing piece</h4>
      <div class="new-card-item" style="width:80px; margin:4px auto 6px;">${gcardHTML(breakdown.bestPiece)}</div>
      <p style="text-align:center;">${breakdown.bestPiece.name}</p>
    </div>
  `
    : "";

  const wantHTML = breakdown.playerChoice
    ? `<div class="result-box"><h4>The brief</h4><p>No hard ask this time — she wanted your judgment. Scored from the hidden preferences your outfit represented.</p></div>`
    : `
    <div class="result-box">
      <h4>The brief</h4>
      ${wantResults.map((w) => `<p>${w.matched ? "🩷" : "💔"} ${w.matched ? "Loved" : "Missed"} ${w.label}</p>`).join("")}
    </div>
  `;

  // Per the doc's discovery rule: the first time a worn piece matches one of
  // her hidden preferences, it's called out and permanently joins her
  // profile (see openSouls()) — never shown again as "new" after that.
  const discoveryItems = [
    ...breakdown.newlyDiscovered.map((rule) => `${client.name.split(",")[0]} likes ${preferenceLabel(rule).toLowerCase()}.`),
    ...(breakdown.comboNewlyDiscovered ? [`${client.name.split(",")[0]} loves ${breakdown.comboName} worn together.`] : []),
  ];
  const discoveryHTML = discoveryItems.length > 0
    ? `
    <div class="result-box discovery-box">
      <h4>New preference${discoveryItems.length > 1 ? "s" : ""} discovered</h4>
      ${discoveryItems.map((line) => `<p>✨ ${line}</p>`).join("")}
    </div>
  `
    : "";


  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="reaction">${reaction}</div>
      <h2>${headline}</h2>
      <div class="score">Match score: ${score}</div>
      <p class="breakdown-hint">${breakdown.playerChoice ? "No hard requirements this time — the whole score comes from her hidden preferences, at +15 each (capped at +60)." : "Each matched brief attribute is worth 25 — one piece can only satisfy each attribute once, so wear more pieces that reinforce the ask to climb higher."}</p>
      <div class="result-grid">
        ${wantHTML}
        ${discoveryHTML}
        ${breakdownHTML}
        ${itemHTML}
        ${bestPieceHTML}
        ${bondHTML}
      </div>
      <div class="line">${line}</div>
      <button class="primary" onclick="advanceMonth()">Next client</button>
    </div>
  `;
  updateTopBar("", true);
  if (breakdown.setNewlyDiscovered) {
    showSetDiscoveryPopup(setBonusName, breakdown.setBonusId, breakdown.setPiecesUsed, breakdown.setBonusCard);
  } else {
    showNextAchievementPopup();
  }
}

function setOwnedCount(setId) {
  const setCards = DECK.filter((c) => c.set === setId);
  const owned = setCards.filter((c) => unlockedCardIds.has(c.id));
  return { owned: owned.length, total: setCards.length };
}

function showSetDiscoveryPopup(setName, setId, piecesUsed, rewardCard) {
  const { owned, total } = setOwnedCount(setId);
  const overlay = document.createElement("div");
  overlay.className = "set-discovery-overlay";
  const piecesHTML = piecesUsed.map((p) => `<div class="set-piece-thumb">${gcardHTML(p)}<span>${p.name}</span></div>`).join("");
  overlay.innerHTML = `
    <div class="set-discovery-card">
      <div class="set-discovery-badge">SET DISCOVERED</div>
      <h2>${setName}</h2>
      <p class="set-discovery-count">${owned} of ${total} pieces in your closet</p>
      <div class="set-piece-row">${piecesHTML}</div>
      <div class="set-discovery-rewards">
        <div>+20 to this outfit's score</div>
        ${rewardCard ? `<div>A new piece for your closet</div>` : ""}
      </div>
      ${rewardCard ? `<div class="new-card-item" style="width:120px; margin:10px auto;">${gcardHTML(rewardCard)}</div>` : ""}
      <button class="primary" onclick="closeSetDiscoveryOverlay(this)">Nice.</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

// Closing the set-discovery popup is the hand-off point into the achievement
// popup queue, so the two never stack on top of each other.
function closeSetDiscoveryOverlay(btn) {
  const overlay = btn.closest(".set-discovery-overlay");
  if (overlay) overlay.remove();
  showNextAchievementPopup();
}

// Shows the next queued achievement discovery, one at a time — per the doc,
// several new achievements from one outfit are shown sequentially. Persists
// the discovery only when its popup is actually confirmed.
function showNextAchievementPopup() {
  if (achievementPopupQueue.length === 0) return;
  const id = achievementPopupQueue.shift();
  if (discoveredAestheticAchievements.has(id)) { showNextAchievementPopup(); return; }
  const ach = AESTHETIC_ACHIEVEMENTS.find((a) => a.id === id);
  if (!ach) { showNextAchievementPopup(); return; }
  discoveredAestheticAchievements.add(id);

  const overlay = document.createElement("div");
  overlay.className = "set-discovery-overlay";
  const reqsHTML = ach.requirementsText.map((r) => `<p>✓ ${r}</p>`).join("");
  overlay.innerHTML = `
    <div class="set-discovery-card">
      <div class="set-discovery-badge">ACHIEVEMENT DISCOVERED</div>
      <h2>${ach.name}</h2>
      <div class="ach-popup-reqs">${reqsHTML}</div>
      <p class="ach-popup-lore">"${ach.lore}"</p>
      <button class="primary" onclick="this.closest('.set-discovery-overlay').remove(); showNextAchievementPopup();">Continue</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

// Seasonal calendar — exact story-screen text from the narrative bible.
// Only the "peak" festival months carry a scoring bonus; the "coming soon"
// screens are pure atmosphere, matching the bible's "mystery first, often
// zero story screens" guardrail.
// 36 jobs/year, 3 per month, per the bible. clientRoundIndex is the absolute
// job counter (0-35); month and position-within-month are both derived from it.
function currentMonthIndex() { return Math.floor(clientRoundIndex / 3) % 12; }
function positionInMonth() { return clientRoundIndex % 3; }

// Scheduled per (month, position-in-month) so a month with 3 jobs can carry
// more than one beat — e.g. December gets Winter Solstice mid-month and Dead
// Day at its close, matching the bible's actual chronology.




// Event attribute bonuses — only on the peak festival month, and only when
// a worn piece already matches, per the bible's "compatible with the ask" rule.



function currentMonthEvent() { return EVENT_SCHEDULE[`${currentMonthIndex()}-${positionInMonth()}`] || null; }

function renderStoryScreen(key, onContinue) {
  const screen = EVENT_SCREENS[key];
  const linesHTML = screen.lines.map((l) => `<p style="margin:4px 0;">${l}</p>`).join("");
  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="line" style="max-width:340px;">${linesHTML}</div>
      <button class="primary" style="margin-top:22px;" onclick="${onContinue}">${screen.button}</button>
    </div>
  `;
  updateTopBar("", true);
}

let lastEventKey = null; // which EVENT_SCHEDULE key (if any) just resolved -- read once by afterEventContinue()

function advanceMonth() {
  const completedJob = clientRoundIndex;
  const eventKey = (completedJob === 0 && currentYear === 1) ? "firstDay" : EVENT_SCHEDULE[`${currentMonthIndex()}-${positionInMonth()}`];
  lastEventKey = eventKey;
  clientRoundIndex += 1;
  pendingSeasonEnd = SEASON_END_JOBS.includes(completedJob);
  if (eventKey) {
    renderStoryScreen(eventKey, "afterEventContinue()");
  } else {
    afterEventContinue();
  }
}

// --- Valery's Year 2 Summer Solstice special job (Characters spec §7.3) ---
// Hooked in right here per spec: "immediately after the existing Summer
// Solstice story screen has been shown for June and before returning to
// the map" -- this is exactly that point in the flow, before any of
// afterEventContinue()'s normal season-end/map logic runs.



function renderValerySolsticeInvitation() {
  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="line" style="max-width:340px;">
        <p>A black envelope is waiting outside the Studio. Your name is written across it in gold ink.</p>
        <p>Inside: "Valery requests your services for the Summer Solstice. Tonight. Naturally."</p>
      </div>
      <button class="primary" style="margin-top:22px;" onclick="renderValerySolsticeGate()">Go to the Castle</button>
    </div>
  `;
  updateTopBar("", true);
}
function renderValerySolsticeGate() {
  markSeasonalReactionSeen("valery", "summerSolstice"); // per §12.5: folded in below, not played standalone this visit
  renderCastleScene([
    { who: "HELENA", t: "You're expected." },
    { who: "YOU", t: "That sounded painful." },
    { who: "HELENA", t: "It was unfamiliar." },
    { who: "VALERY", t: "There you are." },
    { who: "VALERY", t: "Solstice is the one night everyone tries terribly hard to look effortless." },
    { who: "YOU", t: "Including you?" },
    { who: "VALERY", t: "Especially me." },
    { who: "YOU", t: "Your letter made it sound like an emergency." },
    { who: "VALERY", t: "It is. Everyone in that Castle has already seen me looking beautiful." },
    { who: "YOU", t: "Tragic." },
    { who: "VALERY", t: "I'd like them to see something new." },
    { who: "YOU", t: "What do you want?" },
    { who: "VALERY", t: "Elegant. Classic enough for Solstice. Not obedient." },
  ], "Continue", "beginValerySolsticeRound()");
}
function beginValerySolsticeRound() {
  startSpecialRound(VALERY_VIRTUAL, VALERY_SOLSTICE_BRIEF, { type: "valery_solstice" });
  renderStyle();
}
function resolveValerySolstice(score) {
  valerySolsticeCompleted = true;
  let lines, statusLine;
  if (score >= 90) {
    royalGardenKeyFallbackNeeded = false;
    awardKeyCard("key_royalgarden");
    lines = [
      { who: "VALERY", t: "Oh." }, { who: "YOU", t: "That good?" },
      { who: "VALERY", t: "That's irritating." }, { who: "YOU", t: "What is?" },
      { who: "VALERY", t: "You're good." },
    ];
    statusLine = { who: "NARRATION", t: "The Royal Garden Key is yours." };
  } else if (score >= 70) {
    royalGardenKeyFallbackNeeded = true;
    lines = [
      { who: "VALERY", t: "Good. Almost annoyingly good." }, { who: "YOU", t: "Almost?" },
      { who: "VALERY", t: "Don't fish." },
    ];
    statusLine = { who: "NARRATION", t: "Not quite enough for a key tonight — but Valery isn't finished with you yet." };
  } else {
    royalGardenKeyFallbackNeeded = true;
    lines = [
      { who: "NARRATION", t: "Valery studies the outfit." },
      { who: "VALERY", t: "We'll call this rehearsal." }, { who: "YOU", t: "That's generous." },
      { who: "VALERY", t: "I know." },
    ];
    statusLine = { who: "NARRATION", t: "No key tonight — but Valery isn't finished with you yet." };
  }
  renderCastleScene([...lines, statusLine], "Leave", "renderMap()");
}

function afterEventContinue() {
  const justFinishedEvent = lastEventKey;
  lastEventKey = null;

  if (justFinishedEvent === "summerSolstice" && currentYear === 2 && !valerySolsticeCompleted) {
    if (!metValery) metValery = true; // VALERY_FIRST_EXIT runs implicitly if somehow not yet met, per spec
    renderValerySolsticeInvitation();
    return;
  }

  if (pendingSeasonEnd) {
    pendingSeasonEnd = false;
    const newCards = unlockRandomCards(CARDS_PER_SEASON_UNLOCK);
    rebuildLiveDeckFromUnlocked();
    deckPile.push(...newCards.map((c) => c.id));
    renderNewCardsScreen(newCards);
    return;
  }
  if (clientRoundIndex >= 36) { renderEnd(); return; }
  renderMap();
}

function renderNewCardsScreen(newCards) {
  const cardsHTML = newCards.map((c, i) => `
    <div class="flip-card" id="flip-${i}" onclick="flipNewCard(${i})">
      <div class="flip-card-inner">
        <div class="flip-card-face flip-card-front"><div class="back-card-face"></div></div>
        <div class="flip-card-face flip-card-back">${gcardHTML(c)}</div>
      </div>
    </div>
  `).join("");
  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <h2>New cards.</h2>
      <p class="line" style="margin-bottom:18px;">A black crow lands on your balcony and brings you a small sachet with new cards. Word gets around when a stylist earns her keep. A few new pieces for your collection.</p>
      <p class="breakdown-hint" style="margin-bottom:14px;">Tap each card to turn it over.</p>
      <div class="new-cards-grid">${cardsHTML}</div>
      <button class="primary" style="margin-top:22px;" onclick="afterSeasonReveal()">Continue</button>
    </div>
  `;
  updateTopBar("", true);
}

function flipNewCard(i) {
  const el = document.getElementById(`flip-${i}`);
  if (el) el.classList.toggle("flipped");
}

function afterSeasonReveal() {
  if (clientRoundIndex >= 36) { renderEnd(); return; }
  renderMap();
}

function renderEnd() {
  const rows = CLIENTS.map((c, i) => `
    <div class="year-row"><span><span class="soul-swatch" style="background:${c.color};"></span> ${c.name}</span><span class="hearts">${heartsHTML(relationships[i] || 0)}</span></div>
  `).join("");

  // Reward: one new piece for every 3 "Delighted" outcomes this year, drawn
  // from real still-uncollected wardrobe cards (same pool unlockRandomCards()
  // uses for the quarterly unlocks) rather than a separate placeholder set.
  const stillLocked = DECK.filter((c) => !unlockedCardIds.has(c.id)).length;
  const rewardCount = Math.min(Math.floor(delightedCount / 3), stillLocked);
  const earned = unlockRandomCards(rewardCount);
  rebuildLiveDeckFromUnlocked();

  // No renderMap() call happens on this screen until the player chooses to
  // continue (Enter Year Two) or restarts, so checkpoint here too -- an
  // exited tab right on this screen shouldn't lose the year-end reward.
  saveGame();

  const rewardLine = earned.length > 0
    ? `<p style="color:var(--gold);">Word got around about your work — ${earned.length} new piece${earned.length > 1 ? "s" : ""} joined your closet for next time: ${earned.map((c) => c.name).join(", ")}.</p>`
    : `<p style="color:var(--muted);">No new pieces earned this year — delight more clients (3 "Delighted" outfits earns one) to grow your closet.</p>`;

  const isYearOne = currentYear === 1;
  const heading = isYearOne ? "One year in After City." : "Two years in After City.";
  const narrativeLines = isYearOne
    ? [
        "One year.",
        "Thirty-six jobs.",
        "More cards than you started with.",
        "More questions too.",
        "After City feels less unfamiliar now.",
        "That may not be the same thing as understanding it.",
      ]
    : [
        "Two years.",
        "Seventy-two jobs.",
        "Faces you now recognize on sight.",
        "Doors that used to be walls.",
        "After City still isn't explaining itself.",
        "You've stopped expecting it to.",
      ];
  const narrativeHTML = narrativeLines.map((l) => `<p style="margin:4px 0;">${l}</p>`).join("");

  const closingLine = isYearOne
    ? "A real version would keep going indefinitely and let relationships unlock new kinds of requests."
    : "Year Three and beyond — Armor, Angels and Devils, the Knighting — is its own future chapter.";

  // Year 1 offers a real choice (continue the same run into Year 2, or start
  // over). Year 2 is the end of this content pass, so only Restart remains —
  // per spec, do NOT start Year 3 here.
  const buttonsHTML = isYearOne
    ? `
      <button class="primary" onclick="enterYearTwo()">Enter Year Two</button>
      <button class="ghost" style="margin-top:10px;" onclick="renderIntro()">Restart prototype</button>
    `
    : `<button class="ghost" onclick="renderIntro()">Restart prototype</button>`;

  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="reaction">🕯️</div>
      <h2>${heading}</h2>
      <div class="line" style="max-width:320px; margin-bottom:18px;">${narrativeHTML}</div>
      <div class="score">Total score across 36 jobs this year: ${totalScore}</div>
      <div class="score" style="margin-bottom:18px;">${delightedCount} client${delightedCount === 1 ? "" : "s"} were delighted with your work.</div>
      <div class="year-list">${rows}</div>
      ${rewardLine}
      <div class="line">${closingLine}</div>
      ${buttonsHTML}
    </div>
  `;
}

// Year 1→2 transition (Characters spec §17). This is a CONTINUATION of the
// same run, not a call into beginGame() — collection, Moon Coins,
// relationships, discovered facts, keys, unlocked locations and
// secondary-character flags all survive. Only the yearly counters reset.
function enterYearTwo() {
  currentYear = 2;
  clientRoundIndex = 0;
  totalScore = 0;
  delightedCount = 0;
  pendingSeasonEnd = false;
  currentShopItem = null;
  Object.keys(soulProfiles).forEach((key) => { soulProfiles[key].yearVisits = 0; });
  // Pick up any cards earned as the Year 1 reward (see renderEnd()) so they're
  // actually drawable from the very first Year 2 Studio visit.
  rebuildLiveDeckFromUnlocked();
  renderMap();
}

renderIntro();
</script>
