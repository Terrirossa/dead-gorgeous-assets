<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dead Gorgeous — Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

  :root {
    --card-bg: #fdfcfb;
    --ink: #241f2e;
    --pink: #ffb6d9;
    --lilac: #cdb6ff;
    --mint: #b8f2d0;
    --gold: #ffe08a;
    --muted: #7a7186;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { overflow-x: hidden; }
  html { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    overflow-y: hidden;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at 20% 10%, #4a3a5c, #211a2c 70%);
    color: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overscroll-behavior: none;
  }

  .stage { width: 100%; max-width: 480px; overflow-x: hidden; }

  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }

  button.primary {
    background: linear-gradient(90deg, var(--pink), var(--lilac));
    color: var(--ink);
    border: none;
    padding: 15px 34px;
    border-radius: 999px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  button.primary:hover { transform: scale(1.04); }
  button.primary:disabled { opacity: 0.35; cursor: default; transform: none; }

  button.ghost {
    background: transparent;
    color: #d8d1e6;
    border: 1.5px solid #6b5f80;
    padding: 12px 26px;
    border-radius: 999px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  .center-col { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .screen-pad { padding: 60px 10px; }

  .intro h1 {
    font-size: 42px; font-weight: 600; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--pink), var(--lilac), var(--mint));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .intro p, .shuffle p, .result .line {
    font-size: 16px; color: #d8d1e6; line-height: 1.6; max-width: 380px; margin: 0 auto 30px;
  }

  .title-screen {
    min-height: 100vh; margin: -20px -10px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .title-panel {
    width: 100%;
    padding: 60px 24px 50px;
    text-align: center;
  }
  .title-headline {
    font-size: 26px; margin-bottom: 14px; font-weight: 700;
    background: linear-gradient(90deg, var(--pink), var(--lilac), var(--mint));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
  }
  .title-panel p { font-size: 15px; color: #d8d1e6; line-height: 1.6; max-width: 360px; margin: 0 auto 26px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

  /* ---------- Shuffle screen ---------- */
  .shuffle-deck { position: relative; width: 160px; height: 210px; margin: 10px auto 26px; }
  .back-card {
    position: absolute; inset: 0; margin: auto; width: 122px; aspect-ratio: 595.28 / 841.9; border-radius: 16px;
    padding: 4px; background: conic-gradient(from 180deg at 50% 50%, #ffd9e6, #d9f2ff, #e2ffd9, #fff6c2, #f0d9ff, #ffd9e6);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3); transform: translateY(calc(var(--i) * -1.6px));
    transition: transform 0.45s cubic-bezier(0.3, 0.8, 0.4, 1);
  }

  .shuffle-deck.split .back-card:nth-child(even) { transform: translate(-72px, -8px) rotate(-16deg); }
  .shuffle-deck.split .back-card:nth-child(odd)  { transform: translate(72px, -8px) rotate(16deg); }

    transform: translateY(calc(var(--i) * -1.6px)) rotate(0deg);
    transition-delay: calc(var(--i) * 45ms);
  }

  /* ---------- Meet-soul screen ---------- */
  .portrait {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 14px;
    background: #cdb6ff;
  }
  .soul-name { font-size: 20px; color: #fff; margin-bottom: 6px; }
  .soul-hearts { margin-bottom: 16px; }
  .returning-note { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-style: italic; }

  .top-nav { display: none; } /* legacy, unused */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; gap: 10px;
    background: linear-gradient(180deg, rgba(20,14,26,0.55), transparent);
  }
  .top-bar.hidden { display: none; }
  .top-bar-left { flex: 1; min-width: 0; font-size: 13px; color: #ece7f4; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-bar-left b { color: var(--gold); }
  .top-bar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .top-bar-info { font-size: 13px; color: #cfc6de; white-space: nowrap; }
  .top-bar-info .coins { color: var(--gold); font-weight: 600; }
  .deck-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; cursor: pointer; color: #ece7f4;
  }
  .deck-btn svg { width: 17px; height: 17px; }
  .joker-btn.used { opacity: 0.3; pointer-events: none; }

  .question-list { display: flex; flex-direction: column; gap: 8px; max-width: 380px; margin: 0 auto 18px; }
  .question-chip {
    text-align: left; font-size: 13.5px; padding: 12px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.16); color: #ece7f4;
  }
  .question-chip:hover { border-color: var(--pink); }
  .asked-question { font-size: 12.5px; color: var(--muted); font-style: italic; margin-bottom: 8px; }

  .souls-list { display: flex; flex-direction: column; gap: 14px; max-width: 480px; margin: 0 auto; }
  .soul-profile-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; }
  .soul-profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .soul-facts { display: flex; flex-direction: column; gap: 8px; }

  .map-screen {
    min-height: 100vh; margin: -20px -10px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 80px 10px 60px !important;
  }
  .map-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    max-width: 320px; margin: 0 auto;
  }
  .map-tile {
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: 18px; padding: 40px 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease;
    backdrop-filter: blur(2px);
  }
  .map-tile:hover { transform: translateY(-2px); border-color: var(--pink); }
  .map-tile.locked { opacity: 0.55; }
  .map-tile.locked:hover { transform: none; border-color: rgba(255,255,255,0.14); }
  .map-tile-label { font-size: 15px; font-weight: 600; color: #ece7f4; text-align: center; letter-spacing: 0.02em; }
  .map-tile-label .lock { font-size: 13px; opacity: 0.8; }
  .map-message { min-height: 20px; margin-top: 18px; font-size: 12.5px; color: var(--gold); text-align: center; max-width: 300px; }

  .shop-mystery-card { width: 160px; margin: 10px auto 16px; }
  .shop-mystery-card .gcard { aspect-ratio: 595.28 / 841.9; }
  .speech {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 18px;
    padding: 20px 24px; font-size: 15.5px; color: #ece7f4; line-height: 1.55; max-width: 380px; margin: 0 auto 26px;
  }
  .want-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }

/* ---------------- STATE ---------------- */

// These two persist across restarts within the same page load — a good
// year's reward should still be there next time you play.
let metaUnlocked = [];
let unlockPool = shuffle(EXTRA_CARDS);
let shopPool = shuffle(SHOP_CARDS);
const MYSTERY_PRICE = 8;
let mapMessage = "";
let restrictedPhase = { castle: 0, garden: 0 };
let moonCoins = 0; // persists across restarts, like metaUnlocked — this is a currency

let deckPile = [];
let liveDeck = [];
let jokerAvailable = true;
let selectedHandId = null; // hand card lifted (tapped) but not yet dropped
let discardPile = [];
let discoveredSets = new Set();
let hand = [];
let outfit = [null, null, null, null]; // 4 free slots, any card in any slot
let clientRoundIndex = 0;
let relationships = {};
let soulProfiles = {};   // per-client: { visits, answered: [ids], facts: [{q,a}] }
let roundIsFirstMeeting = false;
let pendingQuestion = null;
let currentBrief = null; // { text, want } — chosen fresh each round
let totalScore = 0;
let delightedCount = 0; // "Delighted" (score >= 70) outcomes this session
let soulStep = 0;
let dialogueLineIndex = 0;
let dragState = null;
let slotDragState = null;

const stage = document.getElementById("stage");

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function currentClient() { return CLIENTS[clientRoundIndex % CLIENTS.length]; }
function currentClientKey() { return clientRoundIndex % CLIENTS.length; }
function findCard(id) { return liveDeck.find((c) => c.id === id); }

function heartsHTML(n) {
  const filled = Math.min(n, 5);
  const str = "❤".repeat(filled) + "🤍".repeat(5 - filled);
  return n > 5 ? `${str} (${n})` : str;
}

/* ---------------- ROUND SETUP ---------------- */

function startRound() {
  outfit = [null, null, null, null];
  pendingQuestion = null;
  jokerAvailable = true;
  selectedHandId = null;

  const key = currentClientKey();
  const profile = soulProfiles[key];
  roundIsFirstMeeting = profile.visits === 0;
  profile.visits += 1;
  soulStep = 0;
  dialogueLineIndex = 0;
  const briefs = CLIENTS[key].briefs;
  currentBrief = briefs[Math.floor(Math.random() * briefs.length)];

  if (deckPile.length < HAND_SIZE) {
    deckPile = deckPile.concat(shuffle(discardPile));
    discardPile = [];
  }
  const handIds = drawBalancedHand(deckPile);
  deckPile = deckPile.filter((id) => !handIds.includes(id));
  hand = handIds;
}

// Draw a hand that always tries to cover Jacket, Top-or-Dress, Bottom, and
// Shoes first, so you're never stuck holding five of the same category.
function drawBalancedHand(pool) {
  let remaining = [...pool];
  const picked = [];

  function takeOneOf(categories) {
    const candidates = remaining.filter((id) => categories.includes(findCard(id).category));
    if (candidates.length === 0) return;
    const choice = candidates[Math.floor(Math.random() * candidates.length)];
    remaining = remaining.filter((id) => id !== choice);
    picked.push(choice);
  }

  takeOneOf(["Jacket"]);
  takeOneOf(["Top", "Dress"]);
  takeOneOf(["Bottom"]);
  takeOneOf(["Shoes"]);

  while (picked.length < HAND_SIZE && remaining.length > 0) {
    const idx = Math.floor(Math.random() * remaining.length);
    picked.push(remaining[idx]);
    remaining.splice(idx, 1);
  }
  return picked;
}

/* ---------------- SCREENS ---------------- */

function renderIntro() {
  document.getElementById("topBar").classList.add("hidden");
  stage.innerHTML = `
    <div class="title-fullscreen-bg"></div>
    <div class="title-screen">
      <div class="title-panel">
        <h2 class="title-headline">Taste never dies.</h2>
        <p>You died on a Tuesday. Mildly inconvenient. However work never ends. Now you got the job as the stylist of the afterlife — dressing souls for whatever comes now and next.</p>
        <button class="primary" onclick="beginGame()">Start game</button>
      </div>
    </div>
  `;
}

function beginGame() {

function renderSoul() {
  const client = currentClient();
  const key = currentClientKey();
  const rel = relationships[key] || 0;

  const wantTags = Object.entries(currentBrief.want).map(([k, v]) => `<span class="want-tag">${k}: ${v}</span>`).join("");
  const returningNote = rel > 0 ? `<div class="returning-note">You've styled ${client.name.split(",")[0]} before.</div>` : "";

  const stageSet = CLIENT_STAGES[key];

  let body;
  if (stageSet && soulStep === 0) {
    // A real, numbered exchange from the bible — one new stage per visit,
    // stepped through one line at a time like an actual back-and-forth.
    const profile = soulProfiles[key];
    const stageIndex = Math.min(profile.visits - 1, stageSet.length - 1);
    const stage = stageSet[stageIndex] || FALLBACK_STAGE;
    const line = stage[dialogueLineIndex];
    const isYou = line.who === "YOU";
    const speakerLabel = isYou ? "You" : client.name.split(",")[0];
    body = `
      <div class="speech" style="${isYou ? "background:rgba(255,255,255,0.06);" : ""}">
        <b style="display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px;">${speakerLabel}</b>
        ${line.t}
      </div>
      <button class="primary" onclick="advanceDialogueLine()">…</button>
    `;
  } else if (soulStep === 0) {
    body = `<div class="speech">${client.greeting}</div><button class="primary" onclick="advanceSoul()">…</button>`;
  } else if (soulStep === 1) {
    const available = unansweredQuestions(key);
    const chips = available.map((q) => `<button class="ghost question-chip" onclick="askQuestion('${q.id}')">${q.prompt}</button>`).join("");
    body = `
      <div class="speech">\u201CAnything you'd like to ask before we start?\u201D</div>
      <div class="question-list">${chips}</div>
      <button class="primary" onclick="skipQuestion()">Let's just get started</button>
    `;
  } else if (soulStep === 2) {
    body = `
      <div class="asked-question">${pendingQuestion.prompt}</div>
      <div class="speech">${pendingQuestion.answer}</div>
      <button class="primary" onclick="proceedToBrief()">Continue</button>
    `;
  } else {
    body = `<div class="speech">${currentBrief.text}</div><div class="want-tags">${wantTags}</div><button class="primary" onclick="renderStyle()">Start styling</button>`;
  }

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="portrait" style="background:${client.color};"></div>
      <div class="soul-name">${client.name}</div>
      <div class="soul-hearts hearts">${heartsHTML(rel)}</div>
      ${returningNote}
      ${body}
    </div>
  `;
  updateTopBar("", true);
}

function advanceDialogueLine() {
  const key = currentClientKey();
  const stageSet = CLIENT_STAGES[key];
  const profile = soulProfiles[key];
  const stageIndex = Math.min(profile.visits - 1, stageSet.length - 1);
  const stage = stageSet[stageIndex] || FALLBACK_STAGE;
  dialogueLineIndex += 1;
  if (dialogueLineIndex >= stage.length) {

function advanceSoul() {
  const key = currentClientKey();
  const available = unansweredQuestions(key);
  soulStep = (!roundIsFirstMeeting && available.length > 0) ? 1 : 3;

function askQuestion(qid) {
  const key = currentClientKey();

function cardArtHTML(card) {

// Real vector card art is fetched once per URL and cached in memory, then
// injected as live DOM content (never as an <img> or background-image) —
// that's specifically what lets it inherit the page's Poppins font instead
// of silently falling back to a default font, the way a rasterized image
// or CSS background-image never could.
const svgArtCache = {};
const svgArtLoading = {};

function ensureSvgArtLoaded(url) {
  if (svgArtCache[url] || svgArtLoading[url]) return;
  svgArtLoading[url] = true;
  fetch(url)
    .then((r) => r.text())
    .then((svg) => {
      svgArtCache[url] = svg;
      delete svgArtLoading[url];
      document.querySelectorAll(`.art-fill[data-src="${CSS.escape(url)}"]`).forEach((el) => {
        if (!el.innerHTML) el.innerHTML = svg;
      });
    })
    .catch(() => { delete svgArtLoading[url]; });
}

function gcardHTML(card) {
  if (card.fullArt) {
    const cached = svgArtCache[card.fullArt] || "";
    ensureSvgArtLoaded(card.fullArt);
    return `<div class="gcard gcard-full"><div class="art-fill" data-src="${card.fullArt}" role="img" aria-label="${card.name}">${cached}</div></div>`;
  }
  return `
    <div class="gcard">
      <div class="gcard-inner">
        <div class="gpill">${card.category}</div>
        <div class="gname">${card.name}</div>
        <div class="gart">${cardArtHTML(card)}</div>
        <div class="gattrs"><span>${card.fit}</span><span>${card.style}</span><span>${card.color}</span></div>
      </div>
    </div>
  `;
}

function fanTransform(i, n) {
  const step = n <= 1 ? 0 : Math.min(22, 108 / (n - 1));
  const angle = (i - (n - 1) / 2) * step;
  const rad = (angle * Math.PI) / 180;
  const radius = 345;
  const x = Math.sin(rad) * radius * 0.78;
  const y = (1 - Math.cos(rad)) * 40;
  return `translateX(${x.toFixed(1)}px) translateY(${y.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
}

function drawJoker() {
  if (!jokerAvailable || deckPile.length === 0) return;
  const extra = shuffle(deckPile).slice(0, Math.min(2, deckPile.length));
  deckPile = deckPile.filter((id) => !extra.includes(id));

               style="transform:${fanTransform(i, n)}; z-index:${selected ? 900 : 100 - Math.abs(i - (n - 1) / 2)};"
               onpointerdown="onCardPointerDown(event, ${id})">

    <button class="corner-action corner-right" id="continueBtn" onclick="finishStyling()" title="See their reaction">✓</button>
  `;
  updateTopBar(`<span class="icon soul-swatch" style="background:${client.color};"></span> Wants: <b>${wantSummary}</b>`, true);

/* ---------------- SLOT RULES ---------------- */

// A Dress covers both "Top" and "Bottom" ground, so it conflicts with either;
// otherwise it's simply one card per category, full stop.
function categoryClashes(card, excludeIndex) {
  return outfit.some((c, i) => {
    if (!c || i === excludeIndex) return false;
    if (c.category === card.category) return true;
    if (card.category === "Dress" && (c.category === "Top" || c.category === "Bottom")) return true;
    if (c.category === "Dress" && (card.category === "Top" || card.category === "Bottom")) return true;
    return false;
  });
}

function slotCenters() {
  return [0, 1, 2, 3].map((i) => {
    const el = document.querySelector(`.slot-${i}`);
    const r = el.getBoundingClientRect();
    return { i, cx: r.left + r.width / 2, cy: r.top + r.height / 2, r };
  });
}

function nearestSlot(x, y) {
  const centers = slotCenters();
  let best = null;
  let bestDist = Infinity;
  for (const c of centers) {
    const pad = 40;
    const within = x >= c.r.left - pad && x <= c.r.right + pad && y >= c.r.top - pad && y <= c.r.bottom + pad;
    const d = Math.hypot(x - c.cx, y - c.cy);
    if (within && d < bestDist) { bestDist = d; best = c.i; }
  }
  return best;
}

function firstEmptySlot() {
  const idx = outfit.findIndex((c) => c === null);
  return idx === -1 ? null : idx;
}

/* ---------------- DRAG + PLACE ---------------- */

function placeCardInSlot(id, slotIndex) {
  const card = findCard(id);
  if (slotIndex === null) { renderStyle(); return; } // no valid target — snap back

  if (categoryClashes(card, slotIndex)) {
    renderStyle();
    flashHint(`Already have a ${card.category.toLowerCase()} in this outfit`);
    return;
  }

  if (outfit[slotIndex]) hand.push(outfit[slotIndex].id); // swap out, back to hand — never lost
  outfit[slotIndex] = card;
  hand = hand.filter((hid) => hid !== id);
  selectedHandId = null;
  renderStyle();
}

function returnCardToHand(slotIndex) {
  const card = outfit[slotIndex];
  if (!card) return;
  outfit[slotIndex] = null;
  hand.push(card.id);
  renderStyle();
}

function onSlotPointerDown(ev, slotIndex) {
  ev.preventDefault();
  ev.stopPropagation();
  const el = document.querySelector(`.slot-${slotIndex}`);
  if (!el) return;
  const rect = el.getBoundingClientRect();

  slotDragState = {
    slotIndex, moved: false,
    startX: ev.clientX, startY: ev.clientY,
    centerX: rect.left + rect.width / 2, centerY: rect.top + rect.height / 2,
    width: el.offsetWidth, height: el.offsetHeight,
  };

  el.setPointerCapture(ev.pointerId);
  el.addEventListener("pointermove", onSlotPointerMove);
  el.addEventListener("pointerup", onSlotPointerUp);
}

function onSlotPointerMove(ev) {
  if (!slotDragState) return;
  const el = document.querySelector(`.slot-${slotDragState.slotIndex}`);
  if (!el) return;
  const dx = ev.clientX - slotDragState.startX;
  const dy = ev.clientY - slotDragState.startY;

  if (!slotDragState.moved && Math.hypot(dx, dy) > 8) {
    slotDragState.moved = true;
    el.style.position = "fixed";
    el.style.zIndex = "3000";
    el.style.margin = "0";
    el.style.width = slotDragState.width + "px";
    el.style.height = slotDragState.height + "px";
    el.style.left = (slotDragState.centerX - slotDragState.width / 2) + "px";
    el.style.top = (slotDragState.centerY - slotDragState.height / 2) + "px";
  }

  if (slotDragState.moved) {
    el.style.left = (slotDragState.centerX - slotDragState.width / 2 + dx) + "px";
    el.style.top = (slotDragState.centerY - slotDragState.height / 2 + dy) + "px";

    const target = nearestSlot(ev.clientX, ev.clientY);
    document.querySelectorAll(".board-slot").forEach((e) => e.classList.remove("target-hover"));
    if (target !== null && target !== slotDragState.slotIndex) {
      const t = document.querySelector(`.slot-${target}`);
      if (t) t.classList.add("target-hover");
    }
  }
}

function onSlotPointerUp(ev) {
  if (!slotDragState) return;
  const { slotIndex, moved } = slotDragState;
  const el = document.querySelector(`.slot-${slotIndex}`);
  if (el) {
    el.releasePointerCapture(ev.pointerId);
    el.removeEventListener("pointermove", onSlotPointerMove);
    el.removeEventListener("pointerup", onSlotPointerUp);
  }
  document.querySelectorAll(".board-slot").forEach((e) => e.classList.remove("target-hover"));
  slotDragState = null;

  if (!moved) {
    returnCardToHand(slotIndex);
    return;
  }

  const target = nearestSlot(ev.clientX, ev.clientY);
  if (target === null || target === slotIndex) {
    renderStyle(); // snap back to its own slot
    return;
  }

  // Swapping two already-worn cards' positions can never create a new
  // category clash — the same set of pieces stays worn either way.
  const tmp = outfit[target];
  outfit[target] = outfit[slotIndex];
  outfit[slotIndex] = tmp;
  renderStyle();
}

function flashHint(msg) {
  const hint = document.querySelector(".hand-hint");
  if (!hint) return;
  const original = hint.textContent;
  hint.textContent = msg;
  hint.style.color = "var(--pink)";
  setTimeout(() => { hint.textContent = original; hint.style.color = ""; }, 1400);
}

let longPressTimer = null;
let longPressFired = false;

function onCardPointerDown(ev, id) {
  ev.preventDefault();
  const wrap = document.getElementById(`fan-${id}`);
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();

  dragState = {
    id, moved: false,
    startX: ev.clientX, startY: ev.clientY,
    centerX: rect.left + rect.width / 2, centerY: rect.top + rect.height / 2,
    width: wrap.offsetWidth, height: wrap.offsetHeight,
  };

  longPressFired = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    if (!dragState || dragState.moved) return; // a real drag is happening, not a long-press
    longPressFired = true;
    const heldId = dragState.id;
    wrap.releasePointerCapture(ev.pointerId);
    wrap.removeEventListener("pointermove", onCardPointerMove);
    wrap.removeEventListener("pointerup", onCardPointerUp);
    dragState = null;
    jokerPicking = null;
    openCardDetail(heldId);
  }, 480);

  wrap.setPointerCapture(ev.pointerId);
  wrap.addEventListener("pointermove", onCardPointerMove);
  wrap.addEventListener("pointerup", onCardPointerUp);
}

function onCardPointerMove(ev) {
  if (!dragState) return;
  const wrap = document.getElementById(`fan-${dragState.id}`);
  if (!wrap) return;
  const dx = ev.clientX - dragState.startX;
  const dy = ev.clientY - dragState.startY;

  if (!dragState.moved && Math.hypot(dx, dy) > 8) {
    dragState.moved = true;
    clearTimeout(longPressTimer); // a real drag started — cancel the long-press
    wrap.classList.add("dragging");
    wrap.style.position = "fixed";
    wrap.style.bottom = "auto";
    wrap.style.right = "auto";
    wrap.style.margin = "0";
    wrap.style.width = dragState.width + "px";
    wrap.style.height = dragState.height + "px";
    wrap.style.left = (dragState.centerX - dragState.width / 2) + "px";
    wrap.style.top = (dragState.centerY - dragState.height / 2) + "px";
    wrap.style.transform = "none"; // upright while dragging, not rotated
  }

  if (dragState.moved) {
    wrap.style.left = (dragState.centerX - dragState.width / 2 + dx) + "px";
    wrap.style.top = (dragState.centerY - dragState.height / 2 + dy) + "px";

    const target = nearestSlot(ev.clientX, ev.clientY);
    document.querySelectorAll(".board-slot").forEach((el) => el.classList.remove("target-hover"));
    if (target !== null) {
      const el = document.querySelector(`.slot-${target}`);
      if (el) el.classList.add("target-hover");
    }
  }
}

function onCardPointerUp(ev) {
  clearTimeout(longPressTimer);
  if (longPressFired) { longPressFired = false; return; } // already handled as a long-press
  if (!dragState) return;
  const { id, moved } = dragState;
  const wrap = document.getElementById(`fan-${id}`);
  if (wrap) {
    wrap.releasePointerCapture(ev.pointerId);
    wrap.removeEventListener("pointermove", onCardPointerMove);
    wrap.removeEventListener("pointerup", onCardPointerUp);
  }

  document.querySelectorAll(".board-slot").forEach((el) => el.classList.remove("target-hover"));
  dragState = null;

  const card = findCard(id);
  if (card.category === "Joker") {
    renderStyle(); // snap the joker card back into the fan first
    useJokerCard(id);
    return;
  }

  if (!moved) {
    // plain tap: just lift it forward, never places automatically
    selectedHandId = selectedHandId === id ? null : id;
    renderStyle();
  } else {
    const target = nearestSlot(ev.clientX, ev.clientY);
    placeCardInSlot(id, target);
  }
}

/* ---------------- DECK MODAL ---------------- */

function openSouls() {
  const overlay = document.getElementById("soulsOverlay");
  const items = CLIENTS.map((c, i) => {
    const rel = relationships[i] || 0;
    const profile = soulProfiles[i] || { visits: 0, facts: [] };
    const factsHTML = profile.facts.length > 0
      ? profile.facts.map((f) => `<div class="soul-fact"><b>${f.q}</b><span>${f.a}</span></div>`).join("")
      : `<div class="soul-fact-empty">Nothing learned yet — ask them something next time you meet.</div>`;
    return `
      <div class="soul-profile-card">
        <div class="soul-profile-head">
          <div class="portrait" style="width:56px;height:56px;background:${c.color};"></div>
          <div>
            <div class="soul-name" style="font-size:16px;">${c.name}</div>
            <div class="hearts">${heartsHTML(rel)}</div>
          </div>
        </div>
        <div class="soul-facts">${factsHTML}</div>
      </div>
    `;
  }).join("");

  overlay.innerHTML = `
    <div class="deck-header">
      <h3>Souls you've met</h3>
      <button class="deck-close" onclick="closeSouls()">✕</button>
    </div>
    <div class="souls-list">${items}</div>
  `;
  overlay.classList.add("open");
}

function closeSouls() {
  document.getElementById("soulsOverlay").classList.remove("open");
}

let jokerPicking = null; // id of the joker card currently being used, or null

let deckSortMode = "category"; // always group by kind — simplest useful default, no separate UI needed
const RARITY_ORDER = { Basic: 0, Uncommon: 1, Rare: 2, Iconic: 3, Legendary: 4 };
let deckFilters = { category: new Set(), rarity: new Set(), style: new Set() };
const FILTER_CATEGORIES = ["Top", "Bottom", "Dress", "Shoes", "Jacket", "Accessory", "Bag"];
const FILTER_RARITIES = ["Basic", "Uncommon", "Rare", "Iconic", "Legendary"];
const FILTER_STYLES = ["Cool", "Sweet", "Cute", "Elegant", "Daring", "Romantic", "Cozy", "Bold", "Classic", "Minimal"];

function sortedLiveDeck() {
  const arr = [...liveDeck];
  if (deckSortMode === "rarity") {
    arr.sort((a, b) => (RARITY_ORDER[a.rarity] ?? 0) - (RARITY_ORDER[b.rarity] ?? 0));
  } else if (deckSortMode === "style") {
    arr.sort((a, b) => (a.style || "").localeCompare(b.style || ""));
  } else if (deckSortMode === "category") {
    arr.sort((a, b) => (a.category || "").localeCompare(b.category || ""));
  }
  return arr;
}

function filteredDeck() {
  return sortedLiveDeck().filter((card) => {
    if (deckFilters.category.size > 0 && !deckFilters.category.has(card.category)) return false;
    if (deckFilters.rarity.size > 0 && !deckFilters.rarity.has(card.rarity)) return false;
    if (deckFilters.style.size > 0 && !deckFilters.style.has(card.style)) return false;
    return true;
  });
}

function setDeckSort(mode) {
  deckSortMode = deckSortMode === mode ? "default" : mode;
  renderDeckOverlay();
}

function toggleDeckFilter(dim, value) {
  if (deckFilters[dim].has(value)) deckFilters[dim].delete(value);
  else deckFilters[dim].add(value);
  renderDeckOverlay();
}

function clearDeckFilters() {
  deckFilters = { category: new Set(), rarity: new Set(), style: new Set() };
  renderDeckOverlay();
}

function openDeck() {
  jokerPicking = null;
  deckFilters = { category: new Set(), rarity: new Set(), style: new Set() };
  renderDeckOverlay();
}

function useJokerCard(jokerId) {
  jokerPicking = jokerId;
  deckFilters = { category: new Set(), rarity: new Set(), style: new Set() };
  renderDeckOverlay();
}

function filterChipRow(label, dim, options) {
  const chips = options.map((v) => `<button class="sort-btn ${deckFilters[dim].has(v) ? "active" : ""}" onclick="toggleDeckFilter('${dim}','${v}')">${v}</button>`).join("");
  return `<div class="filter-row"><span class="filter-label">${label}</span>${chips}</div>`;
}

function discoveredSetsHTML() {
  const known = Object.entries(SET_NAMES).filter(([id]) => discoveredSets.has(id));
  if (known.length === 0) {
    return `<div class="set-panel"><h4>Discovered Sets</h4><p class="set-empty">No sets discovered yet — wear two matching pieces on a great outfit to find one.</p></div>`;
  }
  const rows = known.map(([id, name]) => {
    const members = liveDeck.filter((c) => c.set === id).map((c) => c.name);
    return `<div class="set-entry"><b>${name}</b><span>${members.join(" · ")}</span></div>`;
  }).join("");
  return `<div class="set-panel"><h4>Discovered Sets</h4>${rows}</div>`;
}

function renderDeckOverlay() {
  const overlay = document.getElementById("deckOverlay");
  const picking = jokerPicking !== null;

  const items = filteredDeck()
    .filter((card) => card.category !== "Joker" || !picking) // don't offer other jokers as a tutor target
    .map((card) => {
      let status = "In pool";
      let cls = "status-pool";
      if (hand.includes(card.id)) { status = "In hand"; cls = "status-hand"; }
      else if (outfit.some((c) => c && c.id === card.id)) { status = "Worn now"; cls = "status-worn"; }
      else if (discardPile.includes(card.id)) { status = "Used"; cls = "status-used"; }

      const pickable = picking && status === "In pool";
      const onclick = picking
        ? (pickable ? `onclick="pickJokerCard(${card.id})"` : "")
        : `onclick="openCardDetail(${card.id})"`;
      const dim = picking && !pickable ? "style=\"opacity:0.35;\"" : "";

      return `
        <div class="deck-item ${cls}" ${onclick} ${dim}>
          ${gcardHTML(card)}
          <div class="deck-status">${status}</div>
        </div>
      `;
    }).join("");

  const anyFilterActive = deckFilters.category.size + deckFilters.rarity.size + deckFilters.style.size > 0;
  const filterPanel = `
    <div class="filter-panel">
      ${filterChipRow("Kind", "category", FILTER_CATEGORIES)}
      ${filterChipRow("Rarity", "rarity", FILTER_RARITIES)}
      ${filterChipRow("Attribute", "style", FILTER_STYLES)}
      ${anyFilterActive ? `<button class="sort-btn" style="margin-top:6px;" onclick="clearDeckFilters()">Clear filters ✕</button>` : ""}
    </div>
  `;

  overlay.innerHTML = `
    <div class="deck-header">
      <h3>${picking ? "Choose a card to draw" : "Your deck"}</h3>
      <button class="deck-close" onclick="closeDeck()">✕</button>
    </div>
    ${filterPanel}
    ${picking ? `<p style="text-align:center; color:var(--muted); font-size:12.5px; margin:-10px 0 16px;">Only cards still in your deck pool can be picked.</p>` : ""}
    ${picking ? "" : discoveredSetsHTML()}
    <div class="deck-grid">${items}</div>
  `;
  overlay.classList.add("open");
}

function pickJokerCard(cardId) {
  const jokerId = jokerPicking;
  if (jokerId === null) return;
  deckPile = deckPile.filter((id) => id !== cardId);
  hand.push(cardId);
  hand = hand.filter((id) => id !== jokerId);
  discardPile.push(jokerId);
  jokerPicking = null;
  closeDeck();
  renderStyle();
}

function closeDeck() {
  jokerPicking = null;
  document.getElementById("deckOverlay").classList.remove("open");
}

function openCardDetail(id) {
  const card = findCard(id);
  const detail = document.getElementById("cardDetail");
  detail.innerHTML = `
    <div class="card-detail-backdrop" onclick="closeCardDetail()"></div>
    <div class="card-detail-panel">
      <div class="card-detail-card">${gcardHTML(card)}</div>
      <div class="card-detail-lore">${card.lore || "No lore recorded for this piece yet."}</div>
      <button class="deck-close" onclick="closeCardDetail()">✕</button>
    </div>
  `;
  detail.classList.add("open");
}

function closeCardDetail() {
  const detail = document.getElementById("cardDetail");
  if (detail) detail.classList.remove("open");
}

/* ---------------- RESULT / PROGRESSION ---------------- */

// Rarity bonus: a piece that helps match the brief gets a bonus scaled to
// its rarity. A rare-or-above piece that does nothing for the brief still
// gives a small flat bonus, just for being an impressive thing to own.
const RARITY_FIT_BONUS = { Basic: 0, Uncommon: 2, Rare: 6, Iconic: 8, Legendary: 10 };
const RARITY_OFFBRIEF_BONUS = 5;
const HIGH_RARITY = new Set(["Rare", "Iconic", "Legendary"]);

function favoriteMatches(rule, pieces) {
  if (rule.type === "name") return pieces.some((p) => p.name.includes(rule.keyword));
  return pieces.some((p) => p[rule.attr] === rule.value);
}

function favoriteLabel(rule) {
  return rule.type === "name" ? rule.keyword : `${rule.value} ${rule.attr}`;
}

function finishStyling() {
  const client = currentClient();
  const key = currentClientKey();
  const pieces = Object.values(outfit).filter(Boolean);

  // Per-piece detail — computed once, used for both the aggregate totals and
  // the itemized breakdown, so the two views can never disagree.
  const pieceDetails = pieces.map((piece) => {
    const matchedAttrs = Object.entries(currentBrief.want).filter(([attr, value]) => piece[attr] === value);
    const briefPts = matchedAttrs.length * 25;
    let rarityPts = 0;
    if (matchedAttrs.length > 0) rarityPts = RARITY_FIT_BONUS[piece.rarity] || 0;
    else if (HIGH_RARITY.has(piece.rarity)) rarityPts = RARITY_OFFBRIEF_BONUS;
    return { piece, matchedAttrs, briefPts, rarityPts };
  });

  const rawBriefScore = pieceDetails.reduce((sum, d) => sum + d.briefPts, 0);
  const briefScore = Math.min(rawBriefScore, 100);
  const briefCapped = rawBriefScore > 100;
  const rarityBonus = pieceDetails.reduce((sum, d) => sum + d.rarityPts, 0);

  // Personal favorites — even outside the brief, these are worth something to them.
  const matchedFavorites = (client.favorites || []).filter((rule) => favoriteMatches(rule, pieces));
  const favoriteBonus = matchedFavorites.length * 8;

  // A signature color combo they personally love.
  let comboBonus = 0;
  if (client.combo && client.combo.colors.every((c) => pieces.some((p) => p.color === c))) {
    comboBonus = client.combo.bonus;
  }

  // Seasonal event bonus — only during the festival's peak month, and only
  // when something already worn happens to fit the occasion.
  const activeEvent = currentMonthEvent();
  const eventDef = activeEvent ? EVENT_BONUSES[activeEvent] : null;
  let eventBonus = 0;
  if (eventDef) {
    const fits = pieces.some((p) =>
      (eventDef.styles && eventDef.styles.includes(p.style)) ||
      (eventDef.colors && eventDef.colors.includes(p.color)) ||
      (eventDef.categories && eventDef.categories.includes(p.category)) ||
      (eventDef.rarities && eventDef.rarities.includes(p.rarity))
    );
    if (fits) eventBonus = 10;
  }

  // A little grace for the first few clients, so the scoring system doesn't
  // feel punishing before the player has learned how matching works. Fades
  // out completely by the 4th visit.
  const WELCOME_BONUS = [20, 12, 6];
  const welcomeBonus = WELCOME_BONUS[clientRoundIndex] || 0;

  const score = briefScore + rarityBonus + favoriteBonus + comboBonus + eventBonus + welcomeBonus;

  // Small penalties for real gaps in the outfit. A jacket (or an accessory)
  // is a bonus layer, never required — but going out with no shoes, or no
  // top/bottom when not wearing a dress, is a real miss worth noting.
  const hasDress = pieces.some((p) => p.category === "Dress");
  const hasShoes = pieces.some((p) => p.category === "Shoes");
  const hasTop = pieces.some((p) => p.category === "Top");
  const hasBottom = pieces.some((p) => p.category === "Bottom");
  let gapPenalty = 0;
  const gaps = [];
  if (!hasShoes) { gapPenalty -= 10; gaps.push("No shoes"); }
  if (!hasDress && !hasTop) { gapPenalty -= 10; gaps.push("No top"); }
  if (!hasDress && !hasBottom) { gapPenalty -= 10; gaps.push("No bottom"); }
  const scoreWithGaps = score + gapPenalty;

  totalScore += scoreWithGaps;
  if (scoreWithGaps >= 70) delightedCount += 1;

  let moonCoinsEarned = 0;
  if (scoreWithGaps >= 70) { moonCoins += 1; moonCoinsEarned = 1; } // a genuinely good outfit, not just a perfect one

  let relDelta = scoreWithGaps >= 70 ? 2 : scoreWithGaps >= 35 ? 1 : 0;
  if (matchedFavorites.length > 0) relDelta += 1;

  // A complete matching set, but only when the outfit already works.
  let setBonusName = null;
  if (scoreWithGaps >= 70) {
    const completed = Object.entries(SET_NAMES).find(([setId]) => {
      const setPieces = pieces.filter((p) => p.set === setId);
      const uniqueIds = new Set(setPieces.map((p) => p.id));
      return uniqueIds.size >= 2;
    });
    if (completed) {
      setBonusName = completed[1];
      discoveredSets.add(completed[0]);
      moonCoins += 1;
      moonCoinsEarned += 1;
      relDelta += 1;
    }
  }

  relationships[key] = (relationships[key] || 0) + relDelta;

  discardPile.push(...pieces.map((p) => p.id));
  deckPile.push(...hand);
  hand = [];

  const wantResults = Object.entries(currentBrief.want).map(([attr, value]) => ({
    attr, value, matched: pieces.some((p) => p[attr] === value),
  }));

  const breakdown = {
    briefScore, briefCapped, rarityBonus, favoriteBonus, comboBonus, eventBonus, activeEvent, welcomeBonus, gaps, matchedFavorites, pieceDetails,
    comboName: client.combo && comboBonus > 0 ? client.combo.colors.join(" + ") : null,
  };

  renderResult(client, scoreWithGaps, wantResults, relDelta, moonCoinsEarned, breakdown, setBonusName);
}

function renderResult(client, score, wantResults, relDelta, moonCoinsEarned, breakdown, setBonusName) {
  let reaction, headline, line;
  if (score >= 100) { reaction = "🤩"; headline = "Absolutely delighted!"; line = `${client.name.split(",")[0]} is speechless. This is exactly what they pictured — and then some.`; }
  else if (score >= 70) { reaction = "✨"; headline = "Delighted."; line = `${client.name.split(",")[0]} twirls once, satisfied. Exactly the vibe they were after.`; }
  else if (score >= 35) { reaction = "🙂"; headline = "It'll do."; line = `${client.name.split(",")[0]} shrugs. Not quite what they pictured, but wearable.`; }
  else { reaction = "😐"; headline = "Not it."; line = `${client.name.split(",")[0]} sighs. This is going to haunt them — figuratively, this time.`; }

  const rows = wantResults.map((w) => `
    <div class="want-result-row ${w.matched ? "hit" : "miss"}">
      <span class="icon">${w.matched ? "🩷" : "💔"}</span>
      <span>${w.matched ? "Loved" : "Missed"} the ${w.value.toLowerCase()} ${w.attr}</span>
    </div>
  `).join("");

  const relLine = relDelta > 0
    ? `<div class="rel-change">+${relDelta} ❤ with ${client.name.split(",")[0]} (now ${heartsHTML(relationships[currentClientKey()])})</div>`
    : `<div class="rel-change">No change in your bond with ${client.name.split(",")[0]}.</div>`;

  const coinLine = moonCoinsEarned > 0
    ? `<div class="rel-change" style="color:var(--gold);">🌙 +${moonCoinsEarned} mooncoin${moonCoinsEarned > 1 ? "s" : ""} — they were thrilled enough to pay you in Aftercity currency.</div>`
    : "";

  const setLine = setBonusName
    ? `<div class="rel-change" style="color:var(--mint);">✨ Bonus: full ${setBonusName} worn together.</div>`
    : "";

  // Aggregate breakdown — always shown, so the math is never a mystery.
  const briefLabel = breakdown.briefCapped ? "Brief match (capped at 100)" : "Brief match";
  const breakdownRows = [
    { label: briefLabel, value: breakdown.briefScore },
    breakdown.rarityBonus > 0 ? { label: "Rarity bonus", value: breakdown.rarityBonus } : null,
    ...breakdown.matchedFavorites.map((rule) => ({ label: `Loves ${favoriteLabel(rule).toLowerCase()}`, value: 8 })),
    breakdown.comboBonus > 0 ? { label: `${breakdown.comboName} combo`, value: breakdown.comboBonus } : null,
    breakdown.eventBonus > 0 ? { label: `${EVENT_LABELS[breakdown.activeEvent]} bonus`, value: breakdown.eventBonus } : null,
    breakdown.welcomeBonus > 0 ? { label: "New stylist grace", value: breakdown.welcomeBonus } : null,
    ...breakdown.gaps.map((g) => ({ label: g, value: -10 })),
  ].filter(Boolean);

  const breakdownHTML = `
    <div class="score-breakdown">
      <p class="breakdown-hint">Each matched brief attribute is worth 25 — one piece can only satisfy each attribute once, so wear more pieces that reinforce the ask to climb higher.</p>
      ${breakdownRows.map((r) => `<div class="score-row"><span>${r.label}</span><span>${r.value >= 0 ? "+" : ""}${r.value}</span></div>`).join("")}
      <div class="score-row total"><span>Total</span><span>${score}</span></div>
    </div>
  `;

  // Per-item detail — exactly what each worn piece did or didn't do, and why.
  const itemRows = breakdown.pieceDetails.map((d) => {
    const bits = [];
    if (d.matchedAttrs.length > 0) {
      bits.push(d.matchedAttrs.map(([attr, value]) => `matched ${value.toLowerCase()} ${attr}`).join(", ") + ` (+${d.briefPts})`);
    }
    if (d.rarityPts > 0) {
      bits.push(d.matchedAttrs.length > 0
        ? `${d.piece.rarity} rarity bonus (+${d.rarityPts})`
        : `${d.piece.rarity} rarity, off-brief bonus (+${d.rarityPts})`);
    }
    const verdict = bits.length > 0 ? bits.join(" · ") : "didn't match the brief, no bonus";
    return `<div class="item-row"><b>${d.piece.name}</b><span>${verdict}</span></div>`;
  }).join("");

  const itemHTML = `<div class="item-breakdown"><h4>How each piece performed</h4>${itemRows}</div>`;

  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="reaction">${reaction}</div>
      <h2>${headline}</h2>
      <div class="score">Match score: ${score}</div>
      ${breakdownHTML}
      ${itemHTML}
      ${relLine}
      ${coinLine}
      ${setLine}
      <div class="want-results">${rows}</div>
      <div class="line">${line}</div>
      <button class="primary" onclick="advanceMonth()">Next client</button>
    </div>
  `;
  updateTopBar("", true);
}

// Seasonal calendar — exact story-screen text from the narrative bible.
// Only the "peak" festival months carry a scoring bonus; the "coming soon"
// screens are pure atmosphere, matching the bible's "mystery first, often
// zero story screens" guardrail.
// 36 jobs/year, 3 per month, per the bible. clientRoundIndex is the absolute
// job counter (0-35); month and position-within-month are both derived from it.
function currentMonthIndex() { return Math.floor(clientRoundIndex / 3) % 12; }
function positionInMonth() { return clientRoundIndex % 3; }

// Scheduled per (month, position-in-month) so a month with 3 jobs can carry

// Event attribute bonuses — only on the peak festival month, and only when
// a worn piece already matches, per the bible's "compatible with the ask" rule.
const EVENT_BONUSES = {
  flowerFest: { styles: ["Romantic"], colors: ["Pink", "Red", "Green"] },
  summerSolstice: { styles: ["Classic"], colors: ["White", "Blue"] },
  moonFest: { styles: ["Daring", "Bold"], colors: ["Purple", "Black"] },
  firstSnow: { categories: ["Jacket"], styles: ["Cozy"] },
  winterSolstice: { styles: ["Cozy"], rarities: ["Rare", "Iconic", "Legendary"] },
};
const EVENT_LABELS = { flowerFest: "Flower Fest", summerSolstice: "Summer Solstice", moonFest: "Moon Fest", firstSnow: "First Snow", winterSolstice: "Winter Solstice" };

function currentMonthEvent() { return EVENT_SCHEDULE[`${currentMonthIndex()}-${positionInMonth()}`] || null; }

function renderStoryScreen(key, onContinue) {
  const screen = EVENT_SCREENS[key];
  const linesHTML = screen.lines.map((l) => `<p style="margin:4px 0;">${l}</p>`).join("");
  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="line" style="max-width:340px;">${linesHTML}</div>
      <button class="primary" style="margin-top:22px;" onclick="${onContinue}">${screen.button}</button>
    </div>
  `;
  updateTopBar("", true);
}

function advanceMonth() {
  const eventKey = clientRoundIndex === 0 ? "firstDay" : EVENT_SCHEDULE[`${currentMonthIndex()}-${positionInMonth()}`];
  clientRoundIndex += 1;
  if (eventKey) {
    renderStoryScreen(eventKey, "afterEventContinue()");
  } else {
    afterEventContinue();
  }
}

function afterEventContinue() {
  if (clientRoundIndex >= 36) { renderEnd(); return; }
  renderMap();
}

function renderEnd() {
  const rows = CLIENTS.map((c, i) => `
    <div class="year-row"><span><span class="soul-swatch" style="background:${c.color};"></span> ${c.name}</span><span class="hearts">${heartsHTML(relationships[i] || 0)}</span></div>
  `).join("");

  // Reward: one new piece for every 3 "Delighted" outcomes this year,
  // limited by what's left in the surprise pool.
  const rewardCount = Math.min(Math.floor(delightedCount / 3), unlockPool.length);
  const earned = unlockPool.splice(0, rewardCount);
  metaUnlocked.push(...earned);

  const rewardLine = earned.length > 0
    ? `<p style="color:var(--gold);">Word got around about your work — ${earned.length} new piece${earned.length > 1 ? "s" : ""} joined your closet for next time: ${earned.map((c) => c.name).join(", ")}.</p>`
    : `<p style="color:var(--muted);">No new pieces earned this year — delight more clients (3 "Delighted" outfits earns one) to grow your closet.</p>`;

  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="reaction">🕯️</div>
      <h2>One year in After City.</h2>
      <div class="line" style="max-width:320px; margin-bottom:18px;">
        <p style="margin:4px 0;">One year.</p>
        <p style="margin:4px 0;">Thirty-six jobs.</p>
        <p style="margin:4px 0;">More cards than you started with.</p>
        <p style="margin:4px 0;">More questions too.</p>
        <p style="margin:4px 0;">After City feels less unfamiliar now.</p>
        <p style="margin:4px 0;">That may not be the same thing as understanding it.</p>
      </div>
      <div class="score">Total score across 36 jobs this year: ${totalScore}</div>
      <div class="score" style="margin-bottom:18px;">${delightedCount} client${delightedCount === 1 ? "" : "s"} were delighted with your work.</div>
      <div class="year-list">${rows}</div>
      ${rewardLine}
      <div class="line">A real version would keep going indefinitely and let relationships unlock new kinds of requests.</div>
      <button class="ghost" onclick="renderIntro()">Restart prototype</button>
    </div>
  `;
}

renderIntro();
</script>

</body>
</html>
