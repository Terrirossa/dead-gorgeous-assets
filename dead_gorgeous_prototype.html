<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dead Gorgeous — Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

  :root {
    --card-bg: #fdfcfb;
    --ink: #241f2e;
    --pink: #ffb6d9;
    --lilac: #cdb6ff;
    --mint: #b8f2d0;
    --gold: #ffe08a;
    --muted: #7a7186;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { overflow-x: hidden; }
  html { height: 100%; }
  /* A single fixed, viewport-sized background layer, decoupled from the
     actual (possibly very tall, dialogue-heavy) page height. Radial-gradient
     percentages are relative to whatever element they're painted on -- with
     the gradient on html/body directly, a long scrolling screen makes body's
     own box a different height than html's, so the "same" gradient on both
     doesn't actually line up, and you get a visible seam right where one
     element's box ends and the other's begins. Pinning it to the viewport
     via a fixed pseudo-element sidesteps the whole problem: it can never
     run out or misalign, no matter how tall any given screen gets. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 20% 10%, #4a3a5c, #211a2c 70%);
  }
  body {
    margin: 0;
    min-height: 100vh;
    overflow-y: auto;
    font-family: 'Poppins', sans-serif;
    color: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overscroll-behavior: none;
  }
  body.no-scroll { overflow-y: hidden; height: 100vh; }

  .stage { width: 100%; max-width: 480px; overflow-x: hidden; }

  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }

  button.primary {
    background: linear-gradient(90deg, var(--pink), var(--lilac));
    color: var(--ink);
    border: none;
    padding: 15px 34px;
    border-radius: 999px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  button.primary:hover { transform: scale(1.04); }
  button.primary:disabled { opacity: 0.35; cursor: default; transform: none; }

  button.ghost {
    background: transparent;
    color: #d8d1e6;
    border: 1.5px solid #6b5f80;
    padding: 12px 26px;
    border-radius: 999px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  .center-col { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .screen-pad { padding: 60px 10px; }

  .intro h1 {
    font-size: 42px; font-weight: 600; margin-bottom: 16px;
    background: linear-gradient(90deg, var(--pink), var(--lilac), var(--mint));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .intro p, .shuffle p, .result .line {
    font-size: 16px; color: #d8d1e6; line-height: 1.6; max-width: 380px; margin: 0 auto 30px;
  }

  .title-screen {
    min-height: 100vh; margin: -20px -10px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .title-panel {
    width: 100%;
    padding: 60px 24px 50px;
    text-align: center;
  }
  .title-headline {
    font-size: 26px; margin-bottom: 14px; font-weight: 700;
    background: linear-gradient(90deg, var(--pink), var(--lilac), var(--mint));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
  }
  .title-panel p { font-size: 15px; color: #d8d1e6; line-height: 1.6; max-width: 360px; margin: 0 auto 26px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

  /* ---------- Shuffle screen ---------- */
  .shuffle-deck { position: relative; width: 160px; height: 210px; margin: 10px auto 26px; }
  .back-card {
    position: absolute; inset: 0; margin: auto; width: 122px; aspect-ratio: 595.28 / 841.9; border-radius: 16px;
    padding: 4px; background: conic-gradient(from 180deg at 50% 50%, #ffd9e6, #d9f2ff, #e2ffd9, #fff6c2, #f0d9ff, #ffd9e6);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3); transform: translateY(calc(var(--i) * -1.6px));
    transition: transform 0.45s cubic-bezier(0.3, 0.8, 0.4, 1);
  }

  .shuffle-deck.split .back-card:nth-child(even) { transform: translate(-72px, -8px) rotate(-16deg); }
  .shuffle-deck.split .back-card:nth-child(odd)  { transform: translate(72px, -8px) rotate(16deg); }
  .shuffle-deck.merge .back-card {
    transform: translateY(calc(var(--i) * -1.6px)) rotate(0deg);
    transition-delay: calc(var(--i) * 45ms);
  }

  /* ---------- Meet-soul screen ---------- */
  .portrait {
    width: 160px; aspect-ratio: 615 / 864; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 14px;
    overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .portrait.no-image { background: #cdb6ff; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait-row { display: flex; gap: 10px; justify-content: center; margin: 0 auto 14px; }
  .portrait-row .portrait { margin: 0; }
  .portrait-row.portrait-row-multi .portrait { width: 108px; }
  .soul-name { font-size: 20px; color: #fff; margin-bottom: 6px; }
  .soul-hearts { margin-bottom: 16px; }
  .returning-note { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-style: italic; }

  .top-nav { display: none; } /* legacy, unused */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; gap: 10px;
    background: linear-gradient(180deg, rgba(20,14,26,0.55), transparent);
  }
  .top-bar.hidden { display: none; }
  .top-bar-left { flex: 1; min-width: 0; font-size: 13px; color: #ece7f4; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-bar-left b { color: var(--gold); }
  .top-bar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .top-bar-info { font-size: 13px; color: #cfc6de; white-space: nowrap; }
  .top-bar-info .coins { color: var(--gold); font-weight: 600; }
  .deck-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; cursor: pointer; color: #ece7f4;
  }
  .deck-btn svg { width: 17px; height: 17px; }
  .joker-btn.used { opacity: 0.3; pointer-events: none; }

  .question-list { display: flex; flex-direction: column; gap: 8px; max-width: 380px; margin: 0 auto 18px; }
  .question-chip {
    text-align: left; font-size: 13.5px; padding: 12px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.16); color: #ece7f4;
  }
  .question-chip:hover { border-color: var(--pink); }
  .asked-question { font-size: 12.5px; color: var(--muted); font-style: italic; margin-bottom: 8px; }

  .souls-list { display: flex; flex-direction: column; gap: 14px; max-width: 480px; margin: 0 auto; }
  .soul-profile-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; }
  .soul-profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .soul-facts { display: flex; flex-direction: column; gap: 8px; }
  .soul-best-outfit { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
  .soul-best-outfit b { display: block; font-size: 11.5px; color: var(--gold); margin-bottom: 8px; }
  .soul-best-outfit-cards { display: flex; gap: 6px; flex-wrap: wrap; }
  .soul-fact { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; }
  .soul-fact b { display: block; color: var(--gold); font-weight: 600; margin-bottom: 3px; }
  .soul-fact span { color: #cfc6de; }
  .soul-fact-empty { font-size: 12.5px; color: var(--muted); font-style: italic; }

  .map-screen {
    min-height: 100vh; margin: -20px -10px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 80px 10px 60px !important;
  }
  .map-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    max-width: 320px; margin: 0 auto;
  }
  .map-tile {
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: 18px; padding: 40px 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease;
    backdrop-filter: blur(2px);
  }
  .map-tile:hover { transform: translateY(-2px); border-color: var(--pink); }
  .map-tile.locked { opacity: 0.55; }
  .map-tile.locked:hover { transform: none; border-color: rgba(255,255,255,0.14); }
  .map-tile-label { font-size: 15px; font-weight: 600; color: #ece7f4; text-align: center; letter-spacing: 0.02em; }
  .map-tile-label .lock { font-size: 13px; opacity: 0.8; }
  .map-message { min-height: 20px; margin-top: 18px; font-size: 12.5px; color: var(--gold); text-align: center; max-width: 300px; }

  .shop-mystery-card { width: 160px; margin: 10px auto 16px; }
  .shop-mystery-card .gcard { aspect-ratio: 595.28 / 841.9; }
  .speech {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 18px;
    padding: 20px 24px; font-size: 15.5px; color: #ece7f4; line-height: 1.55; max-width: 380px; margin: 0 auto 26px;
  }
  .want-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
  .want-tag {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;

  }

  .subloc-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 10px 0 20px; }
  .quartett-score { text-align: center; font-weight: 700; letter-spacing: 0.04em; margin: 6px 0 14px; }
  .quartett-calls { display: flex; flex-direction: column; gap: 6px; margin: 0 0 18px; }
  .quartett-call { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.04); font-size: 13px; }
  .quartett-call-current { background: rgba(255,255,255,0.1); box-shadow: 0 0 0 1px var(--pink); }
  .quartett-call-done { opacity: 0.55; }
  .quartett-call-num { font-weight: 700; opacity: 0.6; }
  .quartett-call-label { flex: 1; }
  .quartett-call-result { font-weight: 700; letter-spacing: 0.04em; }
  .quartett-reveal-row { display: flex; gap: 18px; justify-content: center; margin: 10px 0 18px; }
  .quartett-reveal-card { width: 140px; text-align: center; }
  .quartett-reveal-tag { margin-top: 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
  .quartett-pick-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0 18px; max-width: 520px; margin-left: auto; margin-right: auto; }
  .quartett-pick-count { text-align: center; font-weight: 600; margin: 4px 0 2px; }
  .quartett-pick-tile, .quartett-hand-tile {
    position: relative; width: 84px; cursor: pointer;
  }
  .quartett-pick-tile .gcard, .quartett-hand-tile .gcard {
    aspect-ratio: 595.28 / 841.9; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .quartett-pick-tile.selected .gcard, .quartett-hand-tile.selected .gcard {
    box-shadow: 0 0 0 3px var(--pink); border-radius: 18px; transform: translateY(-8px);
  }
  .quartett-pick-tile.disabled { opacity: 0.35; cursor: not-allowed; }
  .quartett-hand-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0; }
  .quartett-hand-tile { width: 92px; }
  .quartett-opponent-grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 10px 0 18px; }
  .quartett-opponent-tile { width: 92px; cursor: pointer; text-align: center; transition: transform 0.15s ease; }
  .quartett-opponent-tile:hover { transform: translateY(-3px); }
  .quartett-opponent-portrait { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; margin: 0 auto 6px; border: 2px solid rgba(255,255,255,0.18); }
  .quartett-opponent-portrait img { width: 100%; height: 100%; object-fit: cover; }
  .quartett-opponent-name { font-size: 12.5px; font-weight: 600; color: #ece7f4; }
  .hearts { font-size: 12px; letter-spacing: 1px; }
  .half-heart {
    display: inline-block; background: linear-gradient(90deg, #ff6b8a 50%, rgba(255,255,255,0.35) 50%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- Compact styling-screen top strip ---------- */
  .mini-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 14px; font-size: 11px; color: var(--muted);
  }
  .mini-brief { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #cfc6de; }
  .mini-brief .icon { font-size: 14px; }
  .soul-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; }
  .mini-brief b { color: var(--gold); font-weight: 600; }
  .mini-right { display: flex; align-items: center; gap: 10px; }
  .mini-right .coins { color: var(--gold); font-weight: 600; }
  /* ---------- Outfit board (overlapping collage) ---------- */
  .outfit-board {
    position: relative;
    width: 100%;
    max-width: 280px;
    height: 340px;
    margin: 56px auto 16px;
    border-radius: 20px;
  }

  .board-slot {
    position: absolute;
    width: 140px;
    aspect-ratio: 595.28 / 841.9;
    border-radius: 16px;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .board-slot.target-hover { box-shadow: 0 0 0 3px var(--pink); border-color: transparent; }
  .board-slot.empty {
    border: 2.5px dashed rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.03);
    display: flex; align-items: center; justify-content: center;
  }
  .board-slot.empty .plus { font-size: 28px; font-weight: 300; color: rgba(255,255,255,0.3); }
  .board-slot.filled { padding: 4px; background: conic-gradient(from 180deg at 50% 50%, #ffd9e6, #d9f2ff, #e2ffd9, #fff6c2, #f0d9ff, #ffd9e6); cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.35); }
  .board-slot.filled.filled-plain { padding: 0; background: none; box-shadow: none; }

  .slot-0 { top: 0px;   left: 3px;   transform: rotate(-6deg); z-index: 2; }
  .slot-1 { top: 13px;  left: 123px; transform: rotate(7deg);  z-index: 1; }
  .slot-2 { top: 125px; left: 0px;   transform: rotate(5deg);  z-index: 3; }
  .slot-3 { top: 140px; left: 120px; transform: rotate(-6deg); z-index: 4; }

  /* ---------- Hand ---------- */
  .hand-hint {
    text-align: center; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); margin-bottom: 2px;
  }
  .hand-fan {
    position: relative;
    height: 190px;
    margin: 0 auto 8px;
    touch-action: none;
  }
  .fan-card-wrap {
    position: absolute;
    bottom: 4px; left: 50%;
    width: 122px;
    margin-left: -61px;
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), z-index 0s;
    cursor: grab;
    touch-action: none;
  }
  .fan-card-wrap:hover { z-index: 900 !important; }
  .fan-card-wrap:hover .gcard { transform: scale(1.16) translateY(-20px); }
  .fan-card-wrap.selected .gcard { transform: scale(1.16) translateY(-20px); box-shadow: 0 0 0 3px var(--pink); border-radius: 18px; }
  .fan-card-wrap.dragging { transition: none !important; z-index: 3000 !important; cursor: grabbing; }
  .fan-card-wrap.dragging .gcard { transform: scale(1.14); }
  .fan-card-wrap .gcard { aspect-ratio: 595.28 / 841.9; transition: transform 0.18s ease; }

  .empty-hand { text-align: center; font-size: 13.5px; color: var(--muted); font-style: italic; padding: 30px 0; }

  .submit-row { display: none; } /* superseded by fixed corner actions */
  .corner-action {
    position: fixed; bottom: 18px; z-index: 500;
    width: 46px; height: 46px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; border: none;
  }
  .corner-action.corner-left {
    left: 18px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: #ece7f4;
  }
  .corner-action.corner-left.corner-left-2 { left: 72px; }
  .corner-action.corner-left.used { opacity: 0.3; pointer-events: none; }
  .joker-count {
    position: absolute; top: -4px; right: -4px; background: var(--gold); color: #1a1428;
    font-size: 10px; font-weight: 700; border-radius: 999px; width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .corner-action.corner-right {
    right: 18px; background: linear-gradient(135deg, var(--pink), var(--lilac));
    color: #1a1428; font-weight: 700; font-size: 20px; box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }

  /* ---- Shared card component ---- */
  .gcard {
    width: 100%; height: 100%; border-radius: 18px; padding: 5px;
    background: conic-gradient(from 180deg at 50% 50%, #ffd9e6, #d9f2ff, #e2ffd9, #fff6c2, #f0d9ff, #ffd9e6);
  }
  .gcard.gcard-full { padding: 0; background: none; }
  .gcard-full .art-fill {
    width: 100%; height: 100%;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    pointer-events: none; overflow: hidden; border-radius: 14px;
  }
  .gcard-full .art-fill svg { width: 100%; height: 100%; display: block; }
  .gcard-inner {
    width: 100%; height: 100%; border-radius: 14px;
    background: radial-gradient(circle at 30% 15%, #ffffff 0%, #f7f5fb 65%, #f2f0f8 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 7px 7px; position: relative; overflow: hidden;
  }
  .gpill {
    position: absolute; top: 5px; left: 5px; font-size: 8px; font-weight: 700;
    letter-spacing: 0.03em; padding: 3px 7px; border-radius: 999px;
    border: 1.2px solid #1a1a1a; background: #fdfdfd; color: #1a1a1a;
  }
  .gname {
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 11px; text-align: center;
    color: var(--ink); line-height: 1.15; min-height: 24px; display: flex; align-items: center;
  }
  .gart { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 3px; }
  .gart img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .gattrs { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; padding-top: 3px; }
  .gattrs span {
    font-size: 7.2px; font-weight: 600; padding: 2px 5px; border-radius: 999px;
    border: 1px solid #1a1a1a; background: #fdfdfd; color: #1a1a1a;
  }

  /* ---------- Deck modal ---------- */
  .deck-overlay {
    position: fixed; inset: 0; background: rgba(15, 10, 20, 0.95); z-index: 2000;
    overflow-y: auto; padding: 26px 20px 50px; display: none;
  }
  .deck-overlay.open { display: block; }
  .deck-header { display: flex; justify-content: space-between; align-items: center; max-width: 480px; margin: 0 auto 20px; }
  .deck-sort-row { display: flex; justify-content: center; gap: 8px; max-width: 480px; margin: 0 auto 18px; }
  .sort-btn {
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.18);
    color: #cfc6de; border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  .sort-btn.active { background: var(--pink); border-color: var(--pink); color: #1a1428; font-weight: 600; }

  .filter-panel { max-width: 480px; margin: 0 auto 18px; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 12px 14px; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .filter-row:last-of-type { margin-bottom: 0; }
  .filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); width: 62px; flex-shrink: 0; }
  .filter-row .sort-btn { padding: 4px 10px; font-size: 11px; }

  .set-panel { max-width: 480px; margin: 0 auto 20px; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 14px 16px; }
  .set-panel h4 { margin: 0 0 10px; font-size: 13px; color: var(--gold); }
  .set-empty { font-size: 12.5px; color: var(--muted); font-style: italic; margin: 0; }
  .set-entry {
    font-size: 12.5px; margin-bottom: 8px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.04);
    border-radius: 10px; padding: 8px 12px;
  }
  .set-entry b { display: block; letter-spacing: 0.03em; font-size: 11.5px; }
  .set-count { color: var(--gold); font-size: 11px; }
  .set-showcase-card { max-width: 340px; }
  .set-showcase-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .set-showcase-item { aspect-ratio: 595.28/841.9; text-align: center; }
  .set-showcase-item .gcard-full { width: 100%; height: 85%; }
  .set-showcase-item span { display: block; font-size: 9px; color: var(--muted); margin-top: 3px; }
  .set-entry b { color: #ece7f4; }
  .set-entry span { color: #cfc6de; display: block; }
  .deck-header h3 { color: #fff; font-size: 19px; }
  .deck-close {
    background: rgba(255,255,255,0.1); border: none; color: #fff; width: 32px; height: 32px;
    border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .deck-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 480px; margin: 0 auto;
  }
  .deck-item { position: relative; }
  .deck-item .gcard { aspect-ratio: 595.28 / 841.9; }
  .deck-status {
    margin-top: 5px; text-align: center; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .deck-item.status-hand .deck-status { color: var(--pink); }
  .deck-item.status-worn .deck-status { color: var(--mint); }
  .deck-item.status-used .deck-status { color: #5c5468; }
  .deck-item { cursor: pointer; }

  .card-detail { display: none; }
  .card-detail.open { display: block; }
  .card-detail-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2100; }
  .card-detail-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2101; width: 250px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .card-detail-card { width: 100%; aspect-ratio: 595.28 / 841.9; }
  .card-detail-card .gcard-inner { padding: 32px 12px 12px; }
  .card-detail-card .gname { font-size: 15px; min-height: 34px; }
  .card-detail-card .gattrs span { font-size: 10px; padding: 3px 8px; }
  .card-detail-lore {
    background: rgba(20,14,26,0.95); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 14px 16px; font-size: 13.5px; color: #ece7f4; line-height: 1.5;
    text-align: center;
  }

  /* ---------- Result screen ---------- */
  .result .reaction {
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 10px;
    color: var(--gold); text-transform: uppercase;
  }
  .result h2 { font-size: 27px; color: #fff; margin-bottom: 6px; }
  .result .score { font-size: 16px; color: var(--gold); margin-bottom: 4px; }
  .breakdown-hint { font-size: 10.5px; color: var(--muted); line-height: 1.35; margin: 0 auto 14px; font-style: italic; max-width: 320px; }
  .result-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    max-width: 400px; margin: 0 auto 18px; text-align: left;
  }
  .result-box { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 12px; font-size: 11.5px; }
  .discovery-box { background: rgba(255,224,138,0.1); border: 1px solid rgba(255,224,138,0.35); }
  .set-discovery-overlay {
    position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center;
    background: rgba(10,6,16,0.82); padding: 24px; animation: fadeIn 0.25s ease;
  }
  .set-discovery-card {
    background: linear-gradient(160deg, #3a2a4a, #221a2c); border: 1px solid rgba(255,224,138,0.4);
    border-radius: 20px; padding: 28px 24px; max-width: 320px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .set-discovery-badge {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #221a2c;
    background: var(--gold); border-radius: 20px; padding: 5px 14px; margin-bottom: 12px;
  }
  .set-discovery-card h2 { color: #fff; margin-bottom: 10px; }
  .set-discovery-card p { font-size: 13px; color: #cfc6de; margin-bottom: 14px; }
  .set-discovery-rewards { font-size: 13px; color: var(--gold); margin-bottom: 6px; }
  .set-discovery-count { font-size: 12.5px; color: #cfc6de; margin-top: -6px; margin-bottom: 12px; }
  .set-piece-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .set-piece-thumb { width: 72px; text-align: center; }
  .set-piece-thumb .gcard-full { aspect-ratio: 595.28/841.9; display: block; }
  .set-piece-thumb span { display: block; font-size: 9px; color: var(--muted); margin-top: 3px; line-height: 1.2; }
  .set-discovery-rewards div { margin-bottom: 4px; }
  .ach-popup-reqs { text-align: left; margin: 0 auto 14px; max-width: 260px; }
  .ach-popup-reqs p { margin: 0 0 4px; font-size: 12.5px; color: #cfc6de; }
  .ach-popup-lore { font-style: italic; color: var(--gold) !important; }
  .ach-counter {
    text-align: center; color: var(--muted); font-size: 12.5px; margin: -8px 0 16px;
  }
  .ach-list { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .ach-row { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px 14px; }
  .ach-row.locked { text-align: center; color: var(--muted); letter-spacing: 0.15em; font-size: 13px; }
  .ach-row.unlocked .ach-row-name { color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 0.03em; margin-bottom: 6px; }
  .ach-row-reqs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ach-row-reqs span { font-size: 10.5px; color: #cfc6de; background: rgba(255,255,255,0.06); border-radius: 999px; padding: 2px 8px; }
  .ach-row-lore { font-size: 12px; font-style: italic; color: var(--gold); }
  .mannequin-note {
    max-width: 300px; margin: 0 auto 18px; padding: 12px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.05); font-style: italic; color: var(--gold); font-size: 13.5px;
  }
  .mannequin-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    max-width: 320px; margin: 0 auto;
  }
  .mannequin-grid-solo {
    grid-template-columns: 1fr; max-width: 170px;
  }
  .mannequin-turn-icon {
    font-size: 48px; margin: 4px auto 10px; width: fit-content;
    animation: mannequinTurnAround 900ms ease-in-out;
    transform-style: preserve-3d;
  }
  @keyframes mannequinTurnAround {
    0% { transform: rotateY(0deg); }
    50% { transform: rotateY(90deg); }
    100% { transform: rotateY(180deg); }
  }
  .mannequin-slot { position: relative; aspect-ratio: 595.28 / 841.9; }
  .mannequin-slot-locked { opacity: 0.9; }
  .mannequin-lock {
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .mannequin-slot-empty {
    border: 2px dashed rgba(255,255,255,0.25); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: var(--muted);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .result-box h4 { margin: 0 0 6px; font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.03em; }
  .result-box p { margin: 0 0 5px; color: #cfc6de; line-height: 1.3; }
  .result-box p:last-child { margin-bottom: 0; }
  .result-box p b { color: #ece7f4; }
  .score-row { display: flex; justify-content: space-between; color: #cfc6de; padding: 2px 0; }
  .score-row.total { border-top: 1px solid rgba(255,255,255,0.15); margin-top: 4px; padding-top: 5px; font-weight: 600; color: #ece7f4; }
  .new-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 360px; margin: 0 auto; }
  .new-card-item { aspect-ratio: 595.28 / 841.9; }
  .flip-card { width: 100%; aspect-ratio: 595.28 / 841.9; perspective: 1000px; cursor: pointer; }
  .flip-card-inner {
    position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.3, 0.8, 0.4, 1);
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; overflow: hidden; }
  .flip-card-back { transform: rotateY(180deg); }

  /* ---------- End / year review ---------- */
  .year-list { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 0 auto 30px; }
  .year-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px 16px; font-size: 14px; }

  /* ============================================================
     DESKTOP LAYOUT
     Everything above is mobile-first and stays exactly as-is below
     this breakpoint. Above it, the page stops being a phone-width
     column adrift in a sea of empty space -- but it also does NOT
     get wrapped in a second boxed "panel" sitting on top of the
     atmospheric background (that read as a box-in-a-box). Instead,
     content sits directly on the background, just with far more
     room, and a few screens that were tuned to phone proportions
     (the title screen's text-over-art layout, the fixed-size
     outfit board) get real adjustments instead of just a wider
     wrapper. Prose/dialogue widths are deliberately left alone --
     long lines of dialogue don't get more readable at 700px, only
     card grids and the board benefit from the room.
     ============================================================ */
  @media (min-width: 900px) {
    body { padding: 48px 24px; }

    .stage { max-width: 1000px; }

    .top-bar { max-width: 1000px; margin: 0 auto; padding: 22px 6px; }

    .screen-pad { padding: 90px 10px 70px; }

    /* Title screen: the background art is a fixed illustration that was
       composed for a tall phone crop, so on a wide screen the same
       background-size:cover crops it very differently and can put the
       wordmark right behind the DOM text. Instead of fighting the crop,
       give the text panel its own scrim so it stays legible regardless
       of what the image is doing behind it, and keep it a comfortable
       reading column instead of stretching it edge to edge. */
    .title-panel {
      max-width: 560px;
      margin: 0 auto;
      padding: 120px 32px 70px;
      border-radius: 32px 32px 0 0;
      background: linear-gradient(180deg, transparent 0%, rgba(15,10,20,0.35) 35%, rgba(15,10,20,0.88) 70%, rgba(15,10,20,0.96) 100%);
    }

    /* Outfit board: was a tiny 280x340 huddle designed to look
       proportionate on a narrow phone; at real desktop width that
       left a huge dead gap around it. Scale it and its slot offsets
       up together so it reads as a deliberate centerpiece. */
    .outfit-board { max-width: 380px; height: 460px; margin: 30px auto 20px; }
    .board-slot { width: 190px; }
    .slot-0 { top: 0px;   left: 4px; }
    .slot-1 { top: 18px;  left: 167px; }
    .slot-2 { top: 170px; left: 0px; }
    .slot-3 { top: 190px; left: 163px; }

    /* Adaptive card grids instead of a fixed 3-column phone layout. */
    .deck-grid, .new-cards-grid, .set-showcase-grid,
    .quartett-pick-grid, .quartett-opponent-grid {
      max-width: 900px;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    }
    .ach-list, .souls-list, .year-list,
    .filter-panel, .set-panel, .deck-header, .deck-sort-row,
    .hand-fan, .quartett-hand-row {
      max-width: 900px;
    }
  }
</style>

// Wildcards, dealt into the deck from the start. Playing one lets you pick
// any one specific card out of your remaining deck pile instead of wearing it.


// Key Cards — quest items from the Items/Keys exploration system. They live in
// the normal draw deck (can bloat a hand like any other card) but are never
// wearable, never score, and are never chosen by a random-destruction effect.
// Real key art isn't ready yet, so the center art is a plain glyph per spec —
// swap in a fullArt SVG later without touching any of the surrounding logic.

const KEY_CARDS_BY_ID = Object.fromEntries(KEY_CARDS.map((k) => [k.id, k]));

// Keeps each key's has<Key> boolean flag in sync with activeKeyIds so other
// code (dialogue conditions, UI) can check either without them drifting apart.
const KEY_FLAG_SETTERS = {
  key_glasshouse: (v) => { hasGlassHouseKey = v; },
  key_unusual: (v) => { hasUnusualKey = v; },
  key_cafeattic: (v) => { hasCafeAtticKey = v; },
  key_royalgarden: (v) => { hasRoyalGardenKey = v; },
};

function awardKeyCard(keyId) {
  activeKeyIds.add(keyId);
  if (KEY_FLAG_SETTERS[keyId]) KEY_FLAG_SETTERS[keyId](true);
  rebuildLiveDeckFromUnlocked();
}

// Central helper for consuming a key at its lock: removes it from every card
// container it could be sitting in, clears its flag, and rebuilds liveDeck.
// The destination unlock flag itself is set by the caller (each lock is a
// different flag), right after calling this.
function consumeKeyCard(keyId) {
  activeKeyIds.delete(keyId);
  liveDeck = liveDeck.filter((c) => c.id !== keyId);
  deckPile = deckPile.filter((id) => id !== keyId);
  hand = hand.filter((id) => id !== keyId);
  discardPile = discardPile.filter((id) => id !== keyId);
  if (selectedHandId === keyId) selectedHandId = null;
  if (KEY_FLAG_SETTERS[keyId]) KEY_FLAG_SETTERS[keyId](false);
  rebuildLiveDeckFromUnlocked();
}

// Only ever purchasable from the strange vendor — never handed out for free,
// so buying never competes with the yearly reward.
// Rarity scaffolding for a future tier system (Basic -> Uncommon -> Rare -> Epic -> Mythic).
// Not yet used by scoring or visuals — just tagging cards by how they're acquired for now.
DECK.forEach((c) => { c.rarity = c.rarity || "Basic"; }); // preserve explicit per-card rarity, default the rest to Basic
// (SHOP_CARDS removed — the vendor now offers real Rare+ cards from DECK directly.)
JOKER_CARDS.forEach((c) => { c.rarity = "Basic"; });



// --- Styling Briefing System (per DEAD_GORGEOUS_Styling_Briefing_System_DECK_BALANCED) ---
// A "want" requirement is { attr, value, label } (exact match on a piece's
// attr), or a rarity requirement { attr:"rarity", anyOf:[...], label } (piece
// matches if its rarity is one of anyOf). Each worn piece is checked against
// every requirement independently, so "two styles" briefs (e.g. Elegant +
// Daring) are meant to be solved by two *different* pieces, not one piece
// doing double duty. req()/rarityReq() are tiny constructors, kept here (not
// deeper in the file) purely for readability of the CLIENTS data below —
// function declarations are hoisted, so definition order doesn't matter.
function req(attr, value, label) { return { attr, value, label: label || value }; }

function rarityReq(label) { return { attr: "rarity", anyOf: RARE_OR_HIGHER, label: label || "Rare-or-higher" }; }
// A permanent hidden preference, in the shape preferenceMatches() (below,
// further down the file — function declarations are hoisted) understands:
// { type:"attr", attr, value } — separate from the active brief, and not
// shown to the player until she's worn it once (see finishStyling()).
function pref(attr, value) { return { type: "attr", attr, value }; }

// marked [bible] are lifted or lightly adapted from the source document's
// exact dialogue; those marked [voice] are new lines written to match an
// established character's tone where the bible didn't specify one for this
// context (e.g. a Studio greeting). Death is never referenced pre-final-arc.
//
// Each client now carries 12 styling jobs (dialogue + a hard brief), running
// signature -> occasion -> outside-comfort-zone -> experimental -> constraint
// -> a final "player choice" trust job, per the briefing doc's relationship
// progression. A visit only ever plays 9 of the 12 (BRIEF_VISIT_INDICES,
// right below CLIENTS) since a full year is 9 visits per client — spaced
// across the arc so it still opens on her signature jobs and always closes
// on the trust job.
//
// A brief can also carry:
//   hint: [...] purely flavour-text attributes mentioned in the dialogue
//     (e.g. "green, if you have it"). Not separately scored — when a hint
//     happens to be one of the character's real hidden preferences it's
//     already covered by the preference bonus below; the rest are one-off
//     narrative colour that deliberately does nothing mechanically.
//   suppressPreference: [...] for "against preference" jobs — the matching
//     hidden-preference bonus is switched off for that one job only, so the
//     player isn't rewarded for ignoring what she explicitly asked for.
//   softDirection: a short in-fiction nudge shown under the brief; flavour
//     only, never changes scoring.
//   playerChoice: true marks a trust job — there is no hard brief; scoring
//     comes entirely from hidden preferences (see finishStyling()).


// A full playthrough only gives each client 9 visits (36 jobs / 4 clients —

// spread across the whole arc — always opening on her signature jobs and
// always closing on job 12, the player-choice trust job — rather than just
// truncating the list at 9 and never reaching the trust job at all.
const BRIEF_VISIT_INDICES = [0, 1, 3, 4, 6, 7, 9, 10, 11];

/* ---------------- AESTHETIC ACHIEVEMENTS ----------------
 * Hidden fashion recipes, evaluated against the four equipped outfit
 * slots (never hand/deck/collection). Conditions inside one achievement are

// Small helpers — all operate on `pieces`, the array of non-empty equipped
// cards (never more than 4, per the doc's four-slot limit).
function achEvery(pieces, pred) { return pieces.length > 0 && pieces.every(pred); }
function achSome(pieces, pred) { return pieces.some(pred); }
function achCount(pieces, pred) { return pieces.filter(pred).length; }
function achHasName(pieces, name) { return pieces.some((p) => p.name === name); }
function achHasAnyName(pieces, names) { return pieces.some((p) => names.includes(p.name)); }
function achDistinctColors(pieces) { return new Set(pieces.map((p) => p.color)).size; }
function achDistinctCategories(pieces) { return new Set(pieces.map((p) => p.category)).size; }



// Returns the ids of all achievements the submitted outfit newly unlocks
// (already-discovered ones are filtered out). Never mutates cards/outfit.
function evaluateAestheticAchievements(pieces) {
  return AESTHETIC_ACHIEVEMENTS
    .filter((a) => !discoveredAestheticAchievements.has(a.id))
    .filter((a) => {
      try { return !!a.test(pieces); } catch (e) { return false; }
    })
    .map((a) => a.id);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function currentClient() {
  if (specialJob) return specialJob.virtualClient;

function findCard(id) { return liveDeck.find((c) => c.id === id); }

function heartsHTML(n) {
  const clamped = Math.max(0, Math.min(n, 5));
  const fullCount = Math.floor(clamped);
  const hasHalf = clamped - fullCount >= 0.5;
  const emptyCount = 5 - fullCount - (hasHalf ? 1 : 0);
  const half = hasHalf
    ? `<span class="half-heart" aria-hidden="true">❤</span>`
    : "";
  return "❤".repeat(fullCount) + half + "🤍".repeat(emptyCount);
}

  // yearVisits drives which of the 9 authored briefs shows this visit and IS
  // reset at the Year 1→2 transition (see enterYearTwo()), so Year 2 replays
  // the same nine-visit brief schedule per the companion spec §17.1, while
  // CLIENT_STAGES keeps advancing on lifetime visits without a replayed
  // first-meeting greeting.
  profile.yearVisits = (profile.yearVisits || 0) + 1;
  const visitNumberThisYear = profile.yearVisits - 1; // 0-indexed visit about to happen, within the year
  soulStep = 0;
  dialogueLineIndex = 0;
  const briefs = CLIENTS[key].briefs;
  // See BRIEF_VISIT_INDICES: only 9 of a client's 12 authored jobs are ever
  // played in one year, spaced across the arc and always ending on the
  // player-choice trust job. Visits past the 9th (shouldn't normally happen
  // in a 36-job year, but safe to fall back) just replay the trust job.
  const briefIndex = BRIEF_VISIT_INDICES[Math.min(visitNumberThisYear, BRIEF_VISIT_INDICES.length - 1)];
  currentBrief = briefs[briefIndex];

  // Redraw from the FULL unlocked pool every round, not a depleting carryover
  // -- otherwise categories can get temporarily exhausted for several rounds
  // in a row (everything of one kind sitting in the discard pile), which is
  // exactly what caused unfair hands like five pairs of shoes with no tops
  // available to draw at all.
  const jokerIds = new Set(JOKER_CARDS.map((c) => c.id));
  deckPile = liveDeck.filter((c) => !jokerIds.has(c.id)).map((c) => c.id);
  discardPile = [];
  const handIds = drawInitialHand(deckPile);
  deckPile = deckPile.filter((id) => !handIds.includes(id));
  hand = handIds;
}

// Draw a hand that always tries to cover Jacket, Top-or-Dress, Bottom, and
// Shoes first, so you're never stuck holding five of the same category.
// targetSize defaults to a full hand, but callers can ask for fewer slots
// (e.g. when some slots are already reserved for Key Cards — see
// drawInitialHand below).
function drawBalancedHand(pool, targetSize = HAND_SIZE) {
  let remaining = [...pool];
  const picked = [];

  function takeOneOf(categories) {
    if (picked.length >= targetSize) return;
    const candidates = remaining.filter((id) => categories.includes(findCard(id).category));
    if (candidates.length === 0) return;
    const choice = candidates[Math.floor(Math.random() * candidates.length)];
    remaining = remaining.filter((id) => id !== choice);
    picked.push(choice);
  }

  takeOneOf(["Jacket"]);
  takeOneOf(["Top", "Dress"]);
  takeOneOf(["Bottom"]);
  takeOneOf(["Shoes"]);

  // Any remaining slots prefer a category not already doubled-up in hand,
  // so the 5th card doesn't just pile onto whatever the first four were.
  while (picked.length < targetSize && remaining.length > 0) {
    const pickedCats = picked.map((id) => findCard(id).category);
    const freshCandidates = remaining.filter((id) => !pickedCats.includes(findCard(id).category));
    const candidatePool = freshCandidates.length > 0 ? freshCandidates : remaining;
    const choice = candidatePool[Math.floor(Math.random() * candidatePool.length)];
    remaining = remaining.filter((id) => id !== choice);
    picked.push(choice);
  }
  return picked;
}

// Key Card-aware initial hand draw (Items/Keys spec §2.2). Carrying keys can
// genuinely make a hand worse — they are NOT exempted or capped. A raw random
// sample of the full pool decides how many Key Cards (0..HAND_SIZE) land in
// this hand; whatever's left is filled with the normal balanced wearable draw.
function drawInitialHand(pool) {
  const keyIdSet = new Set(KEY_CARDS.map((k) => k.id));
  const rawSample = shuffle(pool).slice(0, HAND_SIZE);
  const reservedKeys = rawSample.filter((id) => keyIdSet.has(id));

  const wearablePool = pool.filter((id) => !keyIdSet.has(id));
  const wearableHand = drawBalancedHand(wearablePool, HAND_SIZE - reservedKeys.length);

  return [...reservedKeys, ...wearableHand];
}

// A deliberately smaller, self-contained scoring formula for special jobs:
// brief match + rarity fit + hidden-preference match (+8 each, uncapped,
// matching the "core-client style" scoring the specs call for) + the active
// seasonal event bonus + gap penalty. No welcome bonus (that's specifically
// for a client's first few EVER visits) and no matching-set bonus (none of
// the three special jobs' specs mention one) -- keeping this intentionally
// lean and separate from finishStyling() so the well-tested core client path
// can never be affected by this one.
function scoreSpecialOutfit(pieces, virtualClient, brief) {
  const wantList = brief.want || [];
  const pieceDetails = pieces.map((piece) => {
    const matchedAttrs = wantList.filter((r) => reqMatches(r, piece));
    const briefPts = wantList.reduce((sum, r) => sum + reqMatchWeight(r, piece) * 25, 0);
    let rarityPts = 0;
    if (matchedAttrs.length > 0) rarityPts = RARITY_FIT_BONUS[piece.rarity] || 0;
    else if (HIGH_RARITY.has(piece.rarity)) rarityPts = RARITY_OFFBRIEF_BONUS;
    return { briefPts, rarityPts };
  });
  const rawBriefScore = pieceDetails.reduce((sum, d) => sum + d.briefPts, 0);
  const briefScore = Math.min(rawBriefScore, 100);
  const rarityBonus = pieceDetails.reduce((sum, d) => sum + d.rarityPts, 0);

  const matchedPreferences = (virtualClient.preferences || []).filter((rule) => preferenceMatches(rule, pieces));
  const preferenceBonus = matchedPreferences.reduce((sum, rule) => sum + preferenceMatchWeight(rule, pieces) * 8, 0);

  const activeEvent = currentMonthEvent();
  const eventDef = activeEvent ? EVENT_BONUSES[activeEvent] : null;
  let eventBonus = 0;
  if (eventDef) {
    const fits = pieces.some((p) =>
      (eventDef.styles && (eventDef.styles.includes(p.style) || eventDef.styles.includes(p.style2))) ||
      (eventDef.colors && eventDef.colors.includes(p.color)) ||
      (eventDef.categories && eventDef.categories.includes(p.category)) ||
      (eventDef.rarities && eventDef.rarities.includes(p.rarity))
    );
    if (fits) eventBonus = 10;
  }

  const hasDress = pieces.some((p) => p.category === "Dress");
  const hasShoes = pieces.some((p) => p.category === "Shoes");
  const hasTop = pieces.some((p) => p.category === "Top");
  const hasBottom = pieces.some((p) => p.category === "Bottom");
  let gapPenalty = 0;
  if (!hasShoes) gapPenalty -= 10;
  if (!hasDress && !hasTop) gapPenalty -= 10;
  if (!hasDress && !hasBottom) gapPenalty -= 10;

  return Math.max(0, briefScore + rarityBonus + preferenceBonus + eventBonus + gapPenalty);
}

// Progression: start with a smaller pool, unlock 5 more random cards at the
// end of each of the year's 4 seasons (every 9 jobs, since 36 jobs / 4).
const STARTER_DECK_SIZE = 20;
const CARDS_PER_SEASON_UNLOCK = 5;
const SEASON_END_JOBS = [8, 17, 26, 35]; // 0-indexed job that completes each season

// Rarity should actually mean something: Basic is the norm, Legendary is a
// real rarity, not a coin flip. Weights are relative, not percentages.


// Weighted sampling without replacement -- picks `n` cards from `pool`,
// biased by RARITY_WEIGHTS, never picking the same card twice.
function weightedSample(pool, n) {
  const remaining = [...pool];
  const picked = [];
  while (picked.length < n && remaining.length > 0) {
    const total = remaining.reduce((sum, c) => sum + (RARITY_WEIGHTS[c.rarity] || 1), 0);
    let roll = Math.random() * total;
    let idx = 0;
    for (; idx < remaining.length; idx++) {
      roll -= RARITY_WEIGHTS[remaining[idx].rarity] || 1;
      if (roll <= 0) break;
    }
    picked.push(remaining.splice(Math.min(idx, remaining.length - 1), 1)[0]);
  }
  return picked;
}

function pickStarterDeck() {
  // guarantee at least one of each core category before filling by rarity weight
  const coreCats = ["Top", "Bottom", "Dress", "Shoes"];
  const picked = [];
  coreCats.forEach((cat) => {
    const candidates = shuffle(DECK.filter((c) => c.category === cat && !picked.includes(c)));
    if (candidates.length > 0) picked.push(candidates[0]);
  });
  const remainingPool = DECK.filter((c) => !picked.includes(c));
  picked.push(...weightedSample(remainingPool, STARTER_DECK_SIZE - picked.length));
  return picked;
}

function unlockRandomCards(n) {
  const lockedIds = new Set(unlockedCardIds);
  const pool = DECK.filter((c) => !lockedIds.has(c.id));
  const newly = weightedSample(pool, n);
  newly.forEach((c) => unlockedCardIds.add(c.id));
  return newly;
}

// Awards a one-time 10 Moon Coin bonus the moment every card in a named set
// is owned at once -- separate from discoveredSets (wearing a full set
// together in one outfit). Called from rebuildLiveDeckFromUnlocked() so it's
// automatically checked after every single way a card can be acquired
// (season unlock, shop, back room, attic, glass house, royal garden, year-end
// reward, starter deck) without needing a separate hook at each call site.
function checkCollectionSetBonuses() {
  Object.keys(SET_NAMES).forEach((setId) => {
    if (collectedSets.has(setId)) return;
    const { owned, total } = setOwnedCount(setId);
    if (total > 0 && owned === total) {
      collectedSets.add(setId);
      moonCoins += 10;
    }
  });
}

function rebuildLiveDeckFromUnlocked() {
  const unlocked = DECK.filter((c) => unlockedCardIds.has(c.id));
  const activeKeys = KEY_CARDS.filter((k) => activeKeyIds.has(k.id));
  const storyWearables = thornVeilOwned ? [THORN_VEIL] : [];
  liveDeck = [...unlocked, ...storyWearables, ...activeKeys, ...JOKER_CARDS];
  checkCollectionSetBonuses();
}

// ---------------------------------------------------------------------------
// Story-beat pacing gate. Keeps Castle/Café/Nightgarden on the same rhythm
// the bible already uses for seasonal events, without letting them be
// revisited for unlimited story content between jobs. Shared pool (see
// STORY_BEATS_PER_JOB) rather than one-per-location, so a single job can
// still yield a few different moments across the three spots, spent however
// the player chooses to explore -- just not infinitely on the same spot.
// Each wrapper still lets through content that was never meant to be gated
// in the first place (Castle's pre-unlock flavor cycle, Nightgarden's
// seasonal closed message) -- only the actual character content is paced.
// ---------------------------------------------------------------------------
function visitCastle() {
  if (!castleGateCharactersUnlocked) { renderCastle(); return; }
  if (storyBeatsRemaining <= 0) {
    renderCastleScene([{ who: "NARRATION", t: "The two guards stand exactly where they always do." }], "Back to the map", "renderMap()");
    return;
  }
  storyBeatsRemaining -= 1;
  renderCastle();
}

function visitCafe() {
  if (storyBeatsRemaining <= 0) {
    // Café already always had a harmless flavor-only fallback before Maya
    // existed -- reuse it here instead of a blocking message, so a quick
    // visit still feels like the café rather than a locked door.
    const snippet = CAFE_SNIPPETS[Math.floor(Math.random() * CAFE_SNIPPETS.length)];
    renderCafeScreen([{ who: "NARRATION", t: snippet }], "Leave", "renderMap()");
    return;
  }
  storyBeatsRemaining -= 1;
  renderCafe();
}

function visitGarden() {
  if (!nightgardenOpen()) { renderGarden(); return; }
  if (storyBeatsRemaining <= 0) {
    renderGardenScene([{ who: "NARRATION", t: "The garden is quiet. Whatever's out there isn't showing itself right now." }], "Back to the map", "renderMap()");
    return;
  }
  storyBeatsRemaining -= 1;
  renderGarden();
}

/* ===========================================================================
   OLD QUARTER + THE MANNEQUIN
   Per DEAD_GORGEOUS_OLD_QUARTER_MANNEQUIN_COMPLETE_FOR_CLAUDE. A normal,
   repeatable map location -- NOT gated by storyBeatsRemaining like Castle/
   Café/Garden, and LOOK AROUND never touches clientRoundIndex/month/season
   progression. The Mannequin puzzle is entirely separate from normal Studio
   scoring (no brief matching, no hidden preferences, no set/rarity/
   Aesthetic-Achievement bonuses).
   =========================================================================== */

let windowIntroSeen = false;
let windowFirstSolveSeen = false;
let windowSolved = {}; // e.g. { "1-spring": true }
let seenOldQuarterEncounters = {}; // encounter id -> true
let lastOldQuarterObservation = null; // avoids repeating the same line twice in a row

function currentSeasonKey() { return `${currentYear}-${currentSeasonName()}`; }

// Eight active puzzles across Years 1-2, split into exactly two modes per
// the spec: TEXT_RIDDLE (a note, ONE empty slot, no locked cards at all) and
// COMPLETE_ROW (no note, 3 locked display cards + 1 empty slot, where the
// answer must match both the shared attribute AND the one category missing
// from the row). Locked display cards are real DECK cards used purely as
// boutique props -- never owned/consumed, never leave the display. Each
// COMPLETE_ROW trio was deliberately picked so no attribute OTHER than the
// intended one (and, separately, category) is shared by more than one of
// the three locked cards, so the row never accidentally suggests a second,
// wrong pattern.


function currentMannequinPuzzle() { return MANNEQUIN_PUZZLES[currentSeasonKey()] || null; }

// DECK never contains Key/Joker/story-wearable cards (those live in separate
// arrays -- see KEY_CARDS/JOKER_CARDS/THORN_VEIL), so filtering against DECK
// already satisfies "Key/story cards are not eligible" with no extra check.
// Used ONLY for the fairness gate (does a valid answer exist at all) --
// never to decide what the picker itself shows, or every submission would
// be guaranteed correct and the riddle would solve itself.
function mannequinEligibleOwnedCards(puzzle) {
  if (!puzzle) return [];
  return DECK.filter((c) => unlockedCardIds.has(c.id) && puzzle.matches(c));
}

// The picker's actual candidate list: the player's whole eligible
// collection, unfiltered by correctness. The player has to work out the
// answer themselves -- from the locked row or the note -- same as picking
// wrong is a real, reachable outcome.
function mannequinAllOwnedFashionCards() {
  return DECK.filter((c) => unlockedCardIds.has(c.id));
}

  stage.innerHTML = `
    <div class="center-col screen-pad">

      <button class="primary" onclick="renderOldQuarterWindow()">Look at the window</button>

  `;

}

function renderOldQuarterWindow() {
  const key = currentSeasonKey();
  const puzzle = MANNEQUIN_PUZZLES[key];

  if (!puzzle) {
    stage.innerHTML = `
      <div class="center-col screen-pad">
        <h2>The window</h2>
        <p class="line">The boutique display is empty this season.</p>
        <button class="ghost" style="margin-top:22px;" onclick="visitOldQuarter()">Back</button>
      </div>
    `;
    updateTopBar("", true);
    return;
  }

  if (windowSolved[key]) {
    stage.innerHTML = `
      <div class="center-col screen-pad">
        <h2>The window</h2>
        <p class="line">The mannequin is complete.</p>
        <button class="ghost" style="margin-top:22px;" onclick="visitOldQuarter()">Back</button>
      </div>
    `;
    updateTopBar("", true);
    return;
  }

  const introLines = !windowIntroSeen
    ? [
        "One window is still dressed.",
        "Behind the dusty glass stands a mannequin.",
        "The display is waiting for an answer.",
        "There's no sign on the door. No opening hours either.",
        "Looks like you're supposed to give it one.",
      ]
    : ["The mannequin is waiting."];
  windowIntroSeen = true;

  const hasAnswer = mannequinEligibleOwnedCards(puzzle).length > 0;
  const presentButton = hasAnswer
    ? `<button class="primary" style="margin-top:18px;" onclick="openMannequinPicker()">Present a card</button>`
    : `<p class="line" style="margin-top:14px; color:var(--muted);">You don't have what it wants. Yet.</p>`;

  // TEXT_RIDDLE: the note plus exactly one empty slot -- no locked cards, no
  // grid, nothing else visible. COMPLETE_ROW: three locked props (never
  // owned by the player) plus one empty slot, no note (Y2 Winter's
  // flavorCaption is a mood caption, not a solvable clue, so it's shown the
  // same way regardless of mode).
  let displayHTML;
  if (puzzle.mode === "TEXT_RIDDLE") {
    displayHTML = `
      <div class="mannequin-note">\u201c${puzzle.note}\u201d</div>
      <div class="mannequin-grid mannequin-grid-solo">
        <div class="mannequin-slot mannequin-slot-empty">?</div>
      </div>
    `;
  } else {
    const lockedHTML = puzzle.lockedIds.map((id) => {
      const card = DECK.find((c) => c.id === id);
      return `<div class="mannequin-slot mannequin-slot-locked">${gcardHTML(card)}<div class="mannequin-lock">\ud83d\udd12</div></div>`;
    }).join("");
    const captionHTML = puzzle.flavorCaption
      ? `<div class="mannequin-note">\u201c${puzzle.flavorCaption}\u201d</div>`
      : "";
    displayHTML = `
      ${captionHTML}
      <div class="mannequin-grid">
        ${lockedHTML}
        <div class="mannequin-slot mannequin-slot-empty">?</div>
      </div>
    `;
  }

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <h2>The window</h2>
      <div class="line" style="max-width:320px; margin-bottom:14px;">${introLines.map((l) => `<p style="margin:4px 0;">${l}</p>`).join("")}</div>
      ${displayHTML}
      ${presentButton}
      <button class="ghost" style="margin-top:18px;" onclick="visitOldQuarter()">Back</button>
    </div>
  `;
  updateTopBar("", true);
}

// Bespoke picker (reuses the #deckOverlay element/CSS, but is intentionally
// NOT the same code path as jokerPicking) so the Discovered Sets panel stays
// visible here -- unlike joker-picking, the Spring Set puzzle needs it.
function openMannequinPicker() {
  renderMannequinPicker();
  document.getElementById("deckOverlay").classList.add("open");
}

function closeMannequinPicker() {
  document.getElementById("deckOverlay").classList.remove("open");
}

function renderMannequinPicker() {
  const overlay = document.getElementById("deckOverlay");
  const puzzle = currentMannequinPuzzle();
  const candidates = mannequinAllOwnedFashionCards();
  const items = candidates.map((card) => `
    <div class="deck-item status-pool" onclick="submitMannequinCard(${card.id})">
      ${gcardHTML(card)}
    </div>
  `).join("");

  const noteHTML = puzzle.note ? `<div class="mannequin-note" style="margin:0 auto 16px;">\u201c${puzzle.note}\u201d</div>` : "";

  overlay.innerHTML = `
    <div class="deck-header">
      <h3>Choose a card to present</h3>
      <button class="deck-close" onclick="closeMannequinPicker()">\u2715</button>
    </div>
    ${noteHTML}
    ${discoveredSetsHTML()}
    <div class="deck-grid">${items}</div>
  `;
}

function submitMannequinCard(cardId) {
  const puzzle = currentMannequinPuzzle();
  const key = currentSeasonKey();
  closeMannequinPicker();
  const card = DECK.find((c) => c.id === cardId);
  if (!puzzle || !card || !unlockedCardIds.has(card.id) || !puzzle.matches(card)) {
    renderMannequinWrongAnswer(puzzle);
    return;
  }
  windowSolved[key] = true;
  const reward = unlockRandomCards(1);
  rebuildLiveDeckFromUnlocked();
  renderMannequinReward(reward[0] || null, puzzle);
}

function renderMannequinWrongAnswer(puzzle) {
  const noteHTML = puzzle && puzzle.note ? `<div class="mannequin-note">\u201c${puzzle.note}\u201d</div>` : "";
  stage.innerHTML = `

  updateTopBar("", true);

function renderMannequinReward(card, puzzle) {
  const isFirstEverSolve = !windowFirstSolveSeen;

function oldQuarterEligibleEncounters(seasonKey) {
  return (OLD_QUARTER_ENCOUNTERS[seasonKey] || []).filter((e) => e.eligible());
}

function renderOldQuarterLookAround() {
  const key = currentSeasonKey();
  const eligible = oldQuarterEligibleEncounters(key);
  const rollEncounter = eligible.length > 0 && Math.random() < 0.3;
  if (rollEncounter) {
    const chosen = eligible[Math.floor(Math.random() * eligible.length)];
    chosen.render();
    return;
  }
  renderOldQuarterObservation(key);
}

function renderOldQuarterObservation(key) {
  const pool = OLD_QUARTER_OBSERVATIONS[key] || ["Nothing unusual is happening in the Old Quarter tonight."];
  let candidates = pool;
  if (pool.length > 1 && lastOldQuarterObservation) {
    candidates = pool.filter((line) => line !== lastOldQuarterObservation);
    if (candidates.length === 0) candidates = pool;
  }
  const chosen = candidates[Math.floor(Math.random() * candidates.length)];
  lastOldQuarterObservation = chosen;
  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="soul-name">Old Quarter</div>
      <p class="line" style="max-width:320px;">${chosen}</p>

}

function renderMap() {
  // The map is the one stable "hub" screen -- no mid-job transient state to
  // worry about here, so this is the single autosave checkpoint that covers
  // the whole gameplay loop (after a result, after shopping, after a season
  // reveal, right after starting a game).
  saveGame();
  mapMessage = "";
  const monthName = MONTHS[currentMonthIndex()];

  const tiles = [
    { key: "studio", label: "Studio", locked: false, action: "renderShuffle()" },
    { key: "shop", label: "Shop", locked: false, action: "renderShop()" },
    { key: "cafe", label: "Night Café", locked: false, action: "visitCafe()" },
    { key: "castle", label: "Night Castle", locked: restrictedPhase.castle < 4, action: "visitCastle()" },
    { key: "garden", label: "Nightgarden", locked: false, action: "visitGarden()" },
    { key: "oldquarter", label: "Old Quarter", locked: false, action: "visitOldQuarter()" },
  ];

  const tilesHTML = tiles.map((t) => `
    <div class="map-tile ${t.locked ? "locked" : ""}"
         onclick="${t.locked ? `lockedTile('${t.key}')` : t.action}">
      <div class="map-tile-label">${t.label}${t.locked ? ' <span class="lock">🔒</span>' : ""}</div>
    </div>

  stage.innerHTML = `
    <div class="map-fullscreen-bg"></div>

      <div class="map-grid">${tilesHTML}</div>
      <div class="map-message">${mapMessage}</div>

}

function lockedTile(key) {
  const phases = RESTRICTED_PHASES[key];
  const idx = Math.min(restrictedPhase[key], phases.length - 1);
  mapMessage = `🔒 ${phases[idx]}`;
  restrictedPhase[key] = idx + 1;
  document.querySelector(".map-message").textContent = mapMessage;
}

  return weightedSample(pool, 1)[0];
}

  renderMap();
}

// Main-room priority resolver: back-door reveal (must pre-empt everything
// else the very first visit it's eligible) > Maya first meeting > cross-doc
// reactions > Maya's one-time Attic hint > Maya ambient (monthly cap) >
// existing generic Café flavor as the final fallback.
function buildCafeEvents() {
  const ym = yearMonthKey();
  return [
    { eligible: () => hasUnusualKey && !cafeBackDoorDiscovered, run: renderCafeBackDoorReveal },
    {
      eligible: () => !metMaya && mayaEligible(),
      run: () => renderCafeScreen(MAYA_FIRST_SCENE, "Leave", "afterMayaFirst()"),
    },
    {
      eligible: () => metMaya && hasFadedPhotograph && !mayaPhotoReactionSeen,
      run: () => renderCafeScreen(MAYA_PHOTO_REACTION, "Leave", "afterMayaPhotoReaction()"),
    },
    {
      eligible: () => metMaya && cafeBackRoomUnlocked && !mayaBackRoomReactionSeen,
      run: () => renderCafeScreen(MAYA_BACKROOM_REACTION, "Leave", "afterMayaBackRoomReaction()"),
    },
    {
      eligible: mayaAtticHintEligible,
      run: () => renderCafeScreen(MAYA_ATTIC_HINT_SCENE, "Leave", "afterMayaAtticHint()"),
    },
    {
      eligible: () => !!getFestivalReactionFor("maya", metMaya),
      run: () => {
        const f = getFestivalReactionFor("maya", metMaya);
        markSeasonalReactionSeen("maya", f.eventId);
        renderCafeScreen(f.lines, "Leave", "renderMap()");
      },
    },
    {
      eligible: () => metMaya && mayaLastAmbientYearMonth !== ym,
      run: () => {
        const unseen = MAYA_AMBIENT.map((_, i) => i).filter((i) => !mayaAmbientSeen.includes(i));
        const pool = unseen.length > 0 ? unseen : MAYA_AMBIENT.map((_, i) => i);
        const idx = pool[Math.floor(Math.random() * pool.length)];
        if (!mayaAmbientSeen.includes(idx)) mayaAmbientSeen.push(idx);
        mayaLastAmbientYearMonth = ym;
        mayaEncounterCount += 1;
        renderCafeScreen(MAYA_AMBIENT[idx], "Leave", "renderMap()");
      },
    },
    {
      eligible: () => true,
      run: () => {
        const snippet = CAFE_SNIPPETS[Math.floor(Math.random() * CAFE_SNIPPETS.length)];
        renderCafeScreen([{ who: "NARRATION", t: snippet }], "Leave", "renderMap()");
      },
    },
  ];
}

function renderCafe() {
  runFirstEligibleEvent(buildCafeEvents());
}

let cacheOfferedCardIds = [];
let cacheSelectedCardIds = [];

function renderCafeBackRoomCache() {
  if (cacheOfferedCardIds.length === 0) {
    const owned = new Set(unlockedCardIds);
    const pool = DECK.filter((c) => ["Rare", "Iconic", "Legendary"].includes(c.rarity) && !owned.has(c.id));
    cacheOfferedCardIds = shuffle(pool).slice(0, Math.min(4, pool.length)).map((c) => c.id);
    cacheSelectedCardIds = [];
  }
  const cards = cacheOfferedCardIds.map((id) => DECK.find((c) => c.id === id));
  const itemsHTML = cards.map((c) => {
    const selected = cacheSelectedCardIds.includes(c.id);
    return `
      <div class="deck-item ${selected ? "status-hand" : "status-pool"}" onclick="toggleCacheCard(${c.id})">
        ${gcardHTML(c)}
        <div class="deck-status">${selected ? "Chosen" : "Tap to choose"}</div>
      </div>
    `;
  }).join("");
  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="portrait">🗝</div>
      <div class="soul-name">Back Room</div>
      <div class="speech narration-line">The room has no windows.</div>

function toggleCacheCard(id) {
  if (cacheSelectedCardIds.includes(id)) {
    cacheSelectedCardIds = cacheSelectedCardIds.filter((x) => x !== id);
  } else if (cacheSelectedCardIds.length < 2) {
    cacheSelectedCardIds = [...cacheSelectedCardIds, id];
  }
  renderCafeBackRoomCache();
}

function confirmCacheChoice() {
  if (cacheSelectedCardIds.length !== 2) return;
  cacheSelectedCardIds.forEach((id) => unlockedCardIds.add(id));
  rebuildLiveDeckFromUnlocked();
  hasSilverBell = true;
  cafeBackRoomCacheClaimed = true;

  const boxHTML = backRoomBoxUsesRemaining <= 0 || pool.length === 0
    ? `<p style="color:var(--muted);">The box is empty.</p>`

      ${boxHTML}
      <button class="ghost" style="margin-top:22px;" onclick="renderMap()">Leave</button>

function openUnmarkedBox() {
  const ym = yearMonthKey();
  if (backRoomBoxUsesRemaining <= 0 || backRoomBoxPurchasedYearMonth === ym || moonCoins < 3) return;
  const owned = new Set(unlockedCardIds);
  const pool = DECK.filter((c) => ["Rare", "Iconic", "Legendary"].includes(c.rarity) && !owned.has(c.id));
  if (pool.length === 0) { renderCafeBackRoom(); return; }
  moonCoins -= 3;

  backRoomBoxPurchasedYearMonth = ym;
  backRoomBoxUsesRemaining -= 1;
  renderCardAcquiredScreen("Found something.", awarded, "Continue", true);

/* ===========================================================================
   NIGHT CAFÉ — QUARTETT
   Per DEAD_GORGEOUS_QUARTETT_IMPLEMENTATION_SPEC_FOR_CLAUDE. Casual mode
   only: no card loss, no Moon Coin wager -- winning awards one random card
   the player doesn't already own. Reachable straight from the already-

   Capped at 5 sessions per in-game month, tracked against yearMonthKey()
   the same way Maya's ambient-line cooldown is; the cap silently resets the
   moment the key changes. Maya plus the Core Four are the opponent roster;
   each opponent's Quartett hand is drawn from her own themed subset of the
   global DECK (see QUARTETT_OPPONENTS), not from the player's collection.
