const QUARTETT_MAX_SESSIONS_PER_MONTH = 5;
const QUARTETT_HAND_SIZE = 6;
const QUARTETT_ROUNDS = 5;
const QUARTETT_WIN_TARGET = 3;

// Cards the player has tapped on the pre-match picker screen -- lives
// outside quartettMatch since no match exists yet while picking.
let quartettDraftSelection = [];

// Per-opponent config: portrait, a themed Quartett card pool (a subset of
// the global DECK reflecting that character's taste, per the styling-brief
// hidden-preference tables -- NOT the player's own collection), and a
// handful of authored lines in her established voice. Deliberately sparse
// per spec §19: flavor only, not new biography/lore. Maya plus the Core
// Four are all reachable from the Café without any unlock gate, same as
// they already are as normal styling clients.


// Shared across every opponent -- not authored per-character since it's
// shown before an opponent is even chosen.


function quartettPickLine(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// -- Session cap -------------------------------------------------------------

function quartettRefreshSessionWindow() {
  const ym = yearMonthKey();
  if (quartettSessionsUsedYearMonth !== ym) {
    quartettSessionsUsedYearMonth = ym;
    quartettSessionsUsedCount = 0;
  }
}
function quartettSessionsRemaining() {
  quartettRefreshSessionWindow();
  return Math.max(0, QUARTETT_MAX_SESSIONS_PER_MONTH - quartettSessionsUsedCount);
}

// -- Card pools ---------------------------------------------------------------

// Any card by id, owned or not -- an opponent's hand is never part of the
// player's liveDeck, so the global findCard() (which only searches
// liveDeck) can't be used for opponent cards.
function quartettFindCard(id) { return DECK.find((c) => c.id === id); }

function quartettPlayerEligibleCards() {
  return DECK.filter((c) => unlockedCardIds.has(c.id));
}

// -- Rarity / call evaluation --------------------------------------------------

function quartettRarityIdx(card) { return RARITY_ORDER[card.rarity] ?? 0; }

function quartettCardSatisfies(card, call) {
  switch (call.primaryType) {
    case "color": return card.color === call.primaryValue;
    case "style": return card.style === call.primaryValue; // style1 only, by design
    case "fit": return card.fit === call.primaryValue;
    case "category": return card.category === call.primaryValue;
    default: return false;
  }
}

// Returns "A" (player), "B" (opponent) or "draw" for one round, per spec §5
// steps 6-10.
function quartettEvaluateRound(call, cardA, cardB) {
  if (call.primaryType === "rarityHigh" || call.primaryType === "rarityLow") {
    const ra = quartettRarityIdx(cardA), rb = quartettRarityIdx(cardB);
    if (ra === rb) return "draw";
    const aWins = call.primaryType === "rarityHigh" ? ra > rb : ra < rb;
    return aWins ? "A" : "B";
  }
  if (call.primaryType === "exactRarity") {
    const aSat = cardA.rarity === call.primaryValue;
    const bSat = cardB.rarity === call.primaryValue;
    if (aSat && !bSat) return "A";
    if (bSat && !aSat) return "B";
    return "draw"; // both match, or neither -- table only defines the "both" case
  }

  const aSat = quartettCardSatisfies(cardA, call);
  const bSat = quartettCardSatisfies(cardB, call);
  if (aSat && !bSat) return "A";
  if (bSat && !aSat) return "B";

  // Both satisfy, or neither does -- apply the visible tie-breaker directly
  // to the two cards' rarity either way (spec §5 step 9: apply the
  // tie-breaker "where meaningful").
  const ra = quartettRarityIdx(cardA), rb = quartettRarityIdx(cardB);
  if (ra === rb) return "draw";
  const aWins = call.tieBreaker === "rarityHigh" ? ra > rb : ra < rb;
  return aWins ? "A" : "B";
}

// -- Call generation ------------------------------------------------------------

const QUARTETT_ATTR_TYPES = ["color", "style", "fit"];

function quartettValuesInHands(type, hands) {
  const set = new Set();
  hands.forEach((h) => h.forEach((c) => set.add(c[type])));
  return Array.from(set);
}

function quartettMakeAttrCall(type, hands, forceLowTieBreak) {
  const values = quartettValuesInHands(type, hands);
  if (values.length === 0) return null;
  const value = values[Math.floor(Math.random() * values.length)];
  // Style calls can go either direction "as authored" per the call-library
  // table; color/fit default to higher-rarity-wins.
  const lowTie = forceLowTieBreak || (type === "style" && Math.random() < 0.3);
  return {
    id: `${type}:${value}:${lowTie ? "lo" : "hi"}`,
    primaryType: type,
    primaryValue: value,
    tieBreaker: lowTie ? "rarityLow" : "rarityHigh",
    label: `${value.toUpperCase()} — ${lowTie ? "Lower" : "Higher"} rarity wins ties`,
  };
}

function quartettMakeCategoryCall(hands) {
  const values = quartettValuesInHands("category", hands);
  if (values.length === 0) return null;
  const value = values[Math.floor(Math.random() * values.length)];
  return {
    id: `category:${value}`, primaryType: "category", primaryValue: value, tieBreaker: "rarityHigh",
    label: `${value.toUpperCase()} — Higher rarity wins ties`,
  };
}

function quartettMakeRarityCall(hands) {
  const roll = Math.random();
  if (roll < 0.4) return { id: "rarityHigh", primaryType: "rarityHigh", primaryValue: null, tieBreaker: null, label: "HIGHEST RARITY — same rarity is a Draw" };
  if (roll < 0.8) return { id: "rarityLow", primaryType: "rarityLow", primaryValue: null, tieBreaker: null, label: "LOWEST RARITY — same rarity is a Draw" };
  const values = quartettValuesInHands("rarity", hands);
  const value = values.length > 0 ? values[Math.floor(Math.random() * values.length)] : "Basic";
  return { id: `exactRarity:${value}`, primaryType: "exactRarity", primaryValue: value, tieBreaker: null, label: `EXACTLY ${value.toUpperCase()} — matching either or neither is a Draw` };
}

// Whether a hand has at least one card that's "in play" for a call -- used
// only by the fairness pass below, never by the match engine itself.
function quartettHandHasCompetitor(hand, call) {
  if (["rarityHigh", "rarityLow", "exactRarity"].includes(call.primaryType)) return true;
  return hand.some((c) => quartettCardSatisfies(c, call));
}

// Generates the fixed 5-call sequence for a match. Not an exhaustive solver
// -- a bounded number of reroll attempts biased toward spec §10's fairness
// guidance (both sides get at least 2 plausible calls somewhere in the
// five), then it accepts the best candidate seen rather than looping
// forever chasing a perfect sequence. The sequence never changes once a
// match starts.
function quartettGenerateCalls(playerHand, opponentHand) {
  const hands = [playerHand, opponentHand];
  let best = null, bestScore = -1;

  for (let attempt = 0; attempt < 12; attempt++) {
    const usedKeys = new Set();
    const calls = [];
    const attrTypesShuffled = shuffle(QUARTETT_ATTR_TYPES.slice());
    for (let i = 0; i < 2 && calls.length < 2; i++) {
      const call = quartettMakeAttrCall(attrTypesShuffled[i % attrTypesShuffled.length], hands);
      if (call && !usedKeys.has(call.id)) { calls.push(call); usedKeys.add(call.id); }
    }
    const catCall = quartettMakeCategoryCall(hands);
    if (catCall && !usedKeys.has(catCall.id)) { calls.push(catCall); usedKeys.add(catCall.id); }
    const rarCall = quartettMakeRarityCall(hands);
    calls.push(rarCall);
    // Wildcard: one more attribute/category call, biased toward an inverted
    // tie-breaker so it reads as the match's one deliberate twist.
    const wildType = shuffle(["color", "style", "fit", "category"])[0];
    const wild = wildType === "category" ? quartettMakeCategoryCall(hands) : quartettMakeAttrCall(wildType, hands, true);
    if (wild && !usedKeys.has(wild.id)) { calls.push(wild); usedKeys.add(wild.id); }
    while (calls.length < QUARTETT_ROUNDS) {
      const filler = quartettMakeAttrCall(shuffle(QUARTETT_ATTR_TYPES.slice())[0], hands);
      if (filler) calls.push(filler); else break;
    }
    const finalCalls = calls.slice(0, QUARTETT_ROUNDS);

    const playerMatches = finalCalls.filter((c) => quartettHandHasCompetitor(playerHand, c)).length;
    const oppMatches = finalCalls.filter((c) => quartettHandHasCompetitor(opponentHand, c)).length;
    const score = Math.min(playerMatches, oppMatches) * 10 + playerMatches + oppMatches;
    if (score > bestScore) { bestScore = score; best = finalCalls; }
    if (playerMatches >= 2 && oppMatches >= 2) break;
  }
  return best;
}

// -- Opponent decision logic (NORMAL heuristic, spec §12) ------------------------

function quartettFutureValue(card, remainingCalls) {
  let value = 0;
  remainingCalls.forEach((call) => {
    if (call.primaryType === "rarityHigh") value += quartettRarityIdx(card);
    else if (call.primaryType === "rarityLow") value += (4 - quartettRarityIdx(card));
    else if (call.primaryType === "exactRarity") { if (card.rarity === call.primaryValue) value += 2; }
    else if (quartettCardSatisfies(card, call)) value += 2;
  });
  return value;
}

function quartettCurrentWinPotential(card, call) {
  if (call.primaryType === "rarityHigh") return quartettRarityIdx(card);
  if (call.primaryType === "rarityLow") return 4 - quartettRarityIdx(card);
  if (call.primaryType === "exactRarity") return card.rarity === call.primaryValue ? 1 : 0;
  return quartettCardSatisfies(card, call) ? 1 : 0;
}

// Never inspects the player's hidden selection -- only the current call,
// its own unplayed hand, and the visible remaining calls.
function quartettOpponentChooseCard(match) {
  const call = match.calls[match.currentRound];
  const remaining = match.calls.slice(match.currentRound + 1);
  const unplayedIds = match.opponentHand.filter((id) => !match.opponentPlayed.includes(id));
  const cards = unplayedIds.map(quartettFindCard);

  const isRarityCall = ["rarityHigh", "rarityLow", "exactRarity"].includes(call.primaryType);
  const matching = isRarityCall ? cards : cards.filter((c) => quartettCardSatisfies(c, call));

  if (matching.length > 0) {
    const scored = matching.map((card) => ({
      card,
      score: quartettFutureValue(card, remaining) - quartettCurrentWinPotential(card, call) * 1.5,
    }));
    scored.sort((a, b) => a.score - b.score);
    return scored[0].card.id;
  }
  // No good current answer -- sacrifice the weakest (lowest future value).
  const sacrifice = cards.map((card) => ({ card, future: quartettFutureValue(card, remaining) }));
  sacrifice.sort((a, b) => a.future - b.future);
  return sacrifice[0].card.id;
}

// -- Match lifecycle ------------------------------------------------------------

function startQuartettMatch(opponentId) {
  quartettRefreshSessionWindow();
  if (quartettSessionsRemaining() <= 0) { renderQuartettEntry(); return; }
  const eligible = quartettPlayerEligibleCards();
  if (eligible.length < QUARTETT_HAND_SIZE) { renderQuartettEntry(); return; }
  quartettSelectedOpponentId = opponentId;
  quartettDraftSelection = [];
  renderQuartettPickScreen();
}

function quartettToggleDraftCard(id) {
  const idx = quartettDraftSelection.indexOf(id);
  if (idx >= 0) {
    quartettDraftSelection.splice(idx, 1);
  } else if (quartettDraftSelection.length < QUARTETT_HAND_SIZE) {
    quartettDraftSelection.push(id);
  }
  renderQuartettPickScreen();
}

// Called once the player has tapped exactly QUARTETT_HAND_SIZE cards on the
// picker screen -- this is the actual moment a match (and a monthly
// session) begins.
function quartettConfirmHand() {
  if (quartettDraftSelection.length !== QUARTETT_HAND_SIZE) return;
  quartettRefreshSessionWindow();
  if (quartettSessionsRemaining() <= 0) { renderQuartettEntry(); return; }

  const opponent = QUARTETT_OPPONENTS[quartettSelectedOpponentId];
  if (!opponent) { renderQuartettEntry(); return; }

  quartettSessionsUsedCount += 1; // a session is spent as soon as the match starts

  const playerHandCards = quartettDraftSelection.map(quartettFindCard);
  quartettDraftSelection = [];
  const opponentPool = opponent.pool();
  const opponentHandCards = shuffle(opponentPool.slice()).slice(0, Math.min(5, opponentPool.length));
  const calls = quartettGenerateCalls(playerHandCards, opponentHandCards);

  quartettMatch = {
    opponentId: quartettSelectedOpponentId,
    opponentName: opponent.name,
    matchMode: "casual",
    playerHand: playerHandCards.map((c) => c.id),
    opponentHand: opponentHandCards.map((c) => c.id),
    calls,
    currentRound: 0,
    playerPlayed: [],
    opponentPlayed: [],
    playerRoundWins: 0,
    opponentRoundWins: 0,
    roundHistory: [],
    selectedCardId: null,
    reveal: null,
    rewardCard: null,
    status: "active",
  };
  renderQuartettMatch();
}

function renderQuartettPickScreen() {
  const eligible = quartettPlayerEligibleCards();
  const count = quartettDraftSelection.length;
  const tilesHTML = eligible.map((card) => {
    const selected = quartettDraftSelection.includes(card.id);
    const disabled = !selected && count >= QUARTETT_HAND_SIZE;
    return `
      <div class="quartett-pick-tile ${selected ? "selected" : ""} ${disabled ? "disabled" : ""}"
           onclick="quartettToggleDraftCard(${card.id})">
        ${gcardHTML(card)}
      </div>
    `;
  }).join("");

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="soul-name">Choose Your Hand</div>
      <div class="speech narration-line">Pick ${QUARTETT_HAND_SIZE} cards to bring to the table.</div>
      <div class="quartett-pick-count">${count} / ${QUARTETT_HAND_SIZE} selected</div>
      <div class="quartett-pick-grid">${tilesHTML}</div>
      <button class="primary" ${count === QUARTETT_HAND_SIZE ? "" : "disabled"} onclick="quartettConfirmHand()">Confirm Hand</button>
      <button class="ghost" style="margin-top:10px;" onclick="quartettDraftSelection = []; renderCafe();">Leave</button>
    </div>
  `;
  updateTopBar("", true);
}

function quartettSelectCard(id) {
  if (!quartettMatch) return;
  quartettMatch.selectedCardId = quartettMatch.selectedCardId === id ? null : id;
  renderQuartettMatch();
}

function quartettPlaySelectedCard() {
  const match = quartettMatch;
  if (!match || !match.selectedCardId) return;
  const playerCardId = match.selectedCardId;
  const opponentCardId = quartettOpponentChooseCard(match);
  const call = match.calls[match.currentRound];
  const result = quartettEvaluateRound(call, quartettFindCard(playerCardId), quartettFindCard(opponentCardId));

  match.playerPlayed.push(playerCardId);
  match.opponentPlayed.push(opponentCardId);
  match.selectedCardId = null;
  if (result === "A") match.playerRoundWins += 1;
  else if (result === "B") match.opponentRoundWins += 1;

  match.roundHistory[match.currentRound] = { call, playerCardId, opponentCardId, result };
  match.reveal = { playerCardId, opponentCardId, result };
  renderQuartettReveal();
}

function quartettAdvanceRound() {
  const match = quartettMatch;
  match.reveal = null;
  match.currentRound += 1;
  const done = match.playerRoundWins >= QUARTETT_WIN_TARGET || match.opponentRoundWins >= QUARTETT_WIN_TARGET || match.currentRound >= QUARTETT_ROUNDS;
  if (done) { quartettFinishMatch(); return; }
  renderQuartettMatch();
}

function quartettFinishMatch() {
  const match = quartettMatch;
  if (match.playerRoundWins > match.opponentRoundWins) match.status = "playerWin";
  else if (match.opponentRoundWins > match.playerRoundWins) match.status = "opponentWin";
  else match.status = "draw";

  match.rewardCard = null;
  if (match.status === "playerWin") {
    const unowned = DECK.filter((c) => !unlockedCardIds.has(c.id));
    if (unowned.length > 0) {
      const awarded = unowned[Math.floor(Math.random() * unowned.length)];
      unlockedCardIds.add(awarded.id);
      rebuildLiveDeckFromUnlocked();
      match.rewardCard = awarded;
    }
  }
  renderQuartettResult();
}

function quartettReturnToCafe() { quartettMatch = null; renderCafe(); }

// -- Rendering ------------------------------------------------------------------

function quartettCallStatusClass(match, idx) {
  if (idx < match.currentRound) return "done";
  if (idx === match.currentRound) return "current";
  return "upcoming";
}

function renderQuartettCallsHTML(match) {
  return match.calls.map((call, i) => {
    const status = quartettCallStatusClass(match, i);
    const resolved = match.roundHistory[i];
    const resultTag = resolved ? (resolved.result === "A" ? "YOU" : resolved.result === "B" ? "MAYA" : "DRAW") : "";
    return `
      <div class="quartett-call quartett-call-${status}">
        <span class="quartett-call-num">${i + 1}</span>
        <span class="quartett-call-label">${call.label}</span>
        ${resolved ? `<span class="quartett-call-result">${resultTag}</span>` : ""}
      </div>
    `;
  }).join("");
}

function renderQuartettEntry() {
  quartettRefreshSessionWindow();
  const remaining = quartettSessionsRemaining();
  const eligible = quartettPlayerEligibleCards();
  const canPlay = remaining > 0 && eligible.length >= QUARTETT_HAND_SIZE;
  const statusLine = eligible.length < QUARTETT_HAND_SIZE
    ? "You don't have enough cards in your collection yet."
    : `${remaining} of ${QUARTETT_MAX_SESSIONS_PER_MONTH} hands left this month.`;

  const opponentTilesHTML = Object.keys(QUARTETT_OPPONENTS).map((id) => {
    const opp = QUARTETT_OPPONENTS[id];
    return `
      <div class="quartett-opponent-tile" onclick="startQuartettMatch('${id}')">
        <div class="quartett-opponent-portrait"><img src="${opp.portrait}" alt="${opp.name}"></div>
        <div class="quartett-opponent-name">${opp.name}</div>
      </div>
    `;
  }).join("");

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="soul-name">Quartett — Night Café</div>
      <div class="speech narration-line">${statusLine}</div>
      ${!canPlay && remaining <= 0 ? sceneHTML(QUARTETT_LOCKED_LINE, null) : ""}
      ${canPlay ? `<div class="speech narration-line">Who's at the table tonight?</div><div class="quartett-opponent-grid">${opponentTilesHTML}</div>` : ``}
      <button class="ghost" style="margin-top:10px;" onclick="renderCafe()">Leave</button>
    </div>
  `;
  updateTopBar("", true);
}

function renderQuartettMatch() {
  const match = quartettMatch;
  if (!match) { renderQuartettEntry(); return; }
  if (match.reveal) { renderQuartettReveal(); return; }

  const unplayedHand = match.playerHand.filter((id) => !match.playerPlayed.includes(id));
  const handHTML = unplayedHand.map((id) => {
    const card = quartettFindCard(id);
    const selected = match.selectedCardId === id;
    return `<div class="quartett-hand-tile ${selected ? "selected" : ""}" onclick="quartettSelectCard(${id})">${gcardHTML(card)}</div>`;
  }).join("");

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="soul-name">Quartett vs. ${match.opponentName}</div>
      <div class="quartett-score">YOU ${match.playerRoundWins} — ${match.opponentRoundWins} ${match.opponentName.toUpperCase()}</div>
      <div class="quartett-calls">${renderQuartettCallsHTML(match)}</div>
      <div class="speech narration-line">${match.opponentName}'s hand: ${match.opponentHand.length - match.opponentPlayed.length} cards left, face down.</div>
      <div class="quartett-hand-row">${handHTML}</div>
      <button class="primary" ${match.selectedCardId ? "" : "disabled"} onclick="quartettPlaySelectedCard()">Play Card</button>
    </div>
  `;
  updateTopBar("", true);
}

function renderQuartettReveal() {
  const match = quartettMatch;
  const opponentLines = QUARTETT_OPPONENTS[match.opponentId].lines;
  const reveal = match.reveal;
  const call = match.calls[match.currentRound];
  const resultText = reveal.result === "A" ? "YOU WIN THE ROUND" : reveal.result === "B" ? `${match.opponentName.toUpperCase()} WINS THE ROUND` : "DRAW";
  const reactionLine = reveal.result === "A" ? quartettPickLine(opponentLines.roundPlayerWins)
    : reveal.result === "B" ? quartettPickLine(opponentLines.roundOpponentWins)
    : quartettPickLine(opponentLines.roundDraw);
  const matchOver = match.playerRoundWins >= QUARTETT_WIN_TARGET || match.opponentRoundWins >= QUARTETT_WIN_TARGET || match.currentRound >= QUARTETT_ROUNDS - 1;

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="soul-name">Round ${match.currentRound + 1}: ${call.label}</div>
      <div class="quartett-reveal-row">
        <div class="quartett-reveal-card">${gcardHTML(quartettFindCard(reveal.playerCardId))}<div class="quartett-reveal-tag">YOU</div></div>
        <div class="quartett-reveal-card">${gcardHTML(quartettFindCard(reveal.opponentCardId))}<div class="quartett-reveal-tag">${match.opponentName.toUpperCase()}</div></div>
      </div>
      <div class="speech" style="text-align:center; font-weight:600;">${resultText}</div>
      <div class="speech narration-line">${match.opponentName.toUpperCase()}: "${reactionLine}"</div>
      <div class="quartett-score">YOU ${match.playerRoundWins} — ${match.opponentRoundWins} ${match.opponentName.toUpperCase()}</div>
      <button class="primary" onclick="quartettAdvanceRound()">${matchOver ? "See Result" : "Next Round"}</button>
    </div>
  `;
  updateTopBar("", true);
}

function renderQuartettResult() {
  const match = quartettMatch;
  const opponentLines = QUARTETT_OPPONENTS[match.opponentId].lines;
  const remaining = quartettSessionsRemaining();
  let headline, lines;
  if (match.status === "playerWin") { headline = "YOU WIN"; lines = quartettPickLine(opponentLines.matchPlayerWin); }
  else if (match.status === "opponentWin") { headline = `${match.opponentName.toUpperCase()} WINS`; lines = quartettPickLine(opponentLines.matchPlayerLoss); }
  else { headline = "DRAW"; lines = quartettPickLine(opponentLines.matchDraw); }

  const rewardHTML = match.rewardCard
    ? `<div class="speech narration-line">New card: <b>${match.rewardCard.name}</b></div><div class="shop-mystery-card">${gcardHTML(match.rewardCard)}</div>`
    : (match.status === "playerWin" ? `<div class="speech narration-line">She has nothing left you don't already own.</div>` : "");

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="soul-name">${headline}</div>
      ${sceneHTML(lines, null)}
      <div class="quartett-score">YOU ${match.playerRoundWins} — ${match.opponentRoundWins} ${match.opponentName.toUpperCase()}</div>
      ${rewardHTML}
      <div class="speech narration-line">${remaining} of ${QUARTETT_MAX_SESSIONS_PER_MONTH} hands left this month.</div>
      ${remaining > 0 ? `<button class="primary" onclick="startQuartettMatch('${match.opponentId}')">Play Again</button>` : ``}
      <button class="ghost" style="margin-top:10px;" onclick="quartettReturnToCafe()">Return to Café</button>
    </div>
  `;
  updateTopBar("", true);
}

// Shared "repeat pool with an occasional once-per-year rare bonus" mechanic,
// used by the Café Attic, Glass House, and Royal Garden repeat events. This
// was previously three separately hand-written copies of the same shape --
// which is exactly why the same "forgets to cap itself once nothing's left
// to award" bug had to be fixed in all three places instead of one. Each
// caller supplies its own pool, its own selection strategy (so each
// location's exact original random-number behavior is preserved), its own
// once-per-year state accessors, its own reward eligibility filter, and its
// own two renderers -- so each location keeps its own look and any extra
// buttons (e.g. Glass House's Cultivate button).
function pickUniform(pool) { return pool[Math.floor(Math.random() * pool.length)]; }
function pickWeighted(pool) {
  const totalWeight = pool.reduce((sum, e) => sum + e.weight, 0);
  let roll = Math.random() * totalWeight;
  let chosen = pool[0];
  for (const e of pool) { roll -= e.weight; if (roll <= 0) { chosen = e; break; } }
  return chosen;
}
function resolveRepeatPoolVisit({ pool, pickFn, bonusId, getBonusLastYear, setBonusLastYear, eligibleCards, renderPlain, renderReward }) {
  const canOfferBonus = getBonusLastYear() !== currentYear;
  const activePool = canOfferBonus ? pool : pool.filter((e) => e.id !== bonusId);
  const chosen = pickFn(activePool);

  if (chosen.id === bonusId) {
    // Set eagerly, win or lose -- see the once-per-year edge-case fix.
    setBonusLastYear(currentYear);
    const owned = new Set(unlockedCardIds);
    const eligible = eligibleCards().filter((c) => !owned.has(c.id));
    if (eligible.length > 0) {
      const awarded = eligible[Math.floor(Math.random() * eligible.length)];
      unlockedCardIds.add(awarded.id);
      rebuildLiveDeckFromUnlocked();
      renderReward(chosen, awarded);
      return;
    }
  }
  renderPlain(chosen);
}

function atticRepeatVisit() {
  resolveRepeatPoolVisit({
    pool: ATTIC_REPEAT_POOL,
    pickFn: pickUniform,
    bonusId: "lostproperty",
    getBonusLastYear: () => atticLostPropertyLastYear,
    setBonusLastYear: (y) => { atticLostPropertyLastYear = y; },

    { eligible: octaviaSacrificeEligible, run: () => renderGardenScene(OCT_SACRIFICE_INTRO_LINES, "Continue", "renderOctaviaSacrificePicker()") },

}

// Purely a flavor check-in -- how far along the buried card is, roughly
// speaking, and a "Water it" action that doesn't change the harvest date
// (always exactly a year) but gives the player something to do while they
// wait, per direct request.
function cultivationMonthsElapsed() {
  if (glassHouseCultivationPlantedYear === null) return 0;
  return (currentYear - glassHouseCultivationPlantedYear) * 12 + (currentMonthIndex() - glassHouseCultivationPlantedMonth);
}
function cultivationStatusText() {
  const elapsed = cultivationMonthsElapsed();
  if (elapsed < 3) return "Just beneath the soil. Nothing to see yet.";
  if (elapsed < 6) return "A thin green shoot has broken the surface.";
  if (elapsed < 9) return "Something is definitely growing, though it's too early to say what.";
  return "Whatever this is, it looks nearly ready.";
}
function renderCultivationStatus() {
  const plantedMonthName = glassHouseCultivationPlantedMonth !== null ? MONTHS[glassHouseCultivationPlantedMonth] : "";
  const wateredThisVisit = glassHouseCultivationLastWateredYearMonth === yearMonthKey();
  stage.innerHTML = `

      <div class="portrait no-image" style="background:#1f2b22;">🪟</div>

      <div class="speech narration-line">${cultivationStatusText()}</div>
      <p style="color:var(--muted); font-size:12.5px;">It takes a full year. Planted in ${plantedMonthName} -- ready again around ${plantedMonthName} next year.</p>
      <button class="ghost" ${wateredThisVisit ? "disabled" : ""} onclick="waterCultivation()">${wateredThisVisit ? "Already watered today" : "Water it"}</button>
      <button class="primary" style="margin-top:10px;" onclick="renderMap()">Leave</button>
    </div>
  `;
  updateTopBar("", true);
}
function waterCultivation() {
  glassHouseCultivationLastWateredYearMonth = yearMonthKey();
  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="portrait no-image" style="background:#1f2b22;">🪟</div>
      <div class="soul-name">Glass House</div>

    </div>
  `;
  updateTopBar("", true);
}

// Reward pool bias per spec §4.7 -- checked in this exact order, using the
// first non-empty applicable pool; the last entry is the universal fallback.
function harvestGlassHouseCultivation() {
  const src = glassHouseCultivationSourceAttributes || {};
  const owned = new Set(unlockedCardIds);
  const candidatePools = [];
  if (src.color === "Black") candidatePools.push(DECK.filter((c) => !owned.has(c.id) && (c.style === "Daring" || c.style === "Cool")));
  if (src.color === "Silver") candidatePools.push(DECK.filter((c) => !owned.has(c.id) && (c.style === "Armour" || c.style === "Elegant")));
  if (src.style === "Romantic") candidatePools.push(DECK.filter((c) => !owned.has(c.id) && c.category === "Accessory" && c.style === "Romantic"));
  if (["Rare", "Iconic", "Legendary"].includes(src.rarity)) candidatePools.push(DECK.filter((c) => !owned.has(c.id) && ["Rare", "Iconic", "Legendary"].includes(c.rarity)));
  candidatePools.push(DECK.filter((c) => !owned.has(c.id) && ["Uncommon", "Rare", "Iconic", "Legendary"].includes(c.rarity)));

  const pool = candidatePools.find((p) => p.length > 0) || [];
  glassHouseCultivationPending = false;
  glassHouseCultivationLastHarvestYear = currentYear;
  glassHouseCultivationPlantedYear = null;
  glassHouseCultivationPlantedMonth = null;
  glassHouseCultivationLastWateredYearMonth = null;

  if (pool.length === 0) {
    renderGlassHouseScene([{ who: "NARRATION", t: "Nothing came up this year." }], "Leave", "renderMap()");
    return;
  }
  const awarded = pool[Math.floor(Math.random() * pool.length)];
  unlockedCardIds.add(awarded.id);
  rebuildLiveDeckFromUnlocked();
  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="speech narration-line">Something has grown where you left the card.</div>
      <div class="speech" style="background:rgba(255,255,255,0.06);"><b style="display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px;">Octavia</b>See?</div>
      <div class="shop-mystery-card" style="margin-top:10px;">${gcardHTML(awarded)}</div>
      <button class="primary" style="margin-top:18px;" onclick="renderMap()">Continue</button>
    </div>
  `;
  updateTopBar("", true);
}

function markSeasonalReactionSeen(characterId, eventId) {

  if (!seasonalReactionSeen[characterId][currentYear]) seasonalReactionSeen[characterId][currentYear] = {};

function seasonalReactionAlreadySeen(characterId, eventId) {

function getFestivalReactionFor(characterId, metFlag) {

// Small shared dispatcher used by every location's resolver: walks a list of
// {eligible, run} entries IN ORDER and executes the first one whose
// eligible() returns true, then stops -- exactly matching the short-circuit
// behavior of the if/return chain this replaces. The array order IS the
// priority order; nothing else determines it, so the whole priority list is
// readable top to bottom in one place instead of buried in nested ifs.
function runFirstEligibleEvent(events) {
  for (const event of events) {

  }
}

// The nav is a persistent fixed element in the page shell (see #topBar),
// not re-rendered per screen, so it can never jump between layouts.
function topNavHTML() { return ""; }

function unansweredQuestions(key) {
  const profile = soulProfiles[key];
  return (QUESTIONS[key] || []).filter((q) => !profile.answered.includes(q.id));
}

// The active brief's hard requirements as pill tags — "Your call" for a
// player-choice (trust) job, which has no want array at all.
function wantTagsHTML(brief) {
  if (brief.playerChoice) return `<span class="want-tag">Your call — style from what you know</span>`;
  return brief.want.map((r) => `<span class="want-tag">${r.label}</span>`).join("");
}

// Shared renderer for a single line of dialogue, used by briefs, the
// CLIENT_STAGES progressive Studio exchanges, and every secondary-character
// scene (Helena, Juliette, Maya, Octavia, Valery, etc.). "NARRATION" is not
// a speaker — it renders as unlabeled italic scene text (e.g. "Juniper
// smiles.") instead of a speech bubble, matching how the source documents
// distinguish spoken lines from stage direction.
//
// speakerName is an override for the label on every non-YOU line (used by
// single-character screens like the Studio, where every non-YOU line is
// that one client). Pass null/undefined for multi-speaker scenes (e.g.
// Night Castle, where a scene mixes HELENA, JULIETTE and NARRATION lines)
// so each line is labeled from its own `who` instead.
function dialogueLineHTML(line, speakerName) {
  if (line.who === "NARRATION") {
    return `<div class="speech narration-line">${line.t}</div>`;
  }
  const isYou = line.who === "YOU";
  const speakerLabel = isYou ? "You" : (speakerName || properCase(line.who));
  return `
    <div class="speech" style="${isYou ? "background:rgba(255,255,255,0.06);" : ""}">
      <b style="display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px;">${speakerLabel}</b>
      ${line.t}
    </div>
  `;
}

function properCase(s) {
  return s.charAt(0) + s.slice(1).toLowerCase();
}

// Renders a brief's dialogue array as a stack of speech bubbles, reusing the
// exact look of the CLIENT_STAGES exchange above (speaker label + line) so
// a multi-line brief reads the same as any other back-and-forth in the game.
function briefDialogueHTML(brief, speakerName) {
  return brief.dialogue.map((line) => dialogueLineHTML(line, speakerName)).join("");
}

// Renders a whole scene (array of {who,t} lines, NARRATION included) as a
// static stack — used for secondary-character one-shot scenes that don't
// need the one-line-at-a-time stepping that CLIENT_STAGES uses.
function sceneHTML(lines, speakerName) {
  return lines.map((line) => dialogueLineHTML(line, speakerName)).join("");
}

// Secondary-character portraits (Helena, Juliette, Maya, Octavia, Valery),
// hosted the same way as the Core Four's -- portrait_<name>.png in the same
// GitHub Pages portraits/ folder. Scenes at these locations often involve
// more than one named character at once (Helena and Juliette are almost
// always together at the Castle gate), so rather than have every single
// call site specify who's present, inferPortraitKeys() scans the scene's
// own dialogue lines and shows whichever of these five actually speak in
// it -- narration-only scenes correctly fall back to the location glyph.



function inferPortraitKeys(lines) {
  const present = new Set();
  (lines || []).forEach((l) => {
    const who = (l.who || "").toLowerCase();
    if (SECONDARY_PORTRAITS[who]) present.add(who);
    // Narration often introduces a present-but-not-yet-speaking character by
    // name (e.g. "She's Juliette." / "Juliette does not react.") -- catch
    // those too, so she isn't left out of a scene she's clearly standing in.
    // Scoped to narration only: a YOU/other-character line just mentioning
    // someone in passing (e.g. "Maya said...") shouldn't pull in a portrait
    // for someone who isn't actually there.
    if (who === "narration") {
      const text = (l.t || "").toLowerCase();
      SECONDARY_PORTRAIT_ORDER.forEach((k) => { if (text.includes(k)) present.add(k); });
    }
  });
  return SECONDARY_PORTRAIT_ORDER.filter((k) => present.has(k));
}

// Renders one portrait per named character actually speaking in `lines`
// (side by side if more than one), or the location's fallback glyph if
// nobody named is present (e.g. a pure-narration or not-yet-met scene).
function portraitHTML(lines, fallbackEmoji, fallbackBg) {
  const keys = inferPortraitKeys(lines);
  if (keys.length === 0) {
    return `<div class="portrait no-image" style="background:${fallbackBg};">${fallbackEmoji}</div>`;
  }
  const rowClass = keys.length > 1 ? "portrait-row portrait-row-multi" : "portrait-row";
  return `<div class="${rowClass}">${keys.map((k) => `<div class="portrait"><img src="${SECONDARY_PORTRAITS[k]}" alt="${k}"></div>`).join("")}</div>`;
}

function renderSoul() {
  const client = currentClient();
  const key = currentClientKey();
  const rel = relationships[key] || 0;

  const wantTags = wantTagsHTML(currentBrief);
  const returningNote = rel > 0 ? `<div class="returning-note">You've styled ${client.name.split(",")[0]} before.</div>` : "";

  const stageSet = CLIENT_STAGES[key];

  let body;
  if (stageSet && soulStep === 0) {
    // A real, numbered exchange from the bible — one new stage per visit,
    // stepped through one line at a time like an actual back-and-forth.
    const profile = soulProfiles[key];
    const stageIndex = Math.min(profile.visits - 1, stageSet.length - 1);
    const stage = stageSet[stageIndex] || FALLBACK_STAGE;
    const line = stage[dialogueLineIndex];
    body = `
      ${dialogueLineHTML(line, client.name.split(",")[0])}
      <button class="primary" onclick="advanceDialogueLine()">…</button>
    `;
  } else if (soulStep === 0) {
    body = `<div class="speech">${client.greeting}</div><button class="primary" onclick="advanceSoul()">…</button>`;
  } else if (soulStep === 1) {
    const available = unansweredQuestions(key);
    const chips = available.map((q) => `<button class="ghost question-chip" onclick="askQuestion('${q.id}')">${q.prompt}</button>`).join("");
    body = `
      <div class="speech">\u201CAnything you'd like to ask before we start?\u201D</div>
      <div class="question-list">${chips}</div>
      <button class="primary" onclick="skipQuestion()">Let's just get started</button>
    `;
  } else if (soulStep === 2) {
    body = `
      <div class="asked-question">${pendingQuestion.prompt}</div>
      <div class="speech">${pendingQuestion.answer}</div>
      <button class="primary" onclick="proceedToBrief()">Continue</button>
    `;
  } else {
    const briefBody = briefDialogueHTML(currentBrief, client.name.split(",")[0]);
    const softDirectionHTML = currentBrief.softDirection
      ? `<div class="soft-direction">${currentBrief.softDirection}</div>`
      : "";
    body = `${briefBody}<div class="want-tags">${wantTags}</div>${softDirectionHTML}<button class="primary" onclick="renderStyle()">Start styling</button>`;
  }

  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="portrait ${client.portrait ? "" : "no-image"}" style="${client.portrait ? "" : `background:${client.color};`}">${client.portrait ? `<img src="${client.portrait}" alt="${client.name}">` : ""}</div>
      <div class="soul-name">${client.name}</div>
      <div class="soul-hearts hearts">${heartsHTML(rel)}</div>
      ${returningNote}
      ${body}
    </div>
  `;
  updateTopBar("", true);
}

function advanceDialogueLine() {
  const key = currentClientKey();
  const stageSet = CLIENT_STAGES[key];
  const profile = soulProfiles[key];
  const stageIndex = Math.min(profile.visits - 1, stageSet.length - 1);
  const stage = stageSet[stageIndex] || FALLBACK_STAGE;
  dialogueLineIndex += 1;
  if (dialogueLineIndex >= stage.length) {
    soulStep = 3; // dialogue finished — move on to the brief
  }
  renderSoul();
}

function advanceSoul() {
  const key = currentClientKey();
  const available = unansweredQuestions(key);
  soulStep = (!roundIsFirstMeeting && available.length > 0) ? 1 : 3;
  renderSoul();
}

function skipQuestion() { soulStep = 3; renderSoul(); }

function askQuestion(qid) {
  const key = currentClientKey();
  const q = QUESTIONS[key].find((q) => q.id === qid);
  const profile = soulProfiles[key];
  profile.answered.push(qid);
  profile.facts.push({ q: q.prompt, a: q.answer });
  pendingQuestion = q;
  soulStep = 2;
  renderSoul();
}

function proceedToBrief() { soulStep = 3; renderSoul(); }

function cardArtHTML(card) {
  const art = CARD_ART[card.id] || PLACEHOLDER_ART;
  return `<img src="${art}" alt="${card.name}">`;
}

// Real vector card art is fetched once per URL and cached in memory, then
// injected as live DOM content (never as an <img> or background-image) —
// that's specifically what lets it inherit the page's Poppins font instead
// of silently falling back to a default font, the way a rasterized image
// or CSS background-image never could.
const svgArtCache = {};
const svgArtLoading = {};

function ensureSvgArtLoaded(url) {
  if (svgArtCache[url] || svgArtLoading[url]) return;
  svgArtLoading[url] = true;
  fetch(url)
    .then((r) => r.text())
    .then((svg) => {
      svgArtCache[url] = svg;
      delete svgArtLoading[url];
      document.querySelectorAll(`.art-fill[data-src="${CSS.escape(url)}"]`).forEach((el) => {
        if (!el.innerHTML) el.innerHTML = svg;
      });
    })
    .catch(() => { delete svgArtLoading[url]; });
}

function gcardHTML(card) {
  if (card.type === "KEY") {
    // No real key art yet — plain glyph per Items/Keys spec §19.2. Swap in a
    // fullArt SVG later; nothing else about this branch needs to change.
    return `
      <div class="gcard">
        <div class="gcard-inner">
          <div class="gpill">KEY</div>
          <div class="gname">${card.name}</div>
          <div class="gart"><div class="key-card-glyph">🗝</div></div>
          <div class="gattrs"><span>QUEST ITEM</span><span>CANNOT WEAR</span></div>
        </div>
      </div>
    `;
  }
  if (card.fullArt) {
    const cached = svgArtCache[card.fullArt] || "";
    ensureSvgArtLoaded(card.fullArt);
    return `<div class="gcard gcard-full"><div class="art-fill" data-src="${card.fullArt}" role="img" aria-label="${card.name}">${cached}</div></div>`;
  }
  return `
    <div class="gcard">
      <div class="gcard-inner">
        <div class="gpill">${card.category}</div>
        <div class="gname">${card.name}</div>
        <div class="gart">${cardArtHTML(card)}</div>
        <div class="gattrs"><span>${card.fit}</span><span>${card.style}</span><span>${card.color}</span></div>
      </div>
    </div>
  `;
}

function fanTransform(i, n) {
  const step = n <= 1 ? 0 : Math.min(22, 108 / (n - 1));
  const angle = (i - (n - 1) / 2) * step;
  const rad = (angle * Math.PI) / 180;
  const radius = 345;
  const x = Math.sin(rad) * radius * 0.78;
  const y = (1 - Math.cos(rad)) * 40;
  return `translateX(${x.toFixed(1)}px) translateY(${y.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
}

// Redraw: swap out your current (unplaced) hand for a fresh one, capped at
// the highest rarity you already had in hand -- so it fixes a bad draw
// without becoming a free way to fish for something better. One fewer card
// than you started with, once per client visit, never touches placed cards.
function redrawHand() {
  if (!redrawAvailable || hand.length === 0) return;

  // Key Cards stay stuck in hand through a redraw (Items/Keys spec §2.3) --
  // only the wearable portion of the hand is eligible to be discarded/redrawn,
  // and keys never factor into the rarity cap below.
  const keyIdSet = new Set(KEY_CARDS.map((k) => k.id));
  const keysInHand = hand.filter((id) => keyIdSet.has(id));
  const oldWearableHand = hand.filter((id) => !keyIdSet.has(id));
  if (oldWearableHand.length === 0) { redrawAvailable = false; renderStyle(); return; }

  const maxRarityIdx = Math.max(...oldWearableHand.map((id) => RARITY_ORDER[findCard(id).rarity] ?? 0));
  const allowedRarities = Object.keys(RARITY_ORDER).filter((r) => RARITY_ORDER[r] <= maxRarityIdx);

  const newCount = Math.max(0, oldWearableHand.length - 1);

  // Cards already placed in an outfit slot must be excluded too, not just
  // the current hand -- otherwise a redraw can hand you a second copy of
  // whatever you already committed to a slot, which is exactly how a
  // placed Denim Jacket or Cropped Pullover could turn up duplicated.
  const placedIds = outfit.filter(Boolean).map((c) => c.id);
  const unavailable = new Set([...hand, ...placedIds]);

  const jokerIds = new Set(JOKER_CARDS.map((c) => c.id));
  const pool = liveDeck.filter((c) => !jokerIds.has(c.id) && !keyIdSet.has(c.id) && !unavailable.has(c.id) && allowedRarities.includes(c.rarity)).map((c) => c.id);
  const newWearables = drawBalancedHand(pool, newCount);

  // deckPile and hand must stay mutually exclusive at all times -- the newly
  // drawn cards have to come OUT of deckPile, or a later Joker draw could
  // pull one of these same cards straight back out as a second copy.
  deckPile = deckPile.filter((id) => !newWearables.includes(id));
  discardPile.push(...oldWearableHand);
  hand = [...keysInHand, ...newWearables];
  redrawAvailable = false;
  renderStyle();
}

function drawJoker() {
  if (jokerUsesRemaining <= 0 || deckPile.length === 0) return;
  const extra = shuffle(deckPile).slice(0, Math.min(2, deckPile.length));
  deckPile = deckPile.filter((id) => !extra.includes(id));
  hand = hand.concat(extra);
  jokerUsesRemaining -= 1;
  renderStyle();
}

function renderStyle() {
  const client = currentClient();
  const monthName = MONTHS[currentMonthIndex()];
  const wantSummary = currentBrief.playerChoice
    ? "Your call"
    : currentBrief.want.map((r) => r.label).join(", ");

  const slotsHTML = outfit.map((card, i) => {
    if (card) return `<div class="board-slot filled ${card.fullArt ? "filled-plain" : ""} slot-${i}" onpointerdown="onSlotPointerDown(event, ${i})">${gcardHTML(card)}</div>`;
    return `<div class="board-slot empty slot-${i}"><span class="plus">+</span></div>`;
  }).join("");

  const n = hand.length;
  const fanHTML = n === 0
    ? `<div class="empty-hand">No cards left in hand this round.</div>`
    : hand.map((id, i) => {
        const card = findCard(id);
        const selected = id === selectedHandId;
        return `
          <div class="fan-card-wrap ${selected ? "selected" : ""}" id="fan-${id}"
               style="transform:${fanTransform(i, n)}; z-index:${selected ? 900 : 100 - Math.abs(i - (n - 1) / 2)};"
               onpointerdown="onCardPointerDown(event, ${id})">
            ${gcardHTML(card)}
          </div>
        `;
      }).join("");

  stage.innerHTML = `
    <div class="outfit-board" id="outfitBoard">${slotsHTML}</div>

    <div class="hand-hint"></div>
    <div class="hand-fan" id="handFan">${fanHTML}</div>

    <div class="corner-action corner-left ${jokerUsesRemaining > 0 && deckPile.length > 0 ? "" : "used"}" onclick="drawJoker()" title="Joker: draw 2 extra cards, once per client${ownedJokerCount > 0 ? ` (uses left this visit: ${jokerUsesRemaining})` : ""}">🃏${ownedJokerCount > 0 ? `<span class="joker-count">${jokerUsesRemaining}</span>` : ""}</div>
    <div class="corner-action corner-left corner-left-2 ${redrawAvailable && hand.length > 0 ? "" : "used"}" onclick="redrawHand()" title="Redraw: swap your hand for new cards of the same rarity or lower, once per client">🔄</div>
    <button class="corner-action corner-right" id="continueBtn" onclick="${specialJob ? "finishSpecialStyling()" : "finishStyling()"}" title="See their reaction">✓</button>
  `;
  updateTopBar(`<span class="icon soul-swatch" style="background:${client.color};"></span> Wants: <b>${wantSummary}</b>`, true);
  document.body.classList.add("no-scroll"); // drag-and-drop during styling needs a fixed viewport
}

/* ---------------- SLOT RULES ---------------- */

// A Dress covers both "Top" and "Bottom" ground, so it conflicts with either;
// otherwise it's simply one card per category, full stop.
function categoryClashes(card, excludeIndex) {
  return outfit.some((c, i) => {
    if (!c || i === excludeIndex) return false;
    if (c.category === card.category) return true;
    if (card.category === "Dress" && (c.category === "Top" || c.category === "Bottom")) return true;
    if (c.category === "Dress" && (card.category === "Top" || card.category === "Bottom")) return true;
    return false;
  });
}

function slotCenters() {
  return [0, 1, 2, 3].map((i) => {
    const el = document.querySelector(`.slot-${i}`);
    const r = el.getBoundingClientRect();
    return { i, cx: r.left + r.width / 2, cy: r.top + r.height / 2, r };
  });
}

function nearestSlot(x, y) {
  const centers = slotCenters();
  let best = null;
  let bestDist = Infinity;
  for (const c of centers) {
    const pad = 40;
    const within = x >= c.r.left - pad && x <= c.r.right + pad && y >= c.r.top - pad && y <= c.r.bottom + pad;
    const d = Math.hypot(x - c.cx, y - c.cy);
    if (within && d < bestDist) { bestDist = d; best = c.i; }
  }
  return best;
}

function firstEmptySlot() {
  const idx = outfit.findIndex((c) => c === null);
  return idx === -1 ? null : idx;
}

/* ---------------- DRAG + PLACE ---------------- */

function placeCardInSlot(id, slotIndex) {
  const card = findCard(id);
  if (slotIndex === null) { renderStyle(); return; } // no valid target — snap back

  if (categoryClashes(card, slotIndex)) {
    renderStyle();
    flashHint(`Already have a ${card.category.toLowerCase()} in this outfit`);
    return;
  }

  if (outfit[slotIndex]) hand.push(outfit[slotIndex].id); // swap out, back to hand — never lost
  outfit[slotIndex] = card;
  hand = hand.filter((hid) => hid !== id);
  selectedHandId = null;
  renderStyle();
}

function returnCardToHand(slotIndex) {
  const card = outfit[slotIndex];
  if (!card) return;
  outfit[slotIndex] = null;
  hand.push(card.id);
  renderStyle();
}

function onSlotPointerDown(ev, slotIndex) {
  ev.preventDefault();
  ev.stopPropagation();
  const el = document.querySelector(`.slot-${slotIndex}`);
  if (!el) return;
  const rect = el.getBoundingClientRect();

  slotDragState = {
    slotIndex, moved: false,
    startX: ev.clientX, startY: ev.clientY,
    centerX: rect.left + rect.width / 2, centerY: rect.top + rect.height / 2,
    width: el.offsetWidth, height: el.offsetHeight,
  };

  el.setPointerCapture(ev.pointerId);
  el.addEventListener("pointermove", onSlotPointerMove);
  el.addEventListener("pointerup", onSlotPointerUp);
}

function onSlotPointerMove(ev) {
  if (!slotDragState) return;
  const el = document.querySelector(`.slot-${slotDragState.slotIndex}`);
  if (!el) return;
  const dx = ev.clientX - slotDragState.startX;
  const dy = ev.clientY - slotDragState.startY;

  if (!slotDragState.moved && Math.hypot(dx, dy) > 8) {
    slotDragState.moved = true;
    el.style.position = "fixed";
    el.style.zIndex = "3000";
    el.style.margin = "0";
    el.style.width = slotDragState.width + "px";
    el.style.height = slotDragState.height + "px";
    el.style.left = (slotDragState.centerX - slotDragState.width / 2) + "px";
    el.style.top = (slotDragState.centerY - slotDragState.height / 2) + "px";
  }

  if (slotDragState.moved) {
    el.style.left = (slotDragState.centerX - slotDragState.width / 2 + dx) + "px";
    el.style.top = (slotDragState.centerY - slotDragState.height / 2 + dy) + "px";

    const target = nearestSlot(ev.clientX, ev.clientY);
    document.querySelectorAll(".board-slot").forEach((e) => e.classList.remove("target-hover"));
    if (target !== null && target !== slotDragState.slotIndex) {
      const t = document.querySelector(`.slot-${target}`);
      if (t) t.classList.add("target-hover");
    }
  }
}

function onSlotPointerUp(ev) {
  if (!slotDragState) return;
  const { slotIndex, moved } = slotDragState;
  const el = document.querySelector(`.slot-${slotIndex}`);
  if (el) {
    el.releasePointerCapture(ev.pointerId);
    el.removeEventListener("pointermove", onSlotPointerMove);
    el.removeEventListener("pointerup", onSlotPointerUp);
  }
  document.querySelectorAll(".board-slot").forEach((e) => e.classList.remove("target-hover"));
  slotDragState = null;

  if (!moved) {
    returnCardToHand(slotIndex);
    return;
  }

  const target = nearestSlot(ev.clientX, ev.clientY);
  if (target === null || target === slotIndex) {
    renderStyle(); // snap back to its own slot
    return;
  }

  // Swapping two already-worn cards' positions can never create a new
  // category clash — the same set of pieces stays worn either way.
  const tmp = outfit[target];
  outfit[target] = outfit[slotIndex];
  outfit[slotIndex] = tmp;
  renderStyle();
}

function flashHint(msg) {
  const hint = document.querySelector(".hand-hint");
  if (!hint) return;
  const original = hint.textContent;
  hint.textContent = msg;
  hint.style.color = "var(--pink)";
  setTimeout(() => { hint.textContent = original; hint.style.color = ""; }, 1400);
}

let longPressTimer = null;
let longPressFired = false;

function onCardPointerDown(ev, id) {
  ev.preventDefault();
  const wrap = document.getElementById(`fan-${id}`);
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();

  dragState = {
    id, moved: false,
    startX: ev.clientX, startY: ev.clientY,
    centerX: rect.left + rect.width / 2, centerY: rect.top + rect.height / 2,
    width: wrap.offsetWidth, height: wrap.offsetHeight,
  };

  longPressFired = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    if (!dragState || dragState.moved) return; // a real drag is happening, not a long-press
    longPressFired = true;
    const heldId = dragState.id;
    wrap.releasePointerCapture(ev.pointerId);
    wrap.removeEventListener("pointermove", onCardPointerMove);
    wrap.removeEventListener("pointerup", onCardPointerUp);
    dragState = null;
    jokerPicking = null;
    openCardDetail(heldId);
  }, 480);

  wrap.setPointerCapture(ev.pointerId);
  wrap.addEventListener("pointermove", onCardPointerMove);
  wrap.addEventListener("pointerup", onCardPointerUp);
}

function onCardPointerMove(ev) {
  if (!dragState) return;
  const wrap = document.getElementById(`fan-${dragState.id}`);
  if (!wrap) return;
  const dx = ev.clientX - dragState.startX;
  const dy = ev.clientY - dragState.startY;

  if (!dragState.moved && Math.hypot(dx, dy) > 8) {
    dragState.moved = true;
    clearTimeout(longPressTimer); // a real drag started — cancel the long-press
    wrap.classList.add("dragging");
    wrap.style.position = "fixed";
    wrap.style.bottom = "auto";
    wrap.style.right = "auto";
    wrap.style.margin = "0";
    wrap.style.width = dragState.width + "px";
    wrap.style.height = dragState.height + "px";
    wrap.style.left = (dragState.centerX - dragState.width / 2) + "px";
    wrap.style.top = (dragState.centerY - dragState.height / 2) + "px";
    wrap.style.transform = "none"; // upright while dragging, not rotated
  }

  if (dragState.moved) {
    wrap.style.left = (dragState.centerX - dragState.width / 2 + dx) + "px";
    wrap.style.top = (dragState.centerY - dragState.height / 2 + dy) + "px";

    const target = nearestSlot(ev.clientX, ev.clientY);
    document.querySelectorAll(".board-slot").forEach((el) => el.classList.remove("target-hover"));
    if (target !== null) {
      const el = document.querySelector(`.slot-${target}`);
      if (el) el.classList.add("target-hover");
    }
  }
}

function onCardPointerUp(ev) {
  clearTimeout(longPressTimer);
  if (longPressFired) { longPressFired = false; return; } // already handled as a long-press
  if (!dragState) return;
  const { id, moved } = dragState;
  const wrap = document.getElementById(`fan-${id}`);
  if (wrap) {
    wrap.releasePointerCapture(ev.pointerId);
    wrap.removeEventListener("pointermove", onCardPointerMove);
    wrap.removeEventListener("pointerup", onCardPointerUp);
  }

  document.querySelectorAll(".board-slot").forEach((el) => el.classList.remove("target-hover"));
  dragState = null;

  const card = findCard(id);
  if (card.category === "Joker") {
    renderStyle(); // snap the joker card back into the fan first
    useJokerCard(id);
    return;
  }

  if (!moved) {
    // plain tap: just lift it forward, never places automatically
    selectedHandId = selectedHandId === id ? null : id;
    renderStyle();
  } else {
    const target = nearestSlot(ev.clientX, ev.clientY);
    placeCardInSlot(id, target);
  }
}

function sortedLiveDeck() {
  const arr = [...liveDeck];
  if (deckSortMode === "rarity") {
    arr.sort((a, b) => (RARITY_ORDER[a.rarity] ?? 0) - (RARITY_ORDER[b.rarity] ?? 0));
  } else if (deckSortMode === "style") {
    arr.sort((a, b) => (a.style || "").localeCompare(b.style || ""));
  } else if (deckSortMode === "category") {
    arr.sort((a, b) => (a.category || "").localeCompare(b.category || ""));
  }
  return arr;
}

function filteredDeck() {
  return sortedLiveDeck().filter((card) => {
    if (deckFilters.category.size > 0 && !deckFilters.category.has(card.category)) return false;
    if (deckFilters.rarity.size > 0 && !deckFilters.rarity.has(card.rarity)) return false;
    if (deckFilters.style.size > 0 && !deckFilters.style.has(card.style)) return false;
