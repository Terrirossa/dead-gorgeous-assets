// Card sizes on the styling table scale with the window (see
// applyStyleMetrics); the fan geometry scales with them. Phones keep the
// original tight arc; wide screens get the flatter, wider spread of the mood.
let styleMetrics = { slotW: 140, fanW: 122, wide: false };
function applyStyleMetrics() {
  const W = window.innerWidth, H = window.innerHeight;
  const wide = W >= 900;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  styleMetrics = wide
    ? { slotW: Math.round(clamp(Math.min(W * 0.16, H * 0.3), 150, 300)), fanW: Math.round(clamp(Math.min(W * 0.12, H * 0.24), 122, 230)), wide }
    : { slotW: 140, fanW: 122, wide };
  document.documentElement.style.setProperty("--slot-w", styleMetrics.slotW + "px");
  document.documentElement.style.setProperty("--fan-w", styleMetrics.fanW + "px");
}
let styleResizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(styleResizeTimer);
  styleResizeTimer = setTimeout(() => {
    if (document.getElementById("outfitBoard") && !document.querySelector(".fan-card-wrap.dragging")) renderStyle();
  }, 150);
});

function fanTransform(i, n) {
  const mid = (n - 1) / 2;
  const off = i - mid;
  if (styleMetrics.wide) {
    const fw = styleMetrics.fanW;
    const spread = Math.min(fw * 0.92, (window.innerWidth * 0.62) / Math.max(1, n - 1));
    const angle = off * Math.min(9, 44 / Math.max(1, n - 1));
    const x = off * spread;
    const y = off * off * fw * 0.045;
    return `translateX(${x.toFixed(1)}px) translateY(${y.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
  }
  const step = n <= 1 ? 0 : Math.min(22, 108 / (n - 1));
  const angle = off * step;
  const rad = (angle * Math.PI) / 180;
  const radius = 345;
  const x = Math.sin(rad) * radius * 0.78;
  const y = (1 - Math.cos(rad)) * 40;
  return `translateX(${x.toFixed(1)}px) translateY(${y.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
}

// Redraw: swap out your current (unplaced) hand for a fresh one, capped at
// the highest rarity you already had in hand -- so it fixes a bad draw
// without becoming a free way to fish for something better. One fewer card
// than you started with, once per client visit, never touches placed cards.
function redrawHand() {
  if (!redrawAvailable || hand.length === 0) return;

  // Key Cards stay stuck in hand through a redraw (Items/Keys spec §2.3) --
  // only the wearable portion of the hand is eligible to be discarded/redrawn,
  // and keys never factor into the rarity cap below.
  const keyIdSet = new Set(KEY_CARDS.map((k) => k.id));
  const keysInHand = hand.filter((id) => keyIdSet.has(id));
  const oldWearableHand = hand.filter((id) => !keyIdSet.has(id));
  if (oldWearableHand.length === 0) { redrawAvailable = false; renderStyle(); return; }

  const maxRarityIdx = Math.max(...oldWearableHand.map((id) => RARITY_ORDER[findCard(id).rarity] ?? 0));
  const allowedRarities = Object.keys(RARITY_ORDER).filter((r) => RARITY_ORDER[r] <= maxRarityIdx);

  const newCount = Math.max(0, oldWearableHand.length - 1);

  // Cards already placed in an outfit slot must be excluded too, not just
  // the current hand -- otherwise a redraw can hand you a second copy of
  // whatever you already committed to a slot, which is exactly how a
  // placed Denim Jacket or Cropped Pullover could turn up duplicated.
  const placedIds = outfit.filter(Boolean).map((c) => c.id);
  const unavailable = new Set([...hand, ...placedIds]);

  const jokerIds = new Set(JOKER_CARDS.map((c) => c.id));
  const pool = liveDeck.filter((c) => !jokerIds.has(c.id) && !keyIdSet.has(c.id) && !unavailable.has(c.id) && allowedRarities.includes(c.rarity)).map((c) => c.id);
  const newWearables = drawBalancedHand(pool, newCount);

  // deckPile and hand must stay mutually exclusive at all times -- the newly
  // drawn cards have to come OUT of deckPile, or a later Joker draw could
  // pull one of these same cards straight back out as a second copy.
  deckPile = deckPile.filter((id) => !newWearables.includes(id));
  discardPile.push(...oldWearableHand);
  hand = [...keysInHand, ...newWearables];
  redrawAvailable = false;
  renderStyle();
}

function flipCoin() {
  if (!coinFlipAvailable || deckPile.length === 0) return;
  coinFlipAvailable = false;
  coinFlipResult = Math.random() < 0.5 ? 1 : 2; // heads: one card, tails: two
  const extra = shuffle(deckPile).slice(0, Math.min(coinFlipResult, deckPile.length));
  deckPile = deckPile.filter((id) => !extra.includes(id));
  hand = hand.concat(extra);
  renderStyle();
}

function renderStyle() {
  const client = currentClient();
  const monthName = MONTHS[currentMonthIndex()];
  const wantSummary = currentBrief.playerChoice
    ? "Your call"
    : currentBrief.want.map((r) => r.label).join(", ");

  applyStyleMetrics();
  const slotsHTML = outfit.map((card, i) => {
    if (card) {
      const v = actionViolations(card);
      return `<div class="board-slot filled ${card.fullArt ? "filled-plain" : ""} ${v.length ? "violates" : ""} slot-${i}" onpointerdown="onSlotPointerDown(event, ${i})">${gcardHTML(card)}</div>`;
    }
    return `<div class="board-slot empty slot-${i}"><span class="plus"></span></div>`;
  }).join("");

  const n = hand.length;
  const fanHTML = n === 0
    ? `<div class="empty-hand">No cards left in hand this round.</div>`
    : hand.map((id, i) => {
        const card = findCard(id);
        const selected = id === selectedHandId;
        return `
          <div class="fan-card-wrap ${selected ? "selected" : ""} ${actionViolations(card).length ? "violates" : ""}" id="fan-${id}" ${card.category === "Joker" ? "data-joker" : ""}
               style="transform:${fanTransform(i, n)}; z-index:${selected ? 900 : 100 - Math.abs(i - (n - 1) / 2)};"
               onpointerdown="onCardPointerDown(event, ${id})">
            ${gcardHTML(card)}
          </div>
        `;
      }).join("");

  const firstName = client.name.split(",")[0];
  const wants = currentBrief.playerChoice
    ? "your call"
    : currentBrief.want.map((r) => r.label.toLowerCase()).join(" & ");
  const coinReady = coinFlipAvailable && deckPile.length > 0;
  const coinToastHTML = coinFlipResult
    ? `<div class="coin-toast" role="status">${icon("coin")}<span>${coinFlipResult === 1 ? "Heads \u2014 one new card" : "Tails \u2014 two new cards"}</span></div>`
    : "";
  coinFlipResult = null;
  const redrawReady = redrawAvailable && hand.length > 0;

  stage.innerHTML = `
    <aside class="style-client">
      <div class="style-brief">
        <div class="style-who">${firstName}</div>
        <div class="style-wants">${currentBrief.playerChoice ? "Style from what you know" : `Wants: <b>${wants}</b>`}</div>
        ${actionExclusions.some((x) => x.fromBrief) ? `<div class="style-not">Not: <b>${actionExclusions.filter((x) => x.fromBrief).map((x) => actionShort(x.attr, x.value).toLowerCase()).join(", ")}</b></div>` : ""}
        ${survivalPanelHTML(outfit.filter(Boolean))}
      </div>
      ${client.portrait ? `<div class="portrait"><img src="${client.portrait}" alt="${firstName}"></div>` : ""}
      ${lastActionLine ? `<div class="speech style-speech ${actionArriving >= 0 ? "fresh" : ""}"><span class="speaker">${lastActionLine.name}</span>${lastActionLine.note ? `<em class="style-note">${lastActionLine.note}</em>` : ""}${lastActionLine.text}</div>` : ""}
    </aside>

    <div class="style-table"><div class="outfit-board" id="outfitBoard">${slotsHTML}${actionStackHTML()}</div></div>

    <div class="hand-fan" id="handFan">${fanHTML}</div>

    <button class="corner-action corner-left ${coinReady ? "" : "used"}" onclick="flipCoin()" aria-label="Flip a coin" title="Flip a coin, once per client: heads, one new card; tails, two">${icon("coin")}</button>
    ${coinToastHTML}
    <button class="corner-action corner-left corner-left-2 ${redrawReady ? "" : "used"}" onclick="redrawHand()" aria-label="Redraw" title="Redraw: swap your hand for new cards of the same rarity or lower, once per client">${icon("redraw")}</button>
    <button class="corner-action corner-right" id="continueBtn" onclick="${specialJob ? "finishSpecialStyling()" : "finishStyling()"}" aria-label="Finish outfit" title="See their reaction">${icon("check")}</button>
  `;
  updateTopBar("", true);
  document.body.classList.add("no-scroll"); // drag-and-drop during styling needs a fixed viewport
}

/* ---------------- SLOT RULES ---------------- */

// A Dress covers both "Top" and "Bottom" ground, so it conflicts with either;
// otherwise it's simply one card per category, full stop.
function categoryClashes(card, excludeIndex) {
  return outfit.some((c, i) => {
    if (!c || i === excludeIndex) return false;
    if (c.category === card.category) return true;
    if (card.category === "Dress" && (c.category === "Top" || c.category === "Bottom")) return true;
    if (c.category === "Dress" && (card.category === "Top" || card.category === "Bottom")) return true;
    return false;
  });
}

function slotCenters() {
  return [0, 1, 2, 3].map((i) => {
    const el = document.querySelector(`.slot-${i}`);
    const r = el.getBoundingClientRect();
    return { i, cx: r.left + r.width / 2, cy: r.top + r.height / 2, r };
  });
}

function nearestSlot(x, y) {
  const centers = slotCenters();
  let best = null;
  let bestDist = Infinity;
  for (const c of centers) {
    const pad = 40;
    const within = x >= c.r.left - pad && x <= c.r.right + pad && y >= c.r.top - pad && y <= c.r.bottom + pad;
    const d = Math.hypot(x - c.cx, y - c.cy);
    if (within && d < bestDist) { bestDist = d; best = c.i; }
  }
  return best;
}

function firstEmptySlot() {
  const idx = outfit.findIndex((c) => c === null);
  return idx === -1 ? null : idx;
}

/* ---------------- DRAG + PLACE ---------------- */


/* ---------------- ACTION CARDS ----------------
   See ACTION_CARD_* in data-story.js. The round's brief is copied at the
   start of the job (so an action card never edits the authored data), and
   planActionCards() decides whether -- and after how many placed cards --
   she interrupts. */
let actionPlan = [];   // [{ afterPlaced, fired }]
let actionCards = [];  // cards played this job
let actionExclusions = []; // [{ attr, value, label }] or { rarity: [...] }

function overallJobNumber() { return (currentYear - 1) * 36 + clientRoundIndex; }

function planActionCards() {
  actionPlan = []; actionCards = []; actionExclusions = [];
  const g = overallJobNumber();
  const tier = ACTION_CARD_CHANCE.find((t) => g < t.beforeJob) || ACTION_CARD_CHANCE[ACTION_CARD_CHANCE.length - 1];
  const guaranteed = !storyFlags.actionCardMet && g >= ACTION_CARD_GUARANTEE_BY;
  let count = 0;
  if (guaranteed || Math.random() < tier.chance) {
    count = 1;
    if (Math.random() < (tier.second || 0)) { count = 2; if (Math.random() < (tier.third || 0)) count = 3; }
  }
  // When she interrupts: one card after your 1st or 2nd piece; two after the
  // 1st/2nd and the 3rd; three after each of the first three.
  const at = count === 3 ? [1, 2, 3] : count === 2 ? [Math.random() < 0.5 ? 1 : 2, 3] : count === 1 ? [Math.random() < 0.5 ? 1 : 2] : [];
  at.forEach((n) => actionPlan.push({ afterPlaced: n, fired: false }));
}

function actionAttrValues(card, attr) {
  if (attr === "style") return [card.style, card.style2].filter(Boolean);
  return card[attr] ? [card[attr]] : [];
}
function actionNoun(attr, value) {
  const v = value.toLowerCase();
  if (attr === "style") return `${v} pieces`;
  if (attr === "fit") return `${v} cuts`;
  return v;
}
function actionShort(attr, value) { return attr === "fit" ? `${value} fit` : value; }

// Does this card break one of the exclusions played this job?
function actionViolations(card) {
  if (!card || card.type === "KEY" || card.category === "Joker") return [];
  return actionExclusions.filter((x) =>
    x.rarities ? x.rarities.includes(card.rarity) : actionAttrValues(card, x.attr).includes(x.value)).map((x) => x.label);
}

function wantedValue(attr, value) {
  return (currentBrief.want || []).some((r) => r.attr === attr && r.value === value);
}

function generateActionCard() {
  const key = currentClientKey();
  const inPlay = [...hand.map(findCard), ...outfit.filter(Boolean)].filter((c) => c && c.type !== "KEY" && c.category !== "Joker");
  const inHand = hand.map(findCard).filter((c) => c && c.type !== "KEY" && c.category !== "Joker");
  const weights = { ...(ACTION_CARD_WEIGHTS[key] || { exclude: 1, add: 1, swap: 1, noBasics: 0.3 }) };
  if (currentBrief.playerChoice) { weights.add = 0; weights.swap = 0; }
  const ATTRS = ["color", "style", "fit"];
  const alreadyExcluded = (attr, value) => actionExclusions.some((x) => x.attr === attr && x.value === value);
  const stillPlayable = (extra) => inPlay.filter((c) => actionViolations(c).length === 0 && !extra(c)).length >= 4;

  const attempts = {
    exclude: () => {
      // something actually in play, not something she asked for
      const options = [];
      inPlay.forEach((c) => ATTRS.forEach((attr) => actionAttrValues(c, attr).forEach((value) => {
        if (!wantedValue(attr, value) && !alreadyExcluded(attr, value)) options.push({ attr, value });
      })));
      const onBoard = options.filter((o) => outfit.some((c) => c && actionAttrValues(c, o.attr).includes(o.value)));
      const pool = shuffle(onBoard.length && Math.random() < 0.6 ? onBoard : options);
      const pick = pool.find((o) => stillPlayable((c) => actionAttrValues(c, o.attr).includes(o.value)));
      if (!pick) return null;
      return { kind: "exclude", attr: pick.attr, value: pick.value, label: `No ${actionShort(pick.attr, pick.value)}` };
    },
    noBasics: () => {
      if (actionExclusions.some((x) => x.rarities)) return null;
      if (!inPlay.some((c) => c.rarity === "Basic")) return null;
      if (!stillPlayable((c) => c.rarity === "Basic")) return null;
      return { kind: "noBasics", rarities: ["Basic"], label: "No Basics" };
    },
    add: () => {
      const options = [];
      inHand.forEach((c) => ATTRS.forEach((attr) => actionAttrValues(c, attr).forEach((value) => {
        if (!wantedValue(attr, value) && !alreadyExcluded(attr, value)) options.push({ attr, value });
      })));
      const pick = shuffle(options)[0];
      if (!pick) return null;
      return { kind: "add", attr: pick.attr, value: pick.value, label: `+ ${actionShort(pick.attr, pick.value)}` };
    },
    swap: () => {
      const swappable = (currentBrief.want || []).filter((r) => ATTRS.includes(r.attr) && !r.anyOf);
      if (!swappable.length) return null;
      const old = shuffle(swappable)[0];
      const options = [];
      inHand.forEach((c) => actionAttrValues(c, old.attr).forEach((value) => {
        if (!wantedValue(old.attr, value) && !alreadyExcluded(old.attr, value)) options.push(value);
      }));
      const value = shuffle(options)[0];
      if (!value) return null;
      return { kind: "swap", attr: old.attr, value, old: old.value, label: `${actionShort(old.attr, value)}, not ${old.value}` };
    },
  };

  // Weighted pick, falling back through the other kinds if one can't be made fair.
  const kinds = Object.keys(weights).filter((k) => weights[k] > 0);
  const order = [];
  while (kinds.length) {
    const total = kinds.reduce((sum, k) => sum + weights[k], 0);
    let r = Math.random() * total;
    const i = kinds.findIndex((k) => (r -= weights[k]) < 0);
    order.push(kinds.splice(i < 0 ? 0 : i, 1)[0]);
  }
  for (const kind of order) {
    const card = attempts[kind]();
    if (card) return card;
  }
  return null;
}

function applyActionCard(card) {
  if (card.kind === "exclude") actionExclusions.push({ attr: card.attr, value: card.value, label: card.label });
  if (card.kind === "noBasics") actionExclusions.push({ rarities: card.rarities, label: card.label });
  if (card.kind === "add") currentBrief.want = [...(currentBrief.want || []), req(card.attr, card.value)];
  if (card.kind === "swap") currentBrief.want = currentBrief.want.map((r) => (r.attr === card.attr && r.value === card.old ? req(card.attr, card.value) : r));
  actionCards.push(card);
}

function actionLineFor(card) {
  const lines = (ACTION_CARD_LINES[currentClientKey()] || ACTION_CARD_LINES[0])[card.kind] || ["..."];
  const noun = card.attr ? actionNoun(card.attr, card.value) : "";
  const adj = card.value ? card.value.toLowerCase() : "";
  const t = lines[Math.floor(Math.random() * lines.length)];
  return t.replace(/\{A\}/g, adj.charAt(0).toUpperCase() + adj.slice(1)).replace(/\{V\}/g, noun.charAt(0).toUpperCase() + noun.slice(1)).replace(/\{v\}/g, noun).replace(/\{a\}/g, adj)
    .replace(/\{old\}/g, (card.old || "").toLowerCase());
}

// Called after every card placed on the board. The card slides from her
// portrait onto the table beside your slots; her line appears under her
// portrait. Nothing blocks play.
let lastActionLine = null;   // { name, text } shown under her portrait
let actionArriving = -1;     // index of the card that just arrived (animates once)
function maybeFireActionCard() {
  const next = actionPlan.find((p) => !p.fired);
  if (!next) return;
  const placed = outfit.filter(Boolean).length;
  if (placed < next.afterPlaced) return;
  next.fired = true;
  const card = next.scripted ? scriptedActionCard(next.scripted) : generateActionCard();
  if (!card) return;
  applyActionCard(card);
  storyFlags.actionCardMet = true;
  const fire = () => {
    if (!document.getElementById("outfitBoard")) return;
    if (document.querySelector(".fan-card-wrap.dragging")) { setTimeout(fire, 300); return; }
    const key = currentClientKey();
    lastActionLine = next.scripted
      ? { name: titleCase(next.scripted.who), text: next.scripted.t, note: next.scripted.note }
      : { name: CLIENTS[key].name.split(",")[0], text: actionLineFor(card) };
    actionArriving = actionCards.length - 1;
    renderStyle();
    actionArriving = -1;
    const portrait = document.querySelector(".style-client .portrait");
    if (portrait) { portrait.classList.remove("speaking"); void portrait.offsetWidth; portrait.classList.add("speaking"); }
  };
  setTimeout(fire, 350);
}
function actionStackHTML() {
  if (!actionCards.length) return "";
  const name = specialJob ? specialJob.virtualClient.name : CLIENTS[currentClientKey()].name.split(",")[0];
  return `<div class="action-stack">${actionCards.map((c, i) => `
    <div class="action-card kind-${c.kind} ${i === actionArriving ? "arriving" : ""}" style="--i:${i}" role="img" aria-label="Action card: ${c.label}">
      <span class="ac-label">Action</span>
      <span class="ac-text">${c.label}</span>
      <span class="ac-from">${c.from || name}</span>
    </div>`).join("")}</div>`;
}

function showActionCard(card) {
  const key = currentClientKey();
  const name = CLIENTS[key].name.split(",")[0];
  const reply = ((ACTION_CARD_LINES[key] || {}).replies || ["Fine."]);
  const overlay = document.createElement("div");
  overlay.className = "action-overlay";
  overlay.innerHTML = `
    <div class="action-card-big kind-${card.kind}" role="img" aria-label="Action card: ${card.label}">
      <span class="ac-label">Action</span>
      <span class="ac-text">${card.label}</span>
      <span class="ac-from">${name}</span>
    </div>
    <div class="speech action-line"><span class="speaker">${name}</span>${actionLineFor(card)}</div>
    <button class="primary action-ok" onclick="dismissActionCard()">${reply[Math.floor(Math.random() * reply.length)]}</button>
  `;
  document.body.appendChild(overlay);
  const portrait = document.querySelector(".style-client .portrait");
  if (portrait) { portrait.classList.remove("speaking"); void portrait.offsetWidth; portrait.classList.add("speaking"); }
  setTimeout(() => overlay.querySelector(".action-ok")?.focus(), 900);
}
function dismissActionCard() {
  document.querySelector(".action-overlay")?.remove();
  renderStyle();
}

function placeCardInSlot(id, slotIndex) {
  const card = findCard(id);
  if (slotIndex === null) { renderStyle(); return; } // no valid target — snap back

  if (categoryClashes(card, slotIndex)) {
    renderStyle();
    flashHint(`Already have a ${card.category.toLowerCase()} in this outfit`);
    return;
  }

  if (outfit[slotIndex]) hand.push(outfit[slotIndex].id); // swap out, back to hand — never lost
  outfit[slotIndex] = card;
  hand = hand.filter((hid) => hid !== id);
  selectedHandId = null;
  renderStyle();
  maybeFireActionCard();
}

function returnCardToHand(slotIndex) {
  const card = outfit[slotIndex];
  if (!card) return;
  outfit[slotIndex] = null;
  hand.push(card.id);
  renderStyle();
}

function onSlotPointerDown(ev, slotIndex) {
  ev.preventDefault();
  ev.stopPropagation();
  const el = document.querySelector(`.slot-${slotIndex}`);
  if (!el) return;
  const rect = el.getBoundingClientRect();

  slotDragState = {
    slotIndex, moved: false,
    startX: ev.clientX, startY: ev.clientY,
    centerX: rect.left + rect.width / 2, centerY: rect.top + rect.height / 2,
    width: el.offsetWidth, height: el.offsetHeight,
  };

  el.setPointerCapture(ev.pointerId);
  el.addEventListener("pointermove", onSlotPointerMove);
  el.addEventListener("pointerup", onSlotPointerUp);
}

function onSlotPointerMove(ev) {
  if (!slotDragState) return;
  const el = document.querySelector(`.slot-${slotDragState.slotIndex}`);
  if (!el) return;
  const dx = ev.clientX - slotDragState.startX;
  const dy = ev.clientY - slotDragState.startY;

  if (!slotDragState.moved && Math.hypot(dx, dy) > 8) {
    slotDragState.moved = true;
    el.style.position = "fixed";
    el.style.zIndex = "3000";
    el.style.margin = "0";
    el.style.width = slotDragState.width + "px";
    el.style.height = slotDragState.height + "px";
    el.style.left = (slotDragState.centerX - slotDragState.width / 2) + "px";
    el.style.top = (slotDragState.centerY - slotDragState.height / 2) + "px";
  }

  if (slotDragState.moved) {
    el.style.left = (slotDragState.centerX - slotDragState.width / 2 + dx) + "px";
    el.style.top = (slotDragState.centerY - slotDragState.height / 2 + dy) + "px";

    const target = nearestSlot(ev.clientX, ev.clientY);
    document.querySelectorAll(".board-slot").forEach((e) => e.classList.remove("target-hover"));
    if (target !== null && target !== slotDragState.slotIndex) {
      const t = document.querySelector(`.slot-${target}`);
      if (t) t.classList.add("target-hover");
    }
  }
}

function onSlotPointerUp(ev) {
  if (!slotDragState) return;
  const { slotIndex, moved } = slotDragState;
  const el = document.querySelector(`.slot-${slotIndex}`);
  if (el) {
    el.releasePointerCapture(ev.pointerId);
    el.removeEventListener("pointermove", onSlotPointerMove);
    el.removeEventListener("pointerup", onSlotPointerUp);
  }
  document.querySelectorAll(".board-slot").forEach((e) => e.classList.remove("target-hover"));
  slotDragState = null;

  if (!moved) {
    returnCardToHand(slotIndex);
    return;
  }

  const target = nearestSlot(ev.clientX, ev.clientY);
  if (target === null || target === slotIndex) {
    renderStyle(); // snap back to its own slot
    return;
  }

  // Swapping two already-worn cards' positions can never create a new
  // category clash — the same set of pieces stays worn either way.
  const tmp = outfit[target];
  outfit[target] = outfit[slotIndex];
  outfit[slotIndex] = tmp;
  renderStyle();
}

function flashHint(msg) {
  const hint = document.querySelector(".hand-hint");
  if (!hint) return;
  const original = hint.textContent;
  hint.textContent = msg;
  hint.style.color = "var(--pink)";
  setTimeout(() => { hint.textContent = original; hint.style.color = ""; }, 1400);
}

let longPressTimer = null;
let longPressFired = false;

function onCardPointerDown(ev, id) {
  ev.preventDefault();
  const wrap = document.getElementById(`fan-${id}`);
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();

  dragState = {
    id, moved: false,
    startX: ev.clientX, startY: ev.clientY,
    centerX: rect.left + rect.width / 2, centerY: rect.top + rect.height / 2,
    width: wrap.offsetWidth, height: wrap.offsetHeight,
  };

  longPressFired = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    if (!dragState || dragState.moved) return; // a real drag is happening, not a long-press
    longPressFired = true;
    const heldId = dragState.id;
    wrap.releasePointerCapture(ev.pointerId);
    wrap.removeEventListener("pointermove", onCardPointerMove);
    wrap.removeEventListener("pointerup", onCardPointerUp);
    dragState = null;
    jokerPicking = null;
    openCardDetail(heldId);
  }, 480);

  wrap.setPointerCapture(ev.pointerId);
  wrap.addEventListener("pointermove", onCardPointerMove);
  wrap.addEventListener("pointerup", onCardPointerUp);
}

function onCardPointerMove(ev) {
  if (!dragState) return;
  const wrap = document.getElementById(`fan-${dragState.id}`);
  if (!wrap) return;
  const dx = ev.clientX - dragState.startX;
  const dy = ev.clientY - dragState.startY;

  if (!dragState.moved && Math.hypot(dx, dy) > 8) {
    dragState.moved = true;
    clearTimeout(longPressTimer); // a real drag started — cancel the long-press
    wrap.classList.add("dragging");
    wrap.style.position = "fixed";
    wrap.style.bottom = "auto";
    wrap.style.right = "auto";
    wrap.style.margin = "0";
    wrap.style.width = dragState.width + "px";
    wrap.style.height = dragState.height + "px";
    wrap.style.left = (dragState.centerX - dragState.width / 2) + "px";
    wrap.style.top = (dragState.centerY - dragState.height / 2) + "px";
    wrap.style.transform = "none"; // upright while dragging, not rotated
  }

  if (dragState.moved) {
    wrap.style.left = (dragState.centerX - dragState.width / 2 + dx) + "px";
    wrap.style.top = (dragState.centerY - dragState.height / 2 + dy) + "px";

    const target = nearestSlot(ev.clientX, ev.clientY);
    document.querySelectorAll(".board-slot").forEach((el) => el.classList.remove("target-hover"));
    if (target !== null) {
      const el = document.querySelector(`.slot-${target}`);
      if (el) el.classList.add("target-hover");
    }
  }
}

function onCardPointerUp(ev) {
  clearTimeout(longPressTimer);
  if (longPressFired) { longPressFired = false; return; } // already handled as a long-press
  if (!dragState) return;
  const { id, moved } = dragState;
  const wrap = document.getElementById(`fan-${id}`);
  if (wrap) {
    wrap.releasePointerCapture(ev.pointerId);
    wrap.removeEventListener("pointermove", onCardPointerMove);
    wrap.removeEventListener("pointerup", onCardPointerUp);
  }

  document.querySelectorAll(".board-slot").forEach((el) => el.classList.remove("target-hover"));
  dragState = null;

  const card = findCard(id);
  if (card.category === "Joker") {
    renderStyle(); // snap the joker card back into the fan first
    useJokerCard(id);
    return;
  }

  if (!moved) {
    // plain tap: just lift it forward, never places automatically
    selectedHandId = selectedHandId === id ? null : id;
    renderStyle();
  } else {
    const target = nearestSlot(ev.clientX, ev.clientY);
    placeCardInSlot(id, target);
  }
}

    const stages = CLIENT_STAGES[i] || [];

let jokerPicking = null; // id of the joker card currently being used, or null

let deckSortMode = "category"; // always group by kind — simplest useful default, no separate UI needed

let deckFilters = { category: new Set(), rarity: new Set(), style: new Set() };




function sortedLiveDeck() {
  const arr = [...liveDeck];
  if (deckSortMode === "rarity") {
    arr.sort((a, b) => (RARITY_ORDER[a.rarity] ?? 0) - (RARITY_ORDER[b.rarity] ?? 0));
  } else if (deckSortMode === "style") {
    arr.sort((a, b) => (a.style || "").localeCompare(b.style || ""));
  } else if (deckSortMode === "category") {
    arr.sort((a, b) => (a.category || "").localeCompare(b.category || ""));
  }
  return arr;
}

function filteredDeck() {
  return sortedLiveDeck().filter((card) => {
    if (deckFilters.category.size > 0 && !deckFilters.category.has(card.category)) return false;
    if (deckFilters.rarity.size > 0 && !deckFilters.rarity.has(card.rarity)) return false;
    if (deckFilters.style.size > 0 && !deckFilters.style.has(card.style)) return false;
    return true;
  });
}

function setDeckSort(mode) {
  deckSortMode = deckSortMode === mode ? "default" : mode;
  renderDeckOverlay();
}

function toggleDeckFilter(dim, value) {
  if (deckFilters[dim].has(value)) deckFilters[dim].delete(value);
  else deckFilters[dim].add(value);
  renderDeckOverlay();
}

function clearDeckFilters() {
  deckFilters = { category: new Set(), rarity: new Set(), style: new Set() };
  renderDeckOverlay();
}

function openDeck() {
  jokerPicking = null;
  deckFilters = { category: new Set(), rarity: new Set(), style: new Set() };

function renderDeckOverlay() {
  const overlay = document.getElementById("deckOverlay");
  const picking = jokerPicking !== null;

  const items = filteredDeck()
    .filter((card) => card.category !== "Joker" || !picking) // don't offer other jokers as a tutor target
    .map((card) => {

      let cls = "status-pool";
      if (hand.includes(card.id)) { status = "In hand"; cls = "status-hand"; }
      else if (outfit.some((c) => c && c.id === card.id)) { status = "Worn now"; cls = "status-worn"; }
      else if (discardPile.includes(card.id)) { status = "Used"; cls = "status-used"; }

      const pickable = picking && status === "In pool";
      const onclick = picking
        ? (pickable ? `onclick="pickJokerCard(${card.id})"` : "")

  const anyFilterActive = deckFilters.category.size + deckFilters.rarity.size + deckFilters.style.size > 0;

  overlay.innerHTML = `

    ${filterPanel}
    ${picking ? `<p style="text-align:center; color:var(--muted); font-size:12.5px; margin:-10px 0 16px;">Only cards still in your deck pool can be picked.</p>` : ""}
    ${picking ? "" : discoveredSetsHTML()}

// 3D tilt: the card leans toward the pointer and a soft light follows it.
// Updates are batched per animation frame, and the card eases back to flat
// when the pointer leaves. Works with mouse, pen and touch (drag a finger
// across the card on the Steam Deck). Off when reduced motion is requested.
function initCardTilt(stageEl, cardEl) {
  if (!stageEl || !cardEl) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let frame = null, px = 0.5, py = 0.5;
  const MAX = 14; // degrees
  const apply = () => {
    frame = null;
    const rx = (0.5 - py) * MAX * 2;
    const ry = (px - 0.5) * MAX * 2;
    cardEl.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale3d(1.03, 1.03, 1.03)`;
    cardEl.style.setProperty("--gx", `${(px * 100).toFixed(1)}%`);
    cardEl.style.setProperty("--gy", `${(py * 100).toFixed(1)}%`);
    cardEl.style.setProperty("--ga", "1");
  };
  stageEl.addEventListener("pointermove", (e) => {
    const r = cardEl.getBoundingClientRect();
    px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    cardEl.classList.add("is-tilting");
    if (!frame) frame = requestAnimationFrame(apply);
  });
  stageEl.addEventListener("pointerleave", () => {
    if (frame) { cancelAnimationFrame(frame); frame = null; }
    cardEl.classList.remove("is-tilting");
    cardEl.style.transform = "";
    cardEl.style.setProperty("--ga", "0");
  });
}

/* ---------------- RESULT / PROGRESSION ---------------- */

// Rarity bonus: a piece that helps match the brief gets a bonus scaled to
// its rarity. A rare-or-above piece that does nothing for the brief still
// gives a small flat bonus, just for being an impressive thing to own.

const RARITY_OFFBRIEF_BONUS = 5;
const HIGH_RARITY = new Set(["Rare", "Iconic", "Legendary"]);

// A piece matches a requirement if it's an exact attr/value hit, or (for a
// rarity requirement) its rarity is one of the acceptable tiers.
//
// Style specifically also checks a piece's secondary style tag (style2, from
// the master spreadsheet's style_tag_2 -- only ~109 cards have one; the rest
// behave exactly as before). A style2 hit only counts at HALF weight of a
// primary style match: most cards' two style tags are common, popular styles
// (Elegant/Classic/Romantic/Daring), and letting both count equally would
// have made those styles trivially easy to satisfy with almost any card in
// the deck, especially for the two clients (Margo, Holly) who share a
// preferred style -- see reqMatchWeight()/preferenceMatchWeight() below for
// where that weight actually gets used.
function reqMatches(r, piece) { return reqMatchWeight(r, piece) > 0; }
function reqMatchWeight(r, piece) {
  if (r.anyOf) return r.anyOf.includes(piece[r.attr]) ? 1 : 0;
  if (piece[r.attr] === r.value) return 1;
  if (r.attr === "style" && piece.style2 === r.value) return 0.5;
  return 0;
}

// Hidden preferences reuse the same { type:"attr", attr, value } shape.
function preferenceMatches(rule, pieces) { return preferenceMatchWeight(rule, pieces) > 0; }
function preferenceMatchWeight(rule, pieces) {
  if (rule.type === "name") return pieces.some((p) => p.name.includes(rule.keyword)) ? 1 : 0;
  if (pieces.some((p) => p[rule.attr] === rule.value)) return 1;
  if (rule.attr === "style" && pieces.some((p) => p.style2 === rule.value)) return 0.5;
  return 0;
}

function preferenceLabel(rule) {
  if (rule.type === "name") return rule.keyword;
  const v = rule.value.toLowerCase();
  if (rule.attr === "color") return v;              // "black"
  if (rule.attr === "style") return `${v} styles`;  // "elegant styles"
  if (rule.attr === "fit") return `${v} cuts`;      // "fitted cuts"
  return v;
}

// A stable id for a preference, used to track what's been discovered per
// client (soulProfiles[key].discovered).
function preferenceKey(rule) {
  return rule.type === "name" ? `name:${rule.keyword}` : `${rule.attr}:${rule.value}`;
}

function finishStyling() {
  const client = currentClient();
  const key = currentClientKey();
  const profile = soulProfiles[key];
  const pieces = Object.values(outfit).filter(Boolean);
  const wantList = currentBrief.want || []; // empty for a player-choice (trust) job

  // Per-piece detail — computed once, used for both the aggregate totals and
  // the itemized breakdown, so the two views can never disagree.
  // A piece that breaks one of the rules (a brief's "No ..." or an Action
  // Card's) earns nothing at all -- no brief points, no rarity bonus, never
  // "Best piece" -- on top of its ACTION_EXCLUDE_PENALTY below.
  const pieceDetails = pieces.map((piece) => {
    const broken = actionViolations(piece);
    if (broken.length > 0) return { piece, matchedAttrs: [], briefPts: 0, rarityPts: 0, broken, penalty: -broken.length * ACTION_EXCLUDE_PENALTY };
    const matchedAttrs = wantList.filter((r) => reqMatches(r, piece));
    const briefPts = wantList.reduce((sum, r) => sum + reqMatchWeight(r, piece) * 25, 0);
    let rarityPts = 0;
    if (matchedAttrs.length > 0) rarityPts = RARITY_FIT_BONUS[piece.rarity] || 0;
    else if (HIGH_RARITY.has(piece.rarity)) rarityPts = RARITY_OFFBRIEF_BONUS;
    return { piece, matchedAttrs, briefPts, rarityPts };
  });

  // Whichever single piece contributed the most points -- shown on the
  // result screen so the player can see exactly what worked.
  let bestPiece = null;
  if (pieceDetails.length > 0) {
    const top = pieceDetails.reduce((best, d) => (d.briefPts + d.rarityPts > best.briefPts + best.rarityPts ? d : best));
    if (top.briefPts + top.rarityPts > 0) bestPiece = top.piece;
  }

  const rawBriefScore = pieceDetails.reduce((sum, d) => sum + d.briefPts, 0);
  const briefScore = Math.min(rawBriefScore, 100);
  const briefCapped = rawBriefScore > 100;
  const rarityBonus = pieceDetails.reduce((sum, d) => sum + d.rarityPts, 0);

  // Hidden preferences — permanent personal taste, separate from the active
  // brief (see the briefing doc's "Hidden Preferences & Discovery"). An
  // "against preference" job can suppress one of these for itself
  // (currentBrief.suppressPreference) so wearing the thing she just asked
  // to avoid doesn't quietly still score. A player-choice (trust) job scores
  // these at +15 each, capped at +60, instead of the usual uncapped +8 each.
  const suppressed = new Set([...(currentBrief.suppressPreference || []), ...actionExclusions.filter((x) => x.value).map((x) => x.value)]);
  const matchedPreferences = (client.preferences || [])
    .filter((rule) => !suppressed.has(rule.value) && preferenceMatches(rule, pieces));
  const preferencePointValue = currentBrief.playerChoice ? 15 : 8;
  const rawPreferenceScore = matchedPreferences.reduce((sum, rule) => sum + preferenceMatchWeight(rule, pieces) * preferencePointValue, 0);
  const preferenceBonus = currentBrief.playerChoice ? Math.min(rawPreferenceScore, 60) : rawPreferenceScore;
  const preferenceCapped = currentBrief.playerChoice && rawPreferenceScore > 60;

  // A preference scores the moment it's matched, discovered or not (per the
  // doc: "Discovery is knowledge progression, not an unlock for the
  // character's taste") — but it only permanently joins her profile, and
  // only gets the "new preference discovered" callout, the first time.
  const newlyDiscovered = matchedPreferences.filter((rule) => !profile.discovered.includes(preferenceKey(rule)));
  newlyDiscovered.forEach((rule) => profile.discovered.push(preferenceKey(rule)));

  // A signature color combo they personally love.
  let comboBonus = 0;
  let comboNewlyDiscovered = false;
  if (client.combo && client.combo.colors.every((c) => pieces.some((p) => p.color === c))) {
    comboBonus = client.combo.bonus;
    const comboKey = "combo:" + client.combo.colors.join(" + ");
    if (!profile.discovered.includes(comboKey)) {
      profile.discovered.push(comboKey);
      comboNewlyDiscovered = true;
    }
  }

  // Seasonal event bonus — only during the festival's peak month, and only
  // when something already worn happens to fit the occasion.
  const activeEvent = currentMonthEvent();
  const eventDef = activeEvent ? EVENT_BONUSES[activeEvent] : null;
  let eventBonus = 0;
  if (eventDef) {
    const fits = pieces.some((p) =>
      (eventDef.styles && (eventDef.styles.includes(p.style) || eventDef.styles.includes(p.style2))) ||
      (eventDef.colors && eventDef.colors.includes(p.color)) ||
      (eventDef.categories && eventDef.categories.includes(p.category)) ||
      (eventDef.rarities && eventDef.rarities.includes(p.rarity))
    );
    if (fits) eventBonus = 10;
  }

  // A little grace for the first few clients, so the scoring system doesn't
  // feel punishing before the player has learned how matching works. Fades
  // out completely by the 4th visit.
  const WELCOME_BONUS = [20, 12, 6];
  const welcomeBonus = currentYear === 1 ? (WELCOME_BONUS[clientRoundIndex] || 0) : 0;

  const score = briefScore + rarityBonus + preferenceBonus + comboBonus + eventBonus + welcomeBonus;

  // Small penalties for real gaps in the outfit. A jacket (or an accessory)
  // is a bonus layer, never required — but going out with no shoes, or no
  // top/bottom when not wearing a dress, is a real miss worth noting.
  const hasDress = pieces.some((p) => p.category === "Dress");
  const hasShoes = pieces.some((p) => p.category === "Shoes");
  const hasTop = pieces.some((p) => p.category === "Top");
  const hasBottom = pieces.some((p) => p.category === "Bottom");
  let gapPenalty = 0;
  const gaps = [];
  if (!hasShoes) { gapPenalty -= 10; gaps.push("No shoes"); }
  if (!hasDress && !hasTop) { gapPenalty -= 10; gaps.push("No top"); }
  if (!hasDress && !hasBottom) { gapPenalty -= 10; gaps.push("No bottom"); }
  // Action cards: each worn piece that ignores an exclusion costs points.
  const exclusionResults = actionExclusions.map((x) => {
    const count = pieces.filter((pc) => actionViolations(pc).includes(x.label)).length;
    return { label: x.label, count };
  });
  const exclusionPenalty = exclusionResults.reduce((sum, r) => sum - r.count * ACTION_EXCLUDE_PENALTY, 0);
  gapPenalty += exclusionPenalty;
  exclusionResults.filter((r) => r.count > 0).forEach((r) => gaps.push(`Ignored \u201C${r.label}\u201D` + (r.count > 1 ? ` ×${r.count}` : "")));
  // Grief: sobbing costs every worn piece SOBBING_PER_PIECE.
  if (griefSobbing() && pieces.length) {
    gapPenalty -= SOBBING_PER_PIECE * pieces.length;
    gaps.push(`Sobbing` + (pieces.length > 1 ? ` ×${pieces.length}` : ""));
  }
  let scoreWithGaps = score + gapPenalty;

  // A complete matching set, but only when the outfit already works. Resolved
  // before totalScore/delightedCount/etc so a newly-discovered set's +20
  // is reflected consistently everywhere the score is used below.
  let setBonusName = null;
  let setBonusId = null;
  let setNewlyDiscovered = false;
  let setBonusCard = null;
  let setPiecesUsed = [];
  if (scoreWithGaps >= 70) {
    const completed = Object.entries(SET_NAMES).find(([setId]) => {
      const setPieces = pieces.filter((p) => p.set === setId);
      const uniqueIds = new Set(setPieces.map((p) => p.id));
      return uniqueIds.size >= 2;
    });
    if (completed) {
      setBonusName = completed[1];
      setBonusId = completed[0];
      setPiecesUsed = pieces.filter((p) => p.set === completed[0]);
      if (discoveredSets.has(completed[0])) {
        scoreWithGaps += SET_REPEAT_BONUS; // a known set still pays off, just less than discovering it
      }
      if (!discoveredSets.has(completed[0])) {
        discoveredSets.add(completed[0]);
        setNewlyDiscovered = true;
        scoreWithGaps += 20;
        const rewarded = unlockRandomCards(1);
        if (rewarded.length > 0) {
          rebuildLiveDeckFromUnlocked();
          deckPile.push(rewarded[0].id);
          setBonusCard = rewarded[0];
        }
      }
    }
  }

  totalScore += scoreWithGaps;
  if (scoreWithGaps >= 70) delightedCount += 1;

  let moonCoinsEarned = 0;
  // Mooncoins: 2 for an outfit she loves, 3 for a perfect one (was a flat 1,
  // which left the shop out of reach for most of the year).
  if (scoreWithGaps >= 70) { moonCoinsEarned = scoreWithGaps >= 100 ? 3 : 2; moonCoins += moonCoinsEarned; }

  // Hearts gate the Studio conversations and the friendship gift, so they
  // grow steadily: half a heart for an outfit she loves, nothing otherwise.
  let relDelta = scoreWithGaps >= 70 ? 0.5 : 0;

  // A single job — however perfect — is one relationship-building moment,
  // not three. Capped at a full heart per visit; the relationship itself
  // caps at 5 hearts total, since this is meant to be a year-long arc, not
  // something maxed out after a handful of good outfits.
  relDelta = Math.min(relDelta, 0.5);
  setHearts(key, (relationships[key] || 0) + relDelta);
  if (currentPrep) resolvePreparation(pieces, key); // fashion result first, danger result second

  // Track this client's best-ever outfit, cards and all, for her profile.
  if (profile.bestScore === null || scoreWithGaps > profile.bestScore) {
    profile.bestScore = scoreWithGaps;
    profile.bestPieces = pieces.map((p) => p.id);
  }

  // Run the normal styling result first, then check the submitted outfit
  // against every undiscovered Aesthetic Achievement recipe. Popups for any
  // matches are shown after the result screen renders (see renderResult()).
  achievementPopupQueue.push(...evaluateAestheticAchievements(pieces));

  discardPile.push(...pieces.map((p) => p.id));
  deckPile.push(...hand);
  hand = [];

  const wantResults = [
    ...wantList.map((r) => ({ label: r.label, matched: pieces.some((p) => reqMatches(r, p)) })),
    ...actionExclusions.map((x) => {
      const broke = pieces.some((pc) => actionViolations(pc).includes(x.label));
      return { label: x.label, matched: !broke, text: broke ? `Ignored \u201C${x.label}\u201D` : `Respected \u201C${x.label}\u201D` };
    }),
  ];

  const breakdown = {
    briefScore, briefCapped, rarityBonus, comboBonus, eventBonus, activeEvent, welcomeBonus, gaps, pieceDetails,
    preferenceBonus, preferencePointValue, preferenceCapped, matchedPreferences, newlyDiscovered,
    playerChoice: !!currentBrief.playerChoice,
    comboName: client.combo && comboBonus > 0 ? client.combo.colors.join(" + ") : null,
    comboNewlyDiscovered, setNewlyDiscovered, setBonusCard, setBonusId, setPiecesUsed, bestPiece,
  };

  // Bible: the first time Holly is dressed in armour, she reacts (stage 17).
  resultStageLines = null;
  if (key === 3 && pieces.some((pc) => pc.style === "Armour" || pc.style2 === "Armour")) {
    ensureStudioHistory(3);
    if (!soulProfiles[3].stagesSeen.includes(16) && CLIENT_STAGES[3][16]) {
      soulProfiles[3].stagesSeen.push(16);
      resultStageLines = CLIENT_STAGES[3][16];
    }
  }

  renderResult(client, scoreWithGaps, wantResults, relDelta, moonCoinsEarned, breakdown, setBonusName);
  if (heartsEarned(key) >= FRIENDSHIP_GIFT_HEARTS && FRIENDSHIP_CARDS[key] && !friendshipCardsOwned.includes(FRIENDSHIP_CARDS[key].id)) {
    friendshipCardsOwned.push(FRIENDSHIP_CARDS[key].id);
    rebuildLiveDeckFromUnlocked();
    showFriendshipGift(key);
  }
}
let resultStageLines = null;

// The friendship gift: her lines, then the card, face down, to turn over.

  const card = FRIENDSHIP_CARDS[key];
  const name = CLIENTS[key].name.split(",")[0];
  const overlay = document.createElement("div");

const SET_REPEAT_BONUS = 10;

function renderResult(client, score, wantResults, relDelta, moonCoinsEarned, breakdown, setBonusName) {
  let reaction, headline, tier;
  if (score >= 100) { reaction = "PERFECT"; headline = "Absolutely delighted!"; tier = "perfect"; }
  else if (score >= 70) { reaction = "LOVED IT"; headline = "Delighted."; tier = "loved"; }
  else if (score >= 35) { reaction = "MEH"; headline = "It'll do."; tier = "meh"; }
  else { reaction = "OUCH"; headline = "Not it."; tier = "ouch"; }
  const name = client.name.split(",")[0];
  const NEUTRAL_REACTIONS = {
    perfect: "{name} studies the mirror for a long moment and can't find a single thing to change.",
    loved: "{name} checks the mirror once. Once is enough.",
    meh: "{name} looks at the mirror, then at you. It'll do.",
    ouch: "{name} looks at the mirror and says nothing. Which says plenty.",
  };
  const own = (REACTION_LINES[currentClientKey()] || {})[tier];
  const lineTemplate = own && own.length ? own[Math.floor(Math.random() * own.length)] : NEUTRAL_REACTIONS[tier];
  const line = lineTemplate.replace(/\{name\}/g, name);

  // Combine heart/coin/set bonus into one compact box instead of three stacked lines.
  const bondLines = [];
  bondLines.push(relDelta > 0
    ? `<span class="bond-line">+${relDelta} with ${client.name.split(",")[0]} ${heartsHTML(relationships[currentClientKey()])}</span>`
    : `No change in your bond with ${client.name.split(",")[0]}.`);
  if (moonCoinsEarned > 0) bondLines.push(`${coins("+" + moonCoinsEarned)} mooncoin${moonCoinsEarned > 1 ? "s" : ""}`);
  if (setBonusName) bondLines.push(`${icon("sparkle")} Full ${setBonusName} worn together`);
  const bondHTML = `<div class="result-box"><h4>Bond &amp; rewards</h4>${bondLines.map((l) => `<p>${l}</p>`).join("")}</div>`;

  // Aggregate breakdown — always shown, so the math is never a mystery.
  const briefLabel = breakdown.briefCapped ? "Brief match (capped)" : "Brief match";
  const preferenceRows = breakdown.playerChoice
    ? [{
        label: breakdown.preferenceCapped
          ? `Hidden preferences matched (${breakdown.matchedPreferences.length}, capped)`
          : `Hidden preferences matched (${breakdown.matchedPreferences.length})`,
        value: breakdown.preferenceBonus,
      }]
    : breakdown.matchedPreferences.map((rule) => ({ label: `Loves ${preferenceLabel(rule).toLowerCase()}`, value: breakdown.preferencePointValue }));
  const breakdownRows = [
    breakdown.playerChoice ? null : { label: briefLabel, value: breakdown.briefScore },
    breakdown.rarityBonus > 0 ? { label: "Rarity bonus", value: breakdown.rarityBonus } : null,
    ...preferenceRows,
    breakdown.comboBonus > 0 ? { label: `${breakdown.comboName} combo`, value: breakdown.comboBonus } : null,
    breakdown.eventBonus > 0 ? { label: `${EVENT_LABELS[breakdown.activeEvent]} bonus`, value: breakdown.eventBonus } : null,
    breakdown.welcomeBonus > 0 ? { label: "New stylist grace", value: breakdown.welcomeBonus } : null,
    ...breakdown.gaps.map((g) => {
      const times = parseInt((g.split("×")[1] || "1"), 10);
      return { label: g, value: g.startsWith("Ignored") ? -ACTION_EXCLUDE_PENALTY * times : g.startsWith("Sobbing") ? -SOBBING_PER_PIECE * times : -10 };
    }),
  ].filter(Boolean);

  const breakdownHTML = `
    <div class="result-box">
      <h4>Score breakdown</h4>
      ${breakdownRows.map((r) => `<div class="score-row"><span>${r.label}</span><span>${r.value >= 0 ? "+" : ""}${r.value}</span></div>`).join("")}
      <div class="score-row total"><span>Total</span><span>${score}</span></div>
    </div>
  `;

  // Per-item detail — exactly what each worn piece did or didn't do, and why.
  const itemRows = breakdown.pieceDetails.map((d) => {
    const bits = [];
    if (d.matchedAttrs.length > 0) {
      bits.push(d.matchedAttrs.map((r) => r.label.toLowerCase()).join(", ") + ` (+${d.briefPts})`);
    }
    if (d.rarityPts > 0) bits.push(`${d.piece.rarity} (+${d.rarityPts})`);
    const verdict = d.broken
      ? `broke ${d.broken.map((l) => `\u201C${l}\u201D`).join(", ")} (${d.penalty})`
      : bits.length > 0 ? bits.join(" · ") : "no match, no bonus";
    return `<p><b>${d.piece.name}</b><br>${verdict}</p>`;
  }).join("");
  const bestId = breakdown.bestPiece ? breakdown.bestPiece.id : null;
  const piecesRowHTML = breakdown.pieceDetails.length > 0 ? `
    <section class="result-pieces">
      <h4>How each piece performed</h4>
      <div class="result-piece-row">
        ${breakdown.pieceDetails.map((d) => {
          const pts = d.broken ? d.penalty : d.briefPts + d.rarityPts;
          const best = d.piece.id === bestId;
          return `
            <figure class="result-piece${best ? " is-best" : ""}" title="${d.piece.name}">
              ${best ? `<figcaption class="best-label">${icon("sparkle")} Best piece</figcaption>` : ""}
              <div class="result-piece-card">
                ${gcardHTML(d.piece)}
                <span class="piece-pts">${pts > 0 ? "+" : ""}${pts}</span>
              </div>
            </figure>`;
        }).join("")}
      </div>
    </section>` : "";
  const itemHTML = `<div class="result-box"><h4>How each piece performed</h4>${itemRows}</div>`;

  const bestPieceHTML = breakdown.bestPiece
    ? `
    <div class="result-box best-piece-box">
      <h4>Best performing piece</h4>
      <div class="new-card-item" style="width:80px; margin:4px auto 6px;">${gcardHTML(breakdown.bestPiece)}</div>
      <p style="text-align:center;">${breakdown.bestPiece.name}</p>
    </div>
  `
    : "";

  const wantHTML = breakdown.playerChoice
    ? `<div class="result-box"><h4>The brief</h4><p>No hard ask this time — she wanted your judgment. Scored from the hidden preferences your outfit represented.</p></div>`
    : `
    <div class="result-box">
      <h4>The brief</h4>
      ${wantResults.map((w) => `<p class="want-result ${w.matched ? "hit" : "miss"}">${icon(w.matched ? "check" : "close")} ${w.text || `${w.matched ? "Loved" : "Missed"} ${w.label.toLowerCase()}`}</p>`).join("")}
    </div>
  `;

  // Per the doc's discovery rule: the first time a worn piece matches one of
  // her hidden preferences, it's called out and permanently joins her
  // profile (see openSouls()) — never shown again as "new" after that.
  const discoveryItems = [
    ...breakdown.newlyDiscovered.map((rule) => `${client.name.split(",")[0]} likes ${preferenceLabel(rule).toLowerCase()}.`),
    ...(breakdown.comboNewlyDiscovered ? [`${client.name.split(",")[0]} loves ${breakdown.comboName} worn together.`] : []),
  ];
  const discoveryHTML = discoveryItems.length > 0
    ? `
    <div class="result-box discovery-box">
      <h4>New preference${discoveryItems.length > 1 ? "s" : ""} discovered</h4>
      ${discoveryItems.map((line) => `<p>${icon("sparkle")} ${line}</p>`).join("")}
    </div>
  `
    : "";


  const firstName = client.name.split(",")[0];
  stage.innerHTML = `
    <div class="result-scene result">
      <div class="result-top">
        <div class="portrait-col">${client.portrait ? `<div class="portrait"><img src="${client.portrait}" alt="${firstName}"></div>` : ""}</div>
        <div class="result-hero">
          <div class="reaction">${reaction.charAt(0) + reaction.slice(1).toLowerCase()}${score >= 100 ? ` ${icon("sparkle")}` : ""}</div>
          <h2>${headline}</h2>

function setOwnedCount(setId) {
  const setCards = DECK.filter((c) => c.set === setId);
  const owned = setCards.filter((c) => unlockedCardIds.has(c.id));
  return { owned: owned.length, total: setCards.length };
}

// Fanned row of cards for the discovery moments. Cards spread from the
// middle, each tilted a little further out, with the reward card (if any)
// set apart and lit.
function fanRowHTML(cards, rewardCard) {
  const n = cards.length;
  const items = cards.map((c, i) => {
    const off = i - (n - 1) / 2;
    return `<div class="moment-card" style="--r:${(off * 6).toFixed(1)}deg; --y:${(Math.abs(off) * 10).toFixed(0)}px; --d:${(0.25 + i * 0.08).toFixed(2)}s">${gcardHTML(c)}</div>`;
  }).join("");
  const reward = rewardCard
    ? `<div class="moment-reward" style="--d:${(0.35 + n * 0.08).toFixed(2)}s"><span class="moment-reward-label">${icon("sparkle")} New for your closet</span><div class="moment-card is-reward">${gcardHTML(rewardCard)}</div></div>`
    : "";
  return `<div class="moment-fan">${items}</div>${reward}`;
}

function showSetDiscoveryPopup(setName, setId, piecesUsed, rewardCard) {
  const { owned, total } = setOwnedCount(setId);
  const overlay = document.createElement("div");
  overlay.className = "set-discovery-overlay moment-overlay";
  overlay.innerHTML = `
    <div class="moment" role="dialog" aria-label="Set discovered">
      <div class="moment-glow" aria-hidden="true"></div>
      <div class="moment-badge">${icon("sparkle")} Set discovered</div>
      <h2 class="moment-title">${titleCase(setName)}</h2>
      <p class="moment-sub">${owned} of ${total} pieces in your closet · +20 to this outfit</p>
      <div class="moment-cards">${fanRowHTML(piecesUsed, rewardCard)}</div>
      <button class="primary" onclick="closeSetDiscoveryOverlay(this)">Wonderful</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

// Closing the set-discovery popup is the hand-off point into the achievement
// popup queue, so the two never stack on top of each other.
function closeSetDiscoveryOverlay(btn) {
  const overlay = btn.closest(".set-discovery-overlay");
  if (overlay) overlay.remove();
  showNextAchievementPopup();
}

// Shows the next queued achievement discovery, one at a time — per the doc,
// several new achievements from one outfit are shown sequentially. Persists
// the discovery only when its popup is actually confirmed.
function showNextAchievementPopup() {
  if (achievementPopupQueue.length === 0) return;
  const id = achievementPopupQueue.shift();
  if (discoveredAestheticAchievements.has(id)) { showNextAchievementPopup(); return; }
  const ach = AESTHETIC_ACHIEVEMENTS.find((a) => a.id === id);
  if (!ach) { showNextAchievementPopup(); return; }
  discoveredAestheticAchievements.add(id);

  const overlay = document.createElement("div");
  overlay.className = "set-discovery-overlay moment-overlay";
  const reqsHTML = ach.requirementsText.map((r) => `<li>${icon("check")}<span>${r}</span></li>`).join("");
  const worn = outfit.filter(Boolean);
  overlay.innerHTML = `
    <div class="moment" role="dialog" aria-label="Achievement discovered">
      <div class="moment-glow" aria-hidden="true"></div>
      <div class="moment-badge">${icon("sparkle")} Aesthetic discovered</div>
      <h2 class="moment-title">${titleCase(ach.name)}</h2>
      <p class="moment-lore">\u201C${ach.lore}\u201D</p>
      ${worn.length > 0 ? `<div class="moment-cards">${fanRowHTML(worn, null)}</div>` : ""}
      <ul class="moment-reqs">${reqsHTML}</ul>
      <button class="primary" onclick="this.closest('.set-discovery-overlay').remove(); showNextAchievementPopup();">Continue</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

// Seasonal calendar — exact story-screen text from the narrative bible.
// Only the "peak" festival months carry a scoring bonus; the "coming soon"
// screens are pure atmosphere, matching the bible's "mystery first, often
// zero story screens" guardrail.
// 36 jobs/year, 3 per month, per the bible. clientRoundIndex is the absolute
// job counter (0-35); month and position-within-month are both derived from it.
function currentMonthIndex() { return Math.floor(clientRoundIndex / 3) % 12; }
function positionInMonth() { return clientRoundIndex % 3; }

// Scheduled per (month, position-in-month) so a month with 3 jobs can carry
// more than one beat — e.g. December gets Winter Solstice mid-month and Dead
// Day at its close, matching the bible's actual chronology.




// Event attribute bonuses — only on the peak festival month, and only when
// a worn piece already matches, per the bible's "compatible with the ask" rule.



function currentMonthEvent() { return EVENT_SCHEDULE[`${currentMonthIndex()}-${positionInMonth()}`] || null; }

function renderStoryScreen(key, onContinue) {
  const screen = EVENT_SCREENS[key];
  const linesHTML = screen.lines.map((l, i) => `<p style="--d:${(i * 0.55).toFixed(2)}s">${l}</p>`).join("");
  stage.innerHTML = `
    <div class="story-screen">
      <div class="story-lines">${linesHTML}</div>
      <button class="primary" style="--d:${(screen.lines.length * 0.55 + 0.3).toFixed(2)}s" onclick="${onContinue}">${screen.button}</button>
    </div>
  `;
  updateTopBar("", true);
}

let lastEventKey = null; // which EVENT_SCHEDULE key (if any) just resolved -- read once by afterEventContinue()

function advanceMonth() {
  const completedJob = clientRoundIndex;
  const eventKey = (completedJob === 0 && currentYear === 1) ? "firstDay" : EVENT_SCHEDULE[`${currentMonthIndex()}-${positionInMonth()}`];
  lastEventKey = eventKey;
  clientRoundIndex += 1;
  pendingSeasonEnd = SEASON_END_JOBS.includes(completedJob);
  if (eventKey) {
    renderStoryScreen(eventKey, "afterEventContinue()");
  } else if (!storyFlags.armourSightingSeen && currentYear === 1 && currentMonthIndex() >= 9) {
    // Bible "Year One Armor reveal": on the way home, autumn of Year One.
    storyFlags.armourSightingSeen = true;
    stage.innerHTML = `
      <div class="center-col screen-pad">
        <div class="soul-name">On the way home</div>
        ${sceneHTML(ARMOUR_SIGHTING_LINES, null)}
        <button class="primary" style="margin-top:14px;" onclick="afterEventContinue()">Continue</button>
      </div>
    `;
    updateTopBar("", true);
  } else {
    afterEventContinue();
  }
}

function afterEventContinue() {
  const justFinishedEvent = lastEventKey;
  lastEventKey = null;

  if (justFinishedEvent === "summerSolstice" && currentYear === 2 && !valerySolsticeCompleted) {
    if (!metValery) metValery = true; // VALERY_FIRST_EXIT runs implicitly if somehow not yet met, per spec
    renderValerySolsticeInvitation();
    return;
  }

  if (pendingSeasonEnd) {
    pendingSeasonEnd = false;
    const newCards = unlockRandomCards(CARDS_PER_SEASON_UNLOCK);
    rebuildLiveDeckFromUnlocked();
    deckPile.push(...newCards.map((c) => c.id));
    renderNewCardsScreen(newCards);
    return;
  }
  if (clientRoundIndex >= 36) { renderEnd(); return; }
  renderMap();
}

function flipNewCard(i) {
  const el = document.getElementById(`flip-${i}`);
  if (el) el.classList.toggle("flipped");
}

function afterSeasonReveal() {
  if (clientRoundIndex >= 36) { renderEnd(); return; }
  renderMap();

function renderEnd() {
  // Reward: one new piece for every 3 "Delighted" outcomes this year, drawn
  // from real still-uncollected wardrobe cards (same pool unlockRandomCards()
  // uses for the quarterly unlocks). Granted once per year: reloading on
  // this screen shows the same reward instead of paying it out again.
  if (yearEndReward.year !== currentYear) {
    const stillLocked = DECK.filter((c) => !unobtainableIds().has(c.id)).length;
    const rewardCount = Math.min(Math.floor(delightedCount / 3), stillLocked);
    yearEndReward = { year: currentYear, ids: unlockRandomCards(rewardCount).map((c) => c.id) };
    rebuildLiveDeckFromUnlocked();
  }
  const earned = yearEndReward.ids.map((id) => DECK.find((c) => c.id === id)).filter(Boolean);

  // No renderMap() call happens on this screen until the player continues,
  // so checkpoint here too (continueGame() comes back to this screen).
  saveGame();

  const text = YEAR_END_TEXT[currentYear] || YEAR_END_TEXT[LAST_YEAR];
  const isLastYear = currentYear >= LAST_YEAR;
  const nextYearWord = { 1: "Two", 2: "Three" }[currentYear];
  const buttonsHTML = isLastYear
    ? `<button class="ghost" onclick="renderIntro()">Back to the title</button>`
    : `<button class="primary" onclick="enterNextYear()">Begin Year ${nextYearWord}</button>`;

  const soulsHTML = CLIENTS.map((c, i) => `
    <div class="year-soul">
      <span class="soul-thumb" style="background-image:url('${c.portrait}')"></span>
      <span class="year-soul-name">${c.name.split(",")[0]}</span>
      ${coreIsDead(i) ? `<span class="soul-row-note">Deceased</span>` : `<span class="hearts">${heartsHTML(relationships[i] || 0)}</span>`}
    </div>`).join("");
  const storyHTML = text.lines.map((l, i) => `<p style="--d:${(i * 0.5).toFixed(2)}s">${l}</p>`).join("");
  const after = (text.lines.length * 0.5 + 0.3).toFixed(2);

  stage.innerHTML = `
    <div class="story-screen year-end">
      <div class="year-end-title">${text.heading}</div>
      <div class="story-lines">${storyHTML}</div>
      <div class="year-end-panel" style="--d:${after}s">
        <div class="year-stats">
          <div><span class="year-stat-num">${delightedCount}</span><span class="year-stat-label">delighted clients</span></div>
          <div><span class="year-stat-num">${Math.round(totalScore)}</span><span class="year-stat-label">total score</span></div>
        </div>
        <div class="year-souls">${soulsHTML}</div>
        ${earned.length > 0
          ? `<p class="year-reward">${icon("sparkle")} Word got around. ${earned.length} new piece${earned.length > 1 ? "s" : ""} joined your closet: ${earned.map((c) => c.name).join(", ")}.</p>`
          : `<p class="year-reward muted">Delight three clients to earn a new piece at year's end.</p>`}
        ${isLastYear ? `<p class="year-closing">To be continued.</p>` : ""}
        <div class="q-result-actions">${buttonsHTML}</div>
      </div>
    </div>
  `;
}

// Year N -> N+1 (Characters spec §17). A CONTINUATION of the same run, not a
// call into beginGame(): collection, Moon Coins, hearts, deaths, grief,
// discovered facts, keys, unlocked locations and every story flag survive.
// Only the yearly counters reset. Dead stay dead; hearts are not refilled.
function enterNextYear() {
  currentYear += 1;
  clientRoundIndex = 0;
  totalScore = 0;
  delightedCount = 0;
  pendingSeasonEnd = false;
  currentShopItem = null;
  shopStockMonth = null;
  storyBeatsRemaining = STORY_BEATS_PER_JOB;
  Object.keys(soulProfiles).forEach((key) => { soulProfiles[key].yearVisits = 0; });
  // Pick up any cards earned as the year-end reward so they're drawable
  // from the very first Studio visit of the new year.
  rebuildLiveDeckFromUnlocked();
  saveGame();
  if (currentYear === 3) { renderStoryScreen("yearThreeOpening", "renderMap()"); return; }
  renderMap();
}

const DEV_RUMOUR_MONTHS = { r1: 2, r2: 3, r3: 4, r4: 5, r5: 6, r6: 7, r7: 8, r8: 9, arrival: 10, r9: 11 };
function devQuickStart() {
  const year = parseInt(document.getElementById("qsYear").value, 10);
  const month = parseInt(document.getElementById("qsMonth").value, 10);
  const hearts = parseFloat(document.getElementById("qsHearts").value);
  const cards = document.getElementById("qsCards").value;
  clearSavedGame();
  moonCoins = 30;
  discoveredAestheticAchievements = new Set();
  beginGame(); // fresh state (its intro screen is replaced below)

  currentYear = year;
  clientRoundIndex = month * 3;
  storyBeatsRemaining = STORY_BEATS_PER_JOB;
  const jobsBefore = (year - 1) * 36 + month * 3;

  // Collection
  let n = 0;
  DECK.forEach((c) => {
    const keep = cards === "all" || c.rarity === "Basic" || c.rarity === "Uncommon" || (c.rarity === "Rare" && n++ % 2 === 0);
    if (keep && jobsBefore > 0) unlockedCardIds.add(c.id);
  });
  rebuildLiveDeckFromUnlocked();
  deckPile = liveDeck.map((c) => c.id);

  // People: met, and the Castle open
  if (jobsBefore > 0) {
    metMaya = metHelena = metJuliette = metOctavia = metValery = true;
    castleGateCharactersUnlocked = true;
    restrictedPhase = { castle: 4, garden: 4 };
    storyFlags.actionCardMet = true;
  }

  // The Core Four: visits, talks and briefs up to this date
  CLIENTS.forEach((c, k) => {
    const p = soulProfiles[k];
    p.visits = Math.floor(jobsBefore / 4);
    p.yearVisits = Math.floor((month * 3) / 4);
    const talks = year >= 3 ? 20 : Math.min(20, Math.max(0, p.visits - 1));
    p.stagesSeen = [...Array(talks).keys()];
    p.briefsHeard = year >= 2
      ? [...CLIENTS[k].briefs.map((b, i) => i), ...(year >= 3 ? (YEAR_TWO_BRIEFS[k] || []).map((b, i) => `y2-${i}`) : [])]
      : CLIENTS[k].briefs.map((b, i) => i).slice(0, Math.max(0, p.visits - 1));
    if (jobsBefore > 0) setHearts(k, hearts);
  });

  // Angels: every beat whose month has passed
  const passed = (id) => year >= 3 || (year === 2 && DEV_RUMOUR_MONTHS[id] < month);
  peril.rumoursSeen = ANGEL_RUMOURS.map((r) => r.id).filter(passed);
  if (peril.rumoursSeen.length) peril.angelIntroStage = 1;
  if (peril.rumoursSeen.includes("r8")) { peril.angelEncountersDone.push("e1"); peril.angelIntroStage = 2; peril.heartsAreLifeShown = true; peril.prepsYearTwo = 1; }
  if (peril.rumoursSeen.includes("arrival")) { peril.angelIntroStage = 3; peril.arrivalJob = -1; }
  if (year >= 3) {
    peril.angelEncountersDone = ["e1", "e2", "e3", "e4"];
    peril.prepsYearTwo = 4;
    peril.angelStudioJobsDone = ["a1"];
  }

  clearTimeout(introTimer); // beginGame()'s intro sequence must not carry on
  saveGame();
  renderMap();
}

      ${rows}
    </div>
    <div class="dev-section">
      <div class="dev-label">Angel rumours</div>
      <p class="dev-note">${devRumourStatus()}</p>
      <p class="dev-note">Preparations played: ${peril.angelEncountersDone.join(", ") || "none"}. Next Studio visit (${coreFirstName(currentClientKey())}): ${(preparationFor(currentClientKey()) || {}).id || "no preparation"}${prepDone("e1") ? "" : " (E1 comes through R8)"}.</p>
      <div class="dev-row"><button class="dev-btn" onclick="peril.lastPrepJob = -99; renderDevPanel()">Allow a preparation now</button></div>
      <p class="dev-note">Grief: ${peril.deathOrder.length ? CLIENTS.map((c, k) => coreIsDead(k) ? "" : `${coreFirstName(k)} ${peril.deathOrder.map((d) => `${coreFirstName(d)} ${griefProgressOf(k, d)}/${GRIEF_VISITS}`).join(", ")}`).filter(Boolean).join(" \u00B7 ") : "nobody has died"}.</p>
      <p class="dev-note">Angel jobs played: ${peril.angelStudioJobsDone.join(", ") || "none"}. Next Studio visit: ${(angelJobDue() || {}).id || "no Angel job"}${angelsMet() ? "" : " (not met yet)"}.</p>
      <div class="dev-row"><button class="dev-btn" onclick="peril.lastAngelJob = -99; if (peril.arrivalJob !== null) peril.arrivalJob = -99; renderDevPanel()">Allow an Angel job now</button></div>
      <div class="dev-row">
        <button class="dev-btn" onclick="devRumourMonth()">Allow another this month</button>
        <button class="dev-btn" onclick="devRumourSkip()">Skip the next one</button>
      </div>
    </div>
    <div class="dev-section">
      <div class="dev-label">Collection</div>
      <div class="dev-row">
        <button class="dev-btn" onclick="devGrantAll()">Own every card</button>
        <button class="dev-btn" onclick="devCoins()">+50 mooncoins</button>
      </div>
      <p class="dev-note">${unlockedCardIds.size} owned, ${destroyedCardIds.size} destroyed, ${moonCoins} mooncoins.</p>
    </div>`;
}
function devRumourStatus() {
  const r = ANGEL_RUMOURS.find((x) => !peril.rumoursSeen.includes(x.id));
  const seen = peril.rumoursSeen.length ? peril.rumoursSeen.join(", ") : "none";
  if (!r) return `Seen: ${seen}. All played.`;
  const where = r.client !== undefined ? `Studio, on ${coreFirstName(r.client)}'s visit` : { oldquarter: "Old Quarter, Look around", cafe: "Night Café (Maya)", castle: "Night Castle (Helena)", "studio-arrival": "Studio, before the client" }[r.where];
  const dueNow = nextRumour() === r;
  return `Seen: ${seen}. Next: ${r.id} at ${where}${dueNow ? " (due now)" : " (not yet: " + (peril.rumourMonth === yearMonthKey() ? "one already this month" : "too early") + ")"}.`;
}
function devRumourMonth() { peril.rumourMonth = null; renderMap(); renderDevPanel(); }
function devRumourSkip() {
  const r = ANGEL_RUMOURS.find((x) => !peril.rumoursSeen.includes(x.id));
  if (r) { markRumourSeen(r); peril.rumourMonth = null; }
  saveGame(); renderMap(); renderDevPanel();
}
function devJump() {
  const y = parseInt(document.getElementById("devYear").value, 10);
  const m = parseInt(document.getElementById("devMonth").value, 10);
  currentYear = y;
  clientRoundIndex = m * 3;
  pendingSeasonEnd = false;
  storyBeatsRemaining = STORY_BEATS_PER_JOB;
  shopStockMonth = null;
  renderMap();
  renderDevPanel();
}
function devHearts(k, d) { setHearts(k, (relationships[k] || 0) + d); saveGame(); renderDevPanel(); }
function devKill(k) {
  toggleDevPanel();
  killCoreCharacter(k);
  renderDeathScreen(k, "renderMap()");
}
// Test only -- the game itself never revives anyone.
function devRevive(k) {
  delete peril.dead[k];
  peril.deathOrder = peril.deathOrder.filter((x) => x !== k);
  setHearts(k, 1);
  saveGame();
  renderMap();
  renderDevPanel();
}
function devGrantAll() {
  DECK.forEach((c) => { if (!destroyedCardIds.has(c.id)) unlockedCardIds.add(c.id); });
  rebuildLiveDeckFromUnlocked();
  saveGame();
  renderDevPanel();
}
function devCoins() { moonCoins += 50; saveGame(); renderDevPanel(); updateTopBar("", true); }
document.addEventListener("keydown", (e) => {
  if (!DEV_TOOLS || e.code !== "Backquote") return;
  const t = e.target;
  if (t && t.matches && t.matches("input, textarea, select")) return;
  e.preventDefault();
  toggleDevPanel();
});

renderIntro();
</script>

</body>
</html>
