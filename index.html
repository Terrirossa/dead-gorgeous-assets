function lockedTile(key) {
  const phases = RESTRICTED_PHASES[key];
  const idx = Math.min(restrictedPhase[key], phases.length - 1);
  mapMessage = phases[idx];
  restrictedPhase[key] = idx + 1;
  const msg = document.querySelector(".map-message");
  msg.textContent = mapMessage;
  msg.classList.remove("show"); void msg.offsetWidth; msg.classList.add("show");
}


const JOKER_PRICE = 10;

// A monthly shelf of three pieces -- one Uncommon, one Rare, one Iconic or
// Legendary -- priced by rarity, so mooncoins always have something to go on
// and choosing what to buy is a real decision.
const SHOP_PRICES = { Basic: 2, Uncommon: 4, Rare: 8, Iconic: 14, Legendary: 20 };
const SHOP_SLOTS = [["Uncommon"], ["Rare"], ["Iconic", "Legendary"]];
let shopStock = [];
let shopStockMonth = null;
function refreshShopStock() {
  const ym = yearMonthKey();
  if (shopStockMonth === ym) { shopStock = shopStock.filter((id) => !unlockedCardIds.has(id)); return; }
  shopStockMonth = ym;
  const owned = unobtainableIds();
  shopStock = SHOP_SLOTS.map((rarities) => {
    const pool = DECK.filter((c) => rarities.includes(c.rarity) && !owned.has(c.id));
    return pool.length ? weightedSample(pool, 1)[0].id : null;
  }).filter((id) => id !== null);
}
function buyShopCard(id) {
  const card = DECK.find((c) => c.id === id);
  const price = SHOP_PRICES[card.rarity] || 8;
  if (!card || moonCoins < price || unlockedCardIds.has(id)) return;
  moonCoins -= price;
  unlockedCardIds.add(id);
  rebuildLiveDeckFromUnlocked();
  shopStock = shopStock.filter((x) => x !== id);
  renderCardAcquiredScreen("Sold.", card, "Back to the map", false);
}

function pickShopItem() {
  const ownedIds = unobtainableIds();
  const pool = DECK.filter((c) => SHOP_RARITIES.includes(c.rarity) && !ownedIds.has(c.id));
  if (pool.length === 0) return null;
  return weightedSample(pool, 1)[0];
}

// Earliest the Unusual Key can appear: Year 1 Summer (June) onward, per the
// Items/Keys spec — and once eligible, it stays eligible (Year 2 is always
// past this point too, regardless of the in-year month).
function unusualKeyEligible() {
  return currentYear >= 2 || currentMonthIndex() >= 5;
}

const UNUSUAL_KEY_PRICE = 10;

// ---- Burning cards at the Vendor ----
let burnSelection = [];
function burnableCards() {
  return liveDeck.filter((c) => DECK.some((d) => d.id === c.id) && unlockedCardIds.has(c.id));
}
function renderBurnScreen() {
  const cards = burnableCards();
  const maxBurn = Math.max(0, Math.min(5, unlockedCardIds.size - BURN_MIN_COLLECTION));
  burnSelection = burnSelection.filter((id) => cards.some((c) => c.id === id));
  const n = burnSelection.length;
  const reward = n > 0 ? BURN_REWARDS[n - 1] : 0;
  const ladder = BURN_REWARDS.map((r, i) => `<span class="burn-step ${n === i + 1 ? "on" : ""}"><b>${i + 1}</b>${r > 0 ? coins(r) : "nothing"}</span>`).join("");
  stage.innerHTML = `
    <div class="center-col screen-pad q-pick-screen burn-screen">

      ${dialogueLineHTML({ who: "VENDOR", t: BURN_VENDOR_LINES.open }, "The Vendor")}
      <p class="q-entry-sub">Choose up to five cards to burn. They're gone for good. You keep at least ${BURN_MIN_COLLECTION} cards.</p>
      <div class="burn-ladder">${ladder}</div>
      ${maxBurn === 0 ? `<p class="q-entry-sub">Your closet is too small to burn anything.</p>` : ""}
      <div class="q-pick-grid">${cards.map((c) => {
        const sel = burnSelection.includes(c.id);
        const disabled = !sel && n >= maxBurn;
        return `<button class="q-pick ${sel ? "selected burn-selected" : ""} ${disabled ? "disabled" : ""}" onclick="toggleBurn(${c.id})" aria-pressed="${sel}">${gcardLazyHTML(c)}</button>`;
      }).join("")}</div>
    </div>
    <div class="q-pick-bar">
      <button class="ghost" onclick="burnSelection = []; renderShop();">Back</button>
      <div class="q-pick-count"><b>${n}</b> of 5 · ${reward > 0 ? coins(reward) : "nothing"}</div>
      <button class="primary" ${n > 0 ? "" : "disabled"} onclick="confirmBurn()">${n > 0 ? `Burn ${n}` : "Choose cards"}</button>

}
function toggleBurn(id) {
  const maxBurn = Math.max(0, Math.min(5, unlockedCardIds.size - BURN_MIN_COLLECTION));
  if (burnSelection.includes(id)) burnSelection = burnSelection.filter((x) => x !== id);
  else if (burnSelection.length < maxBurn) burnSelection.push(id);
  renderBurnScreen();
}
// Burning is deliberate: the chosen cards come up large, hold for a moment,
// then burn one after another. The collection changes (and is saved) first,
// so leaving mid-animation can't undo or repeat it.
function confirmBurn() {
  const n = burnSelection.length;
  if (!n) return;
  const reward = BURN_REWARDS[n - 1] || 0;
  const cards = burnSelection.map((id) => DECK.find((c) => c.id === id)).filter(Boolean);
  burnSelection.forEach((id) => destroyWearableCard(id));
  rebuildLiveDeckFromUnlocked();
  moonCoins += reward;
  burnSelection = [];
  saveGame();

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HOLD = reduced ? 300 : 1500;   // cards shown large before the first catches
  const STAGGER = reduced ? 0 : 450;   // next card catches this much later
  const BURN = reduced ? 300 : 1600;   // one card burning away
  stage.innerHTML = `
    <div class="burn-pyre" aria-live="polite">
      <div class="burn-pyre-row">
        ${cards.map((c, i) => `<div class="burn-pyre-card" style="--i:${i}">${gcardHTML(c)}</div>`).join("")}
      </div>
      <p class="burn-pyre-note">${n === 1 ? "One card" : `${n} cards`} into the fire.</p>
    </div>`;
  updateTopBar("", true);
  const els = [...stage.querySelectorAll(".burn-pyre-card")];
  els.forEach((el, i) => setTimeout(() => el.classList.add("burning"), HOLD + i * STAGGER));
  setTimeout(() => {
    stage.innerHTML = `
      <div class="center-col screen-pad reveal-screen">
        <div class="soul-name">Ash</div>
        ${dialogueLineHTML({ who: "VENDOR", t: BURN_VENDOR_LINES.done }, "The Vendor")}
        <p class="q-entry-sub">${n} card${n > 1 ? "s" : ""} burned. ${reward > 0 ? `You get ${coins(reward)} mooncoins.` : "Nothing in return."}</p>
        <button class="primary" onclick="renderShop()">Back to the shop</button>
      </div>`;
    updateTopBar("", true);
  }, HOLD + (els.length - 1) * STAGGER + BURN + 300);
}

// NIGHT CAFÉ — Maya (main room), the Back Room (Unusual Key), and the Attic
// (Maya's hint + Juliette's key). Exact wording from the Aftercity Characters
// & Encounters spec §5, §9, §10, and the Items/Keys Exploration spec §5–6.
// ---------------------------------------------------------------------------

















// Repeat pool once all three fixed Attic discoveries have been seen. Lost
// Property is capped at once per in-game year and excluded from the random
// pick once that year's copy has already been awarded (spec §6.5).


// Earliest Maya can appear: first Café visit in March Year 1 or later.
function mayaEligible() { return currentYear >= 2 || currentMonthIndex() >= 2; }

function mayaAtticHintEligible() {
  return metMaya && !mayaAtticHintGiven && !cafeAtticUnlocked
    && mayaEncounterCount >= 3 && currentYear >= 2 && currentMonthIndex() >= 2;
}

// Shown alongside whatever's currently happening in the main Café room, once
// each sub-location becomes reachable — same "permanent sub-location button"
// idea as Night Castle's future Royal Garden Gate.
function cafeSublocButtonsHTML() {
  const buttons = [];
  buttons.push(`<button class="ghost" onclick="renderQuartettEntry()">Quartett</button>`);
  if (cafeBackRoomUnlocked) buttons.push(`<button class="ghost" onclick="renderCafeBackRoom()">Back Room</button>`);
  else if (cafeBackDoorDiscovered) buttons.push(`<button class="ghost" onclick="renderCafeBackDoorReveal()">Back Door</button>`);
  if (mayaAtticHintGiven) buttons.push(`<button class="ghost" onclick="renderCafeAtticEntry()">Attic</button>`);
  if (buttons.length === 0) return "";
  return `<div class="subloc-row">${buttons.join("")}</div>`;
}

function renderCafeScreen(lines, leaveLabel, leaveAction) {
  stage.innerHTML = `
    <div class="center-col screen-pad">
      ${portraitHTML(lines, "☕", "#3a2f28")}
      <div class="soul-name">Night Café</div>
      ${sceneHTML(lines, null)}
      ${cafeSublocButtonsHTML()}
      <button class="primary" onclick="${leaveAction}">${leaveLabel}</button>
    </div>
  `;
  updateTopBar("", true);
}

// One-time scenes are marked as seen as soon as they are shown (mark...()),
// not when "Leave" is clicked: from the same screen the player can also walk
// off through a side door (Back room, Attic, Glass House...) and must never
// be shown the scene again.
function markMayaFirst() { metMaya = true; mayaEncounterCount += 1; }
function markMayaPhotoReaction() { mayaPhotoReactionSeen = true; }
function markMayaBackRoomReaction() { mayaBackRoomReactionSeen = true; }
function markMayaAtticHint() {
  mayaAtticHintGiven = true;
  julietteCafeKeyHintAvailable = true;
  mayaEncounterCount += 1;
}

// Main-room priority resolver: back-door reveal (must pre-empt everything
// else the very first visit it's eligible) > Maya first meeting > cross-doc
// reactions > Maya's one-time Attic hint > Maya ambient (monthly cap) >
// existing generic Café flavor as the final fallback.
// The next Night Café encounter with one of the Core Four (bible, verbatim),
// at most one per month, taking turns so no one hogs the café.
function nextCoreCafeEncounter() {
  if (storyFlags.coreCafeMonth === yearMonthKey()) return null;
  const seen = storyFlags.coreCafeSeen || {};
  const start = currentMonthIndex() % 4;
  for (let n = 0; n < 4; n++) {
    const k = (start + n) % 4;
    const list = CORE_CAFE_ENCOUNTERS[k] || [];
    const idx = seen[k] || 0;
    const enc = list[idx];
    if (!enc || coreIsDead(k) || sceneShowsDead(enc.lines)) continue;
    if (enc.hearts && heartsEarned(k) < enc.hearts) continue;
    if (enc.season && !enc.season.includes(currentSeasonName())) continue;
    if (enc.after && !enc.after.every((ref) => { const [ck, ci] = parseStageRef(ref, k); return stageWasSeen(ck, ci); })) continue;
    return { key: k, idx, lines: enc.lines };
  }
  return null;
}
function playCoreCafeEncounter() {
  const enc = nextCoreCafeEncounter();
  if (!enc) { renderMap(); return; }
  storyFlags.coreCafeSeen = storyFlags.coreCafeSeen || {};
  storyFlags.coreCafeSeen[enc.key] = enc.idx + 1;
  storyFlags.coreCafeMonth = yearMonthKey();
  renderCafeScreen(enc.lines, "Leave", "renderMap()");
}

function buildCafeEvents() {
  const ym = yearMonthKey();
  const rumour = metMaya ? rumourAt("cafe") : null; // the café beats are Maya's
  const toMourn = metMaya ? peril.deathOrder.find((k) => !peril.mourned.includes(k)) : undefined;
  return [
    ...(rumour ? [{
      lines: rumour.lines, eligible: () => true,
      run: () => { markRumourSeen(rumour); renderCafeScreen(rumour.lines, "Leave", "renderMap()"); },
    }] : []),
    ...(toMourn !== undefined ? [{
      // The first café visit after a death (DRAFT, CAFE_MOURNING).
      eligible: () => true,
      run: () => { peril.mourned.push(toMourn); renderCafeScreen(CAFE_MOURNING[toMourn], "Leave", "renderMap()"); },
    }] : []),
    {
      // Bible: the four of them at one table, late in the year (Dead Day).
      lines: CAFE_DEAD_DAY_GROUP_LINES,
      eligible: () => !storyFlags.cafeDeadDaySeen && currentMonthIndex() === 11,
      run: () => { storyFlags.cafeDeadDaySeen = true; renderCafeScreen(CAFE_DEAD_DAY_GROUP_LINES, "Leave", "renderMap()"); },
    },
    {
      // Bible: Ivy and Holly, the week before the Summer Solstice.
      lines: CAFE_SOLSTICE_GROUP_LINES,
      eligible: () => !storyFlags.cafeSolsticeSeen && currentMonthIndex() === 5 && positionInMonth() < 2,
      run: () => { storyFlags.cafeSolsticeSeen = true; renderCafeScreen(CAFE_SOLSTICE_GROUP_LINES, "Leave", "renderMap()"); },
    },
    { eligible: () => !!nextCoreCafeEncounter(), run: playCoreCafeEncounter },
    {
      // Year 3: Maya's own thread, one a month, in order (DRAFT, MAYA_Y3_CAFE).
      eligible: () => metMaya && currentYear >= 3 && storyFlags.mayaY3Month !== ym && (storyFlags.mayaY3Seen || 0) < MAYA_Y3_CAFE.length,
      run: () => {
        const lines = MAYA_Y3_CAFE[storyFlags.mayaY3Seen || 0];
        storyFlags.mayaY3Seen = (storyFlags.mayaY3Seen || 0) + 1;
        storyFlags.mayaY3Month = ym;
        renderCafeScreen(lines, "Leave", "renderMap()");
      },
    },
    {
      // The bible's Garden Circle café scene (early spring), once you know
      // both of them are in it.
      lines: GARDEN_CIRCLE_CAFE_LINES,
      eligible: () => !storyFlags.gardenCircleCafeSeen && ["spring"].includes(currentSeasonName()) && currentMonthIndex() <= 3 && stageWasSeen(0, 5) && stageWasSeen(1, 7),
      run: () => { storyFlags.gardenCircleCafeSeen = true; renderCafeScreen(GARDEN_CIRCLE_CAFE_LINES, "Leave", "renderMap()"); },
    },
    { eligible: () => hasUnusualKey && !cafeBackDoorDiscovered, run: renderCafeBackDoorReveal },
    {
      eligible: () => !metMaya && mayaEligible(),
      run: () => { renderCafeScreen(MAYA_FIRST_SCENE, "Leave", "renderMap()"); markMayaFirst(); },
    },
    {
      eligible: () => metMaya && hasFadedPhotograph && !mayaPhotoReactionSeen,
      run: () => { renderCafeScreen(MAYA_PHOTO_REACTION, "Leave", "renderMap()"); markMayaPhotoReaction(); },
    },
    {
      eligible: () => metMaya && cafeBackRoomUnlocked && !mayaBackRoomReactionSeen,
      run: () => { renderCafeScreen(MAYA_BACKROOM_REACTION, "Leave", "renderMap()"); markMayaBackRoomReaction(); },
    },
    {
      eligible: mayaAtticHintEligible,
      run: () => { renderCafeScreen(MAYA_ATTIC_HINT_SCENE, "Leave", "renderMap()"); markMayaAtticHint(); },
    },
    {
      eligible: () => !!getFestivalReactionFor("maya", metMaya),
      run: () => {
        const f = getFestivalReactionFor("maya", metMaya);
        markSeasonalReactionSeen("maya", f.eventId);
        renderCafeScreen(f.lines, "Leave", "renderMap()");
      },
    },
    {
      ambient: true, eligible: () => metMaya && mayaLastAmbientYearMonth !== ym,
      run: () => {
        const unseen = MAYA_AMBIENT.map((_, i) => i).filter((i) => !mayaAmbientSeen.includes(i));
        const pool = unseen.length > 0 ? unseen : MAYA_AMBIENT.map((_, i) => i);
        const idx = pool[Math.floor(Math.random() * pool.length)];
        if (!mayaAmbientSeen.includes(idx)) mayaAmbientSeen.push(idx);
        mayaLastAmbientYearMonth = ym;
        mayaEncounterCount += 1;
        renderCafeScreen(MAYA_AMBIENT[idx], "Leave", "renderMap()");
      },
    },
    {
      ambient: true, eligible: () => true,
      run: () => {
        const snippet = nextCafeSnippet();
        renderCafeScreen([{ who: "NARRATION", t: snippet }], "Leave", "renderMap()");
      },
    },
  ];
}

// Draws café flavour lines without repeats until every one has been seen.
let cafeSnippetBag = [];
function nextCafeSnippet() {
  if (cafeSnippetBag.length === 0) cafeSnippetBag = shuffle(CAFE_SNIPPETS.map((_, i) => i));
  return CAFE_SNIPPETS[cafeSnippetBag.pop()];
}

function renderCafe() {
  runFirstEligibleEvent(buildCafeEvents());
}

let cacheOfferedCardIds = [];
let cacheSelectedCardIds = [];

function renderCafeBackRoomCache() {
  if (cacheOfferedCardIds.length === 0) {
    const owned = unobtainableIds();
    const pool = DECK.filter((c) => ["Rare", "Iconic", "Legendary"].includes(c.rarity) && !owned.has(c.id));
    cacheOfferedCardIds = shuffle(pool).slice(0, Math.min(4, pool.length)).map((c) => c.id);
    cacheSelectedCardIds = [];
  }
  const cards = cacheOfferedCardIds.map((id) => DECK.find((c) => c.id === id));
  const itemsHTML = cards.map((c) => {
    const selected = cacheSelectedCardIds.includes(c.id);
    return `
      <div class="deck-item ${selected ? "status-hand" : "status-pool"}" onclick="toggleCacheCard(${c.id})">
        ${gcardHTML(c)}
        <div class="deck-status">${selected ? "Chosen" : "Tap to choose"}</div>
      </div>
    `;
  }).join("");
  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="portrait token">${icon("key")}</div>
      <div class="soul-name">Back Room</div>
      <div class="speech narration-line">The room has no windows.</div>
      <div class="speech narration-line">Shelves cover three walls. Garment boxes are stacked almost to the ceiling.</div>
      <div class="speech narration-line">Four cards have been laid face-up on a small table.</div>
      <div class="speech narration-line">No note. No price.</div>
      <p style="color:var(--muted); font-size:12.5px; margin-bottom:12px;">Choose exactly 2.</p>
      <div class="deck-grid cache-grid">${itemsHTML}</div>
      <button class="primary" style="margin-top:14px;" ${cacheSelectedCardIds.length === 2 ? "" : "disabled"} onclick="confirmCacheChoice()">Take these two</button>
    </div>
  `;
  updateTopBar("", true);
}

function toggleCacheCard(id) {
  if (cacheSelectedCardIds.includes(id)) {
    cacheSelectedCardIds = cacheSelectedCardIds.filter((x) => x !== id);
  } else if (cacheSelectedCardIds.length < 2) {
    cacheSelectedCardIds = [...cacheSelectedCardIds, id];
  }
  renderCafeBackRoomCache();
}

function confirmCacheChoice() {
  if (cacheSelectedCardIds.length !== 2) return;
  cacheSelectedCardIds.forEach((id) => unlockedCardIds.add(id));
  rebuildLiveDeckFromUnlocked();
  hasSilverBell = true;
  cafeBackRoomCacheClaimed = true;
  cacheOfferedCardIds = [];
  cacheSelectedCardIds = [];

/* ===========================================================================
   NIGHT CAFÉ — QUARTETT
   Per DEAD_GORGEOUS_QUARTETT_IMPLEMENTATION_SPEC_FOR_CLAUDE. Casual mode
   only: no card loss, no Moon Coin wager -- winning awards one random card
   the player doesn't already own. Reachable straight from the already-
   rendered Café screen (cafeSublocButtonsHTML), so it never calls visitCafe()
   again and never touches storyBeatsRemaining or Studio progression.
   Capped at 5 sessions per in-game month, tracked against yearMonthKey()
   the same way Maya's ambient-line cooldown is; the cap silently resets the
   moment the key changes. Maya plus the Core Four are the opponent roster;
   each opponent's Quartett hand is drawn from her own themed subset of the
   global DECK (see QUARTETT_OPPONENTS), not from the player's collection.
   =========================================================================== */

// Two matches per season (was five per month, which made Quartett the main
// source of new cards and undercut every other way of earning them).
const QUARTETT_MAX_SESSIONS_PER_SEASON = 2;
const QUARTETT_MAX_SESSIONS_PER_MONTH = QUARTETT_MAX_SESSIONS_PER_SEASON; // legacy name
const QUARTETT_HAND_SIZE = 6;
const QUARTETT_ROUNDS = 5;
const QUARTETT_WIN_TARGET = 3;

// Cards the player has tapped on the pre-match picker screen -- lives
// outside quartettMatch since no match exists yet while picking.
let quartettDraftSelection = [];

// Per-opponent config: portrait, a themed Quartett card pool (a subset of
// the global DECK reflecting that character's taste, per the styling-brief
// hidden-preference tables -- NOT the player's own collection), and a
// handful of authored lines in her established voice. Deliberately sparse
// per spec §19: flavor only, not new biography/lore. Maya plus the Core
// Four are all reachable from the Café without any unlock gate, same as
// they already are as normal styling clients.


// Shared across every opponent -- not authored per-character since it's
// shown before an opponent is even chosen.


function quartettPickLine(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// -- Session cap -------------------------------------------------------------

function quartettRefreshSessionWindow() {
  const ym = currentSeasonKey(); // the window is a season now
  if (quartettSessionsUsedYearMonth !== ym) {
    quartettSessionsUsedYearMonth = ym;
    quartettSessionsUsedCount = 0;
  }
}
function quartettSessionsRemaining() {
  quartettRefreshSessionWindow();
  return Math.max(0, QUARTETT_MAX_SESSIONS_PER_MONTH - quartettSessionsUsedCount);
}

// -- Card pools ---------------------------------------------------------------

// Any card by id, owned or not -- an opponent's hand is never part of the
// player's liveDeck, so the global findCard() (which only searches
// liveDeck) can't be used for opponent cards.
function quartettFindCard(id) { return DECK.find((c) => c.id === id); }

function quartettPlayerEligibleCards() {
  return DECK.filter((c) => unlockedCardIds.has(c.id));
}

// -- Rarity / call evaluation --------------------------------------------------

function quartettRarityIdx(card) { return RARITY_ORDER[card.rarity] ?? 0; }

function quartettCardSatisfies(card, call) {
  switch (call.primaryType) {
    case "color": return card.color === call.primaryValue;
    case "style": return card.style === call.primaryValue; // style1 only, by design
    case "fit": return card.fit === call.primaryValue;
    case "category": return card.category === call.primaryValue;
    default: return false;
  }
}

// Returns "A" (player), "B" (opponent) or "draw" for one round, per spec §5
// steps 6-10.
function quartettEvaluateRound(call, cardA, cardB) {
  if (call.primaryType === "rarityHigh" || call.primaryType === "rarityLow") {
    const ra = quartettRarityIdx(cardA), rb = quartettRarityIdx(cardB);
    if (ra === rb) return "draw";
    const aWins = call.primaryType === "rarityHigh" ? ra > rb : ra < rb;
    return aWins ? "A" : "B";
  }
  if (call.primaryType === "exactRarity") {
    const aSat = cardA.rarity === call.primaryValue;
    const bSat = cardB.rarity === call.primaryValue;
    if (aSat && !bSat) return "A";
    if (bSat && !aSat) return "B";
    return "draw"; // both match, or neither -- table only defines the "both" case
  }

  const aSat = quartettCardSatisfies(cardA, call);
  const bSat = quartettCardSatisfies(cardB, call);
  if (aSat && !bSat) return "A";
  if (bSat && !aSat) return "B";

  // Both satisfy, or neither does -- apply the visible tie-breaker directly
  // to the two cards' rarity either way (spec §5 step 9: apply the
  // tie-breaker "where meaningful").
  const ra = quartettRarityIdx(cardA), rb = quartettRarityIdx(cardB);
  if (ra === rb) return "draw";
  const aWins = call.tieBreaker === "rarityHigh" ? ra > rb : ra < rb;
  return aWins ? "A" : "B";
}

// -- Call generation ------------------------------------------------------------

const QUARTETT_ATTR_TYPES = ["color", "style", "fit"];

function quartettValuesInHands(type, hands) {
  const set = new Set();
  hands.forEach((h) => h.forEach((c) => set.add(c[type])));
  return Array.from(set);
}

function quartettMakeAttrCall(type, hands, forceLowTieBreak) {
  const values = quartettValuesInHands(type, hands);
  if (values.length === 0) return null;
  const value = values[Math.floor(Math.random() * values.length)];
  // Style calls can go either direction "as authored" per the call-library
  // table; color/fit default to higher-rarity-wins.
  const lowTie = forceLowTieBreak || (type === "style" && Math.random() < 0.3);
  return {
    id: `${type}:${value}:${lowTie ? "lo" : "hi"}`,
    primaryType: type,
    primaryValue: value,
    tieBreaker: lowTie ? "rarityLow" : "rarityHigh",
    label: `${value.toUpperCase()} — ${lowTie ? "Lower" : "Higher"} rarity wins ties`,
  };
}

function quartettMakeCategoryCall(hands) {
  const values = quartettValuesInHands("category", hands);
  if (values.length === 0) return null;
  const value = values[Math.floor(Math.random() * values.length)];
  return {
    id: `category:${value}`, primaryType: "category", primaryValue: value, tieBreaker: "rarityHigh",
    label: `${value.toUpperCase()} — Higher rarity wins ties`,
  };
}

function quartettMakeRarityCall(hands) {
  const roll = Math.random();
  if (roll < 0.4) return { id: "rarityHigh", primaryType: "rarityHigh", primaryValue: null, tieBreaker: null, label: "HIGHEST RARITY — same rarity is a Draw" };
  if (roll < 0.8) return { id: "rarityLow", primaryType: "rarityLow", primaryValue: null, tieBreaker: null, label: "LOWEST RARITY — same rarity is a Draw" };
  const values = quartettValuesInHands("rarity", hands);
  const value = values.length > 0 ? values[Math.floor(Math.random() * values.length)] : "Basic";
  return { id: `exactRarity:${value}`, primaryType: "exactRarity", primaryValue: value, tieBreaker: null, label: `EXACTLY ${value.toUpperCase()} — matching either or neither is a Draw` };
}

// Whether a hand has at least one card that's "in play" for a call -- used
// only by the fairness pass below, never by the match engine itself.
function quartettHandHasCompetitor(hand, call) {
  if (["rarityHigh", "rarityLow", "exactRarity"].includes(call.primaryType)) return true;
  return hand.some((c) => quartettCardSatisfies(c, call));
}

// Generates the fixed 5-call sequence for a match. Not an exhaustive solver
// -- a bounded number of reroll attempts biased toward spec §10's fairness
// guidance (both sides get at least 2 plausible calls somewhere in the
// five), then it accepts the best candidate seen rather than looping
// forever chasing a perfect sequence. The sequence never changes once a
// match starts.
function quartettGenerateCalls(playerHand, opponentHand) {
  const hands = [playerHand, opponentHand];
  let best = null, bestScore = -1;

  for (let attempt = 0; attempt < 12; attempt++) {
    const usedKeys = new Set();
    const calls = [];
    const attrTypesShuffled = shuffle(QUARTETT_ATTR_TYPES.slice());
    for (let i = 0; i < 2 && calls.length < 2; i++) {
      const call = quartettMakeAttrCall(attrTypesShuffled[i % attrTypesShuffled.length], hands);
      if (call && !usedKeys.has(call.id)) { calls.push(call); usedKeys.add(call.id); }
    }
    const catCall = quartettMakeCategoryCall(hands);
    if (catCall && !usedKeys.has(catCall.id)) { calls.push(catCall); usedKeys.add(catCall.id); }
    const rarCall = quartettMakeRarityCall(hands);
    calls.push(rarCall);
    // Wildcard: one more attribute/category call, biased toward an inverted
    // tie-breaker so it reads as the match's one deliberate twist.
    const wildType = shuffle(["color", "style", "fit", "category"])[0];
    const wild = wildType === "category" ? quartettMakeCategoryCall(hands) : quartettMakeAttrCall(wildType, hands, true);
    if (wild && !usedKeys.has(wild.id)) { calls.push(wild); usedKeys.add(wild.id); }
    while (calls.length < QUARTETT_ROUNDS) {
      const filler = quartettMakeAttrCall(shuffle(QUARTETT_ATTR_TYPES.slice())[0], hands);
      if (filler) calls.push(filler); else break;
    }
    const finalCalls = calls.slice(0, QUARTETT_ROUNDS);

    const playerMatches = finalCalls.filter((c) => quartettHandHasCompetitor(playerHand, c)).length;
    const oppMatches = finalCalls.filter((c) => quartettHandHasCompetitor(opponentHand, c)).length;
    const score = Math.min(playerMatches, oppMatches) * 10 + playerMatches + oppMatches;
    if (score > bestScore) { bestScore = score; best = finalCalls; }
    if (playerMatches >= 2 && oppMatches >= 2) break;
  }
  return best;
}

// -- Opponent decision logic (NORMAL heuristic, spec §12) ------------------------

function quartettFutureValue(card, remainingCalls) {
  let value = 0;
  remainingCalls.forEach((call) => {
    if (call.primaryType === "rarityHigh") value += quartettRarityIdx(card);
    else if (call.primaryType === "rarityLow") value += (4 - quartettRarityIdx(card));
    else if (call.primaryType === "exactRarity") { if (card.rarity === call.primaryValue) value += 2; }
    else if (quartettCardSatisfies(card, call)) value += 2;
  });
  return value;
}

function quartettCurrentWinPotential(card, call) {
  if (call.primaryType === "rarityHigh") return quartettRarityIdx(card);
  if (call.primaryType === "rarityLow") return 4 - quartettRarityIdx(card);
  if (call.primaryType === "exactRarity") return card.rarity === call.primaryValue ? 1 : 0;
  return quartettCardSatisfies(card, call) ? 1 : 0;
}

// Never inspects the player's hidden selection -- only the current call,
// its own unplayed hand, and the visible remaining calls.
function quartettOpponentChooseCard(match) {
  const call = match.calls[match.currentRound];
  const remaining = match.calls.slice(match.currentRound + 1);
  const unplayedIds = match.opponentHand.filter((id) => !match.opponentPlayed.includes(id));
  const cards = unplayedIds.map(quartettFindCard);

  const isRarityCall = ["rarityHigh", "rarityLow", "exactRarity"].includes(call.primaryType);
  const matching = isRarityCall ? cards : cards.filter((c) => quartettCardSatisfies(c, call));

  if (matching.length > 0) {
    const scored = matching.map((card) => ({
      card,
      score: quartettFutureValue(card, remaining) - quartettCurrentWinPotential(card, call) * 1.5,
    }));
    scored.sort((a, b) => a.score - b.score);
    return scored[0].card.id;
  }
  // No good current answer -- sacrifice the weakest (lowest future value).
  const sacrifice = cards.map((card) => ({ card, future: quartettFutureValue(card, remaining) }));
  sacrifice.sort((a, b) => a.future - b.future);
  return sacrifice[0].card.id;
}

// -- Match lifecycle ------------------------------------------------------------

function startQuartettMatch(opponentId) {
  quartettRefreshSessionWindow();
  if (quartettSessionsRemaining() <= 0) { renderQuartettEntry(); return; }
  const eligible = quartettPlayerEligibleCards();
  if (eligible.length < QUARTETT_HAND_SIZE) { renderQuartettEntry(); return; }
  quartettSelectedOpponentId = opponentId;
  quartettDraftSelection = [];
  renderQuartettPickScreen();
}

function quartettToggleDraftCard(id) {
  const idx = quartettDraftSelection.indexOf(id);
  if (idx >= 0) {
    quartettDraftSelection.splice(idx, 1);
  } else if (quartettDraftSelection.length < QUARTETT_HAND_SIZE) {
    quartettDraftSelection.push(id);
  }
  renderQuartettPickScreen();
}

// Called once the player has tapped exactly QUARTETT_HAND_SIZE cards on the
// picker screen -- this is the actual moment a match (and a monthly
// session) begins.
function quartettConfirmHand() {
  if (quartettDraftSelection.length !== QUARTETT_HAND_SIZE) return;
  quartettRefreshSessionWindow();
  if (quartettSessionsRemaining() <= 0) { renderQuartettEntry(); return; }

  const opponent = QUARTETT_OPPONENTS[quartettSelectedOpponentId];
  if (!opponent) { renderQuartettEntry(); return; }

  quartettSessionsUsedCount += 1; // a session is spent as soon as the match starts

  const playerHandCards = quartettDraftSelection.map(quartettFindCard);
  quartettDraftSelection = [];
  const opponentPool = opponent.pool();
  const opponentHandCards = shuffle(opponentPool.slice()).slice(0, Math.min(5, opponentPool.length));
  const calls = quartettGenerateCalls(playerHandCards, opponentHandCards);

  quartettMatch = {
    mode: quartettMode,
    opponentId: quartettSelectedOpponentId,
    opponentName: opponent.name,
    matchMode: "casual",
    playerHand: playerHandCards.map((c) => c.id),
    opponentHand: opponentHandCards.map((c) => c.id),
    calls,
    currentRound: 0,
    playerPlayed: [],
    opponentPlayed: [],
    playerRoundWins: 0,
    opponentRoundWins: 0,
    roundHistory: [],
    selectedCardId: null,
    reveal: null,
    rewardCard: null,
    status: "active",
    phase: "intro",
  };
  renderQuartettIntro();
}

// ---- Quartett presentation ---------------------------------------------------
// The match plays as a duel at a table: the opponent's hand (face down)
// fans across the top of the screen, mirroring yours along the bottom. Each
// round opens with its task announced large, both cards slide to the
// middle, hers turns over, and only then is the round called.

let quartettTimer = null;
function quartettClearTimer() { if (quartettTimer) { clearTimeout(quartettTimer); quartettTimer = null; } }

// "BLACK — Higher rarity wins ties" -> { main: "Black", rule: "Higher rarity wins ties" }
function quartettSplitLabel(label) {
  const parts = String(label).split(" — ");
  const rule = parts.slice(1).join(" — ");
  return { main: titleCase(parts[0]), rule: rule ? rule.charAt(0).toUpperCase() + rule.slice(1) : "" };
}

function quartettPipsHTML(wins, fresh) {
  return Array.from({ length: QUARTETT_WIN_TARGET }, (_, i) =>
    `<span class="q-pip ${i < wins ? "won" : ""} ${fresh && i === wins - 1 ? "fresh" : ""}"></span>`).join("");
}

function quartettBackHTML() { return `<div class="q-back"><div class="back-card-face"></div></div>`; }

let quartettMode = "friendly"; // "friendly" | "stakes"
function setQuartettMode(mode) { quartettMode = mode; renderQuartettEntry(); }

function renderQuartettEntry() {
  quartettClearTimer();
  quartettRefreshSessionWindow();
  const remaining = quartettSessionsRemaining();
  const eligible = quartettPlayerEligibleCards();
  const canPlay = remaining > 0 && eligible.length >= QUARTETT_HAND_SIZE;
  const statusLine = eligible.length < QUARTETT_HAND_SIZE
    ? "You don't have enough cards in your collection yet."
    : `${remaining} of ${QUARTETT_MAX_SESSIONS_PER_SEASON} matches left this season.`;

  const opponentTilesHTML = Object.keys(QUARTETT_OPPONENTS).filter((id) => !coreNameIsDead(id)).map((id, i) => {
    const opp = QUARTETT_OPPONENTS[id];
    return `
      <button class="q-opponent" style="--r:${((i % 2 ? 1 : -1) * (2 + (i % 3))).toFixed(0)}deg" onclick="startQuartettMatch('${id}')">
        <span class="q-opponent-card"><img src="${opp.portrait}" alt=""></span>
        <span class="q-opponent-name">${opp.name}</span>
      </button>`;
  }).join("");

  stage.innerHTML = `
    <div class="center-col screen-pad q-entry">
      <div class="soul-name">Quartett</div>
      <p class="q-entry-sub">${statusLine}</p>
      ${!canPlay && remaining <= 0 ? sceneHTML(QUARTETT_LOCKED_LINE, null) : ""}
      ${canPlay ? `
        <div class="segmented q-modes" role="tablist">
          <button role="tab" class="${quartettMode === "friendly" ? "active" : ""}" onclick="setQuartettMode('friendly')">Friendly</button>
          <button role="tab" class="${quartettMode === "stakes" ? "active" : ""}" onclick="setQuartettMode('stakes')">High stakes</button>
        </div>
        <p class="q-mode-note ${quartettMode}">${quartettMode === "stakes"
          ? `${icon("sparkle")} Win and the prize is Rare or better. <b>Lose and you destroy one of the cards you brought, for good.</b>`
          : "Win and she gives you a card. Lose and nothing happens."}</p>
        <p class="q-entry-ask">Who's at the table tonight?</p><div class="q-opponents">${opponentTilesHTML}</div>` : ""}
      <button class="ghost" onclick="renderCafe()">Leave</button>
    </div>
  `;
  updateTopBar("", true);
}

function renderQuartettPickScreen() {
  quartettClearTimer();
  const eligible = quartettPlayerEligibleCards();
  const count = quartettDraftSelection.length;
  const tilesHTML = eligible.map((card) => {
    const order = quartettDraftSelection.indexOf(card.id);
    const selected = order >= 0;
    const disabled = !selected && count >= QUARTETT_HAND_SIZE;
    return `
      <button class="q-pick ${selected ? "selected" : ""} ${disabled ? "disabled" : ""}" onclick="quartettToggleDraftCard(${card.id})" aria-pressed="${selected}">
        ${gcardLazyHTML(card)}
        ${selected ? `<span class="q-pick-badge">${order + 1}</span>` : ""}
      </button>`;
  }).join("");
  const opp = QUARTETT_OPPONENTS[quartettSelectedOpponentId];

  stage.innerHTML = `
    <div class="center-col screen-pad q-pick-screen">
      <div class="soul-name">Choose your hand</div>
      <p class="q-entry-sub">Pick ${QUARTETT_HAND_SIZE} cards to bring to the table${opp ? ` against ${opp.name}` : ""}. You'll play five of them.</p>
      <div class="q-pick-grid">${tilesHTML}</div>
    </div>
    <div class="q-pick-bar">
      ${quartettMode === "stakes" ? `<span class="q-stakes-tag">High stakes</span>` : ""}
      <button class="ghost" onclick="quartettDraftSelection = []; renderCafe();">Leave</button>
      <div class="q-pick-count"><b>${count}</b> of ${QUARTETT_HAND_SIZE}</div>
      <button class="primary" ${count === QUARTETT_HAND_SIZE ? "" : "disabled"} onclick="quartettConfirmHand()">To the table</button>
    </div>
  `;
  updateTopBar("", true);
}

// The table itself. `phase` decides what sits in the middle:
//   intro    -- she says a line or two before the first deal
//   announce -- the round's task, large, over a dimmed table
//   choose   -- pick a card from your hand
//   reveal   -- both cards slide in, hers turns over, the round is called
function renderQuartettMatch() {
  const match = quartettMatch;
  if (!match) { renderQuartettEntry(); return; }
  quartettClearTimer();
  if (!match.phase) match.phase = "announce";
  if (match.reveal) match.phase = "reveal";
  applyStyleMetrics();

  const opp = QUARTETT_OPPONENTS[match.opponentId];
  const call = match.calls[match.currentRound];
  const task = quartettSplitLabel(call.label);
  const phase = match.phase;
  const reveal = match.reveal;

  // Your hand (bottom), shaped exactly like the styling hand.
  const unplayed = match.playerHand.filter((id) => !match.playerPlayed.includes(id));
  const interactive = phase === "choose";
  const handHTML = unplayed.map((id, i) => {
    const card = quartettFindCard(id);
    const selected = match.selectedCardId === id;
    return `
      <div class="fan-card-wrap q-hand-card ${selected ? "selected" : ""}" style="transform:${fanTransform(i, unplayed.length)}; z-index:${selected ? 900 : 100 - Math.abs(i - (unplayed.length - 1) / 2)};"
           ${interactive ? `onpointerdown="quartettHandPointerDown(event, ${id})" onclick="quartettSelectCard(${id})" ondblclick="quartettSelectCard(${id}); quartettPlaySelectedCard()"` : ""}>
        ${gcardHTML(card)}
      </div>`;
  }).join("");

  // Her hand (top): the same fan, mirrored, backs only.
  const oppLeft = match.opponentHand.length - match.opponentPlayed.length;
  const oppHandHTML = Array.from({ length: oppLeft }, (_, i) =>
    `<div class="fan-card-wrap q-opp-card" style="transform:${fanTransform(i, oppLeft)};">${quartettBackHTML()}</div>`).join("");

  // Centre of the table
  let centre = "";
  const banner = `
    <div class="q-task">
      <div class="q-task-round">Round ${match.currentRound + 1} of ${QUARTETT_ROUNDS}</div>
      <div class="q-task-main">${task.main}</div>
      ${task.rule ? `<div class="q-task-rule">${task.rule}</div>` : ""}
    </div>`;

  if (phase === "choose") {
    centre = `
      ${banner}
      <div class="q-slots">
        <div class="q-slot q-slot-you"><span>You</span></div>
        <div class="q-slot"><span>${opp.name}</span></div>
      </div>
      <button class="primary q-play" ${match.selectedCardId ? "" : "disabled"} onclick="quartettPlaySelectedCard()">${match.selectedCardId ? "Play this card" : "Choose a card"}</button>`;
  } else if (phase === "reveal") {
    const verdict = reveal.result === "A" ? "You take the round" : reveal.result === "B" ? `${opp.name} takes the round` : "A draw";
    const reactionLine = reveal.result === "A" ? quartettPickLine(opp.lines.roundPlayerWins)
      : reveal.result === "B" ? quartettPickLine(opp.lines.roundOpponentWins)
      : quartettPickLine(opp.lines.roundDraw);
    const matchOver = match.playerRoundWins >= QUARTETT_WIN_TARGET || match.opponentRoundWins >= QUARTETT_WIN_TARGET || match.currentRound >= QUARTETT_ROUNDS - 1;
    const fromX = reveal.fromX || 0;
    centre = `
      ${banner}
      <div class="q-slots">
        <div class="q-slot filled q-played-you ${reveal.result === "A" ? "winner" : reveal.result === "B" ? "loser" : ""}" style="--fx:${fromX}px; --fy:${reveal.fromY !== undefined ? reveal.fromY + "px" : "55vh"}">
          <div class="q-card-in">${gcardHTML(quartettFindCard(reveal.playerCardId))}</div>
        </div>
        <div class="q-slot filled q-played-opp ${reveal.result === "B" ? "winner" : reveal.result === "A" ? "loser" : ""}">

      <button class="primary q-next" onclick="quartettAdvanceRound()">${matchOver ? "See how it ended" : "Next round"}</button>`;
  }

  const announce = phase === "announce" ? `
    <div class="q-announce" onclick="quartettBeginChoosing()">
      <div class="q-announce-round">Round ${match.currentRound + 1}</div>
      <div class="q-announce-main">${task.main}</div>
      ${task.rule ? `<div class="q-announce-rule">${task.rule}</div>` : ""}
    </div>` : "";

  const fresh = phase === "reveal";
  stage.innerHTML = `
    <div class="q-table phase-${phase}">
      <div class="q-opp-hand">${oppHandHTML}</div>
      <aside class="q-side">
        <div class="q-score">
          <div class="q-score-row"><span class="q-score-name">${opp.name}</span><span class="q-pips">${quartettPipsHTML(match.opponentRoundWins, fresh && reveal.result === "B")}</span></div>
          <div class="q-score-row"><span class="q-score-name">You</span><span class="q-pips">${quartettPipsHTML(match.playerRoundWins, fresh && reveal.result === "A")}</span></div>
        </div>
        <ol class="q-rounds" aria-label="Rounds">${quartettRoundsHTML(match, phase)}</ol>
      </aside>
      <div class="q-opp-portrait"><div class="portrait"><img src="${opp.portrait}" alt="${opp.name}"></div></div>
      <div class="q-centre">${centre}</div>
      <div class="hand-fan q-player-hand ${interactive ? "" : "locked"}">${handHTML}</div>
      ${announce}
    </div>
  `;
  updateTopBar("", true);

  if (phase === "announce") quartettTimer = setTimeout(quartettBeginChoosing, 2600);
}

// Round overview on the left: what's been decided, what's being played now,
// and what's still coming -- so a strong card can be saved for a later task.
function quartettRoundsHTML(match, phase) {
  return match.calls.map((call, i) => {
    const t = quartettSplitLabel(call.label);
    const h = match.roundHistory[i];
    const state = h && !(phase === "reveal" && i === match.currentRound) ? "done" : i === match.currentRound ? "current" : "upcoming";
    const outcome = state === "done" ? (h.result === "A" ? "won" : h.result === "B" ? "lost" : "drawn") : "";
    const tag = outcome === "won" ? "You" : outcome === "lost" ? QUARTETT_OPPONENTS[match.opponentId].name : outcome === "drawn" ? "Draw" : "";
    return `
      <li class="q-round ${state} ${outcome}">
        <span class="q-round-num">${i + 1}</span>
        <span class="q-round-text"><b>${t.main}</b>${t.rule ? `<small>${t.rule}</small>` : ""}</span>
        ${tag ? `<span class="q-round-tag">${tag}</span>` : ""}
      </li>`;
  }).join("");
}

// Drag a card from your hand onto your slot to play it (a tap still just
// selects, and the button or a double-click plays the selection).
function quartettHandPointerDown(ev, id) {
  const match = quartettMatch;
  if (!match || match.phase !== "choose" || ev.button > 0) return;
  const wrap = ev.currentTarget;
  const start = { x: ev.clientX, y: ev.clientY };
  let ghost = null;
  const slot = () => document.querySelector(".q-slot-you");
  const overSlot = (x, y) => {
    const s = slot(); if (!s) return false;
    const r = s.getBoundingClientRect(), pad = 30;
    return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
  };
  const move = (e) => {
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!ghost) {
      if (Math.hypot(dx, dy) < 8) return;
      const r = wrap.getBoundingClientRect();
      ghost = document.createElement("div");
      ghost.className = "q-drag-ghost";
      ghost.style.width = `${wrap.offsetWidth}px`;
      ghost.innerHTML = wrap.innerHTML;
      document.body.appendChild(ghost);
      wrap.classList.add("dragging-source");
    }
    ghost.style.left = `${e.clientX - ghost.offsetWidth / 2}px`;
    ghost.style.top = `${e.clientY - ghost.offsetHeight * 0.35}px`;
    slot()?.classList.toggle("target", overSlot(e.clientX, e.clientY));
  };
  const up = (e) => {
    wrap.removeEventListener("pointermove", move);
    wrap.removeEventListener("pointerup", up);
    wrap.removeEventListener("pointercancel", up);
    if (!ghost) return; // a plain tap: the onclick handler selects the card
    const s = slot();
    const dropped = overSlot(e.clientX, e.clientY);
    ghost.remove();
    wrap.classList.remove("dragging-source");
    s?.classList.remove("target");
    wrap.dataset.suppressClick = "1";
    setTimeout(() => { delete wrap.dataset.suppressClick; }, 0);
    if (dropped && s) {
      const r = s.getBoundingClientRect();
      match.selectedCardId = id;
      quartettPlaySelectedCard({
        fromX: Math.round(e.clientX - (r.left + r.width / 2)),
        fromY: Math.round(e.clientY - (r.top + r.height / 2)),
      });
    }
  };
  wrap.setPointerCapture(ev.pointerId);
  wrap.addEventListener("pointermove", move);
  wrap.addEventListener("pointerup", up);
  wrap.addEventListener("pointercancel", up);
}

function quartettSelectCard(id) {

  const src = document.querySelector(`.q-hand-card[data-suppress-click]`);

  renderQuartettMatch();
}

function quartettPlaySelectedCard(from) {
  const match = quartettMatch;
  if (!match || !match.selectedCardId) return;
  const playerCardId = match.selectedCardId;
  const opponentCardId = quartettOpponentChooseCard(match);
  const call = match.calls[match.currentRound];
  const result = quartettEvaluateRound(call, quartettFindCard(playerCardId), quartettFindCard(opponentCardId));

  match.playerPlayed.push(playerCardId);
  match.opponentPlayed.push(opponentCardId);
  match.selectedCardId = null;
  if (result === "A") match.playerRoundWins += 1;
  else if (result === "B") match.opponentRoundWins += 1;

  match.roundHistory[match.currentRound] = { call, playerCardId, opponentCardId, result };
  // Where the card sat in your fan, so it can slide from there to the table.
  const handEl = document.querySelector(`.q-hand-card.selected`);
  const slotEl = document.querySelector(".q-slot");
  let fromX = 0, fromY;
  if (from) { fromX = from.fromX; fromY = from.fromY; }
  else if (handEl && slotEl) {
    const h = handEl.getBoundingClientRect(), t = slotEl.getBoundingClientRect();
    fromX = Math.round((h.left + h.width / 2) - (t.left + t.width / 2));
  }
  match.reveal = { playerCardId, opponentCardId, result, fromX, fromY };
  match.phase = "reveal";
  renderQuartettMatch();
}

function quartettAdvanceRound() {
  const match = quartettMatch;
  match.reveal = null;
  match.phase = "announce";
  match.currentRound += 1;
  const done = match.playerRoundWins >= QUARTETT_WIN_TARGET || match.opponentRoundWins >= QUARTETT_WIN_TARGET || match.currentRound >= QUARTETT_ROUNDS;
  if (done) { quartettFinishMatch(); return; }
  renderQuartettMatch();
}

function quartettFinishMatch() {
  const match = quartettMatch;
  if (match.playerRoundWins > match.opponentRoundWins) match.status = "playerWin";
  else if (match.opponentRoundWins > match.playerRoundWins) match.status = "opponentWin";
  else match.status = "draw";

  match.rewardCard = null;
  if (match.status === "playerWin") {
    const unowned = DECK.filter((c) => !unobtainableIds().has(c.id));
    const tier = match.mode === "stakes" ? ["Rare", "Iconic", "Legendary"] : ["Basic", "Uncommon", "Rare"];
    const pool = unowned.filter((c) => tier.includes(c.rarity));
    const from = pool.length > 0 ? pool : unowned;
    if (from.length > 0) {
      const awarded = from[Math.floor(Math.random() * from.length)];
      unlockedCardIds.add(awarded.id);
      rebuildLiveDeckFromUnlocked();
      match.rewardCard = awarded;
    }
  }
  renderQuartettResult();
}

function quartettReturnToCafe() { quartettMatch = null; renderCafe(); }

function quartettCallStatusClass(match, idx) {
  if (idx < match.currentRound) return "done";
  if (idx === match.currentRound) return "current";
  return "upcoming";
}

function renderQuartettCallsHTML(match) {
  return match.calls.map((call, i) => {
    const status = quartettCallStatusClass(match, i);
    const resolved = match.roundHistory[i];
    const resultTag = resolved ? (resolved.result === "A" ? "YOU" : resolved.result === "B" ? "MAYA" : "DRAW") : "";
    return `
      <div class="quartett-call quartett-call-${status}">
        <span class="quartett-call-num">${i + 1}</span>
        <span class="quartett-call-label">${call.label}</span>
        ${resolved ? `<span class="quartett-call-result">${resultTag}</span>` : ""}
      </div>
    `;
  }).join("");
}

function pickUniform(pool) { return pool[Math.floor(Math.random() * pool.length)]; }
function pickWeighted(pool) {
  const totalWeight = pool.reduce((sum, e) => sum + e.weight, 0);
  let roll = Math.random() * totalWeight;
  let chosen = pool[0];
  for (const e of pool) { roll -= e.weight; if (roll <= 0) { chosen = e; break; } }
  return chosen;
}
function resolveRepeatPoolVisit({ pool, pickFn, bonusId, getBonusLastYear, setBonusLastYear, eligibleCards, renderPlain, renderReward }) {
  const canOfferBonus = getBonusLastYear() !== currentYear;
  const activePool = canOfferBonus ? pool : pool.filter((e) => e.id !== bonusId);
  const chosen = pickFn(activePool);

  if (chosen.id === bonusId) {
    // Set eagerly, win or lose -- see the once-per-year edge-case fix.
    setBonusLastYear(currentYear);
    const owned = unobtainableIds();
    const eligible = eligibleCards().filter((c) => !owned.has(c.id));
    if (eligible.length > 0) {
      const awarded = eligible[Math.floor(Math.random() * eligible.length)];
      unlockedCardIds.add(awarded.id);
      rebuildLiveDeckFromUnlocked();
      renderReward(chosen, awarded);
      return;
    }
  }
  renderPlain(chosen);
}

function atticRepeatVisit() {
  resolveRepeatPoolVisit({
    pool: ATTIC_REPEAT_POOL,
    pickFn: pickUniform,
    bonusId: "lostproperty",
    getBonusLastYear: () => atticLostPropertyLastYear,
    setBonusLastYear: (y) => { atticLostPropertyLastYear = y; },
    eligibleCards: () => DECK.filter((c) => c.category === "Accessory" && ["Uncommon", "Rare"].includes(c.rarity)),
    renderPlain: (entry) => renderAtticScene([{ who: "NARRATION", t: entry.t }], "Leave", "renderMap()"),
    renderReward: (entry, awarded) => {
      stage.innerHTML = `
        <div class="center-col screen-pad result">

          <div class="shop-mystery-card" style="margin-top:10px;">${gcardHTML(awarded)}</div>
          <button class="primary" style="margin-top:18px;" onclick="renderMap()">Continue</button>
        </div>
      `;

    },
  });
}

const STORY_WEARABLE_TOTAL = 1; // bump this if more one-off story cards like Thorn Veil are added later

function nightgardenOpen() {
  const m = currentMonthIndex();
  return m >= 2 && m <= 7; // March(2) through August(7), every year
}

function octaviaSacrificeEligible() {
  return (currentYear >= 2 || currentMonthIndex() >= 5) // earliest Year 1 Summer (June)
    && metOctavia && octaviaEncounterCount >= 2 && !octaviaSacrificeCompleted

function gardenSublocButtonsHTML() {
  const buttons = [];
  if (glassHouseUnlocked) buttons.push(`<button class="ghost" onclick="renderGlassHouse()">Glass House</button>`);
  else if (hasGlassHouseKey) buttons.push(`<button class="ghost" onclick="renderOvergrownPath()">Follow the overgrown path</button>`);

// speaking, and a "Water it" action that doesn't change the harvest date
// (always exactly a year) but gives the player something to do while they
// wait, per direct request.
function cultivationMonthsElapsed() {
  if (glassHouseCultivationPlantedYear === null) return 0;
  return (currentYear - glassHouseCultivationPlantedYear) * 12 + (currentMonthIndex() - glassHouseCultivationPlantedMonth);
}
function cultivationStatusText() {
  const elapsed = cultivationMonthsElapsed();
  if (elapsed < 3) return "Just beneath the soil. Nothing to see yet.";
  if (elapsed < 6) return "A thin green shoot has broken the surface.";
  if (elapsed < 9) return "Something is definitely growing, though it's too early to say what.";
  return "Whatever this is, it looks nearly ready.";
}
function renderCultivationStatus() {
  const plantedMonthName = glassHouseCultivationPlantedMonth !== null ? MONTHS[glassHouseCultivationPlantedMonth] : "";
  const wateredThisVisit = glassHouseCultivationLastWateredYearMonth === yearMonthKey();
  stage.innerHTML = `

      <div class="soul-name">Glass House</div>
      <div class="speech narration-line">${cultivationStatusText()}</div>
      <p style="color:var(--muted); font-size:12.5px;">It takes a full year. Planted in ${plantedMonthName} -- ready again around ${plantedMonthName} next year.</p>
      <button class="ghost" ${wateredThisVisit ? "disabled" : ""} onclick="waterCultivation()">${wateredThisVisit ? "Already watered today" : "Water it"}</button>
      <button class="primary" style="margin-top:10px;" onclick="renderMap()">Leave</button>
    </div>
  `;
  updateTopBar("", true);
}
function waterCultivation() {
  glassHouseCultivationLastWateredYearMonth = yearMonthKey();
  stage.innerHTML = `
    <div class="center-col screen-pad">
      <div class="portrait token">${icon("window")}</div>

  `;

// Reward pool bias per spec §4.7 -- checked in this exact order, using the
// first non-empty applicable pool; the last entry is the universal fallback.
// What grows in the Nightgarden is Legendary: every pool below is Legendary
// only; Iconic is the fallback once no Legendary is left to grow.
function harvestGlassHouseCultivation() {
  const src = glassHouseCultivationSourceAttributes || {};
  const owned = unobtainableIds();
  const legendaryLeft = DECK.some((c) => !owned.has(c.id) && c.rarity === "Legendary");
  const grown = (c) => c.rarity === (legendaryLeft ? "Legendary" : "Iconic");
  const candidatePools = [];
  if (src.color === "Black") candidatePools.push(DECK.filter((c) => !owned.has(c.id) && (c.style === "Daring" || c.style === "Cool")));
  if (src.color === "Silver") candidatePools.push(DECK.filter((c) => !owned.has(c.id) && (c.style === "Armour" || c.style === "Elegant")));
  if (src.style === "Romantic") candidatePools.push(DECK.filter((c) => !owned.has(c.id) && c.category === "Accessory" && c.style === "Romantic"));
  candidatePools.push(DECK.filter((c) => !owned.has(c.id)));
  const pool = candidatePools.map((p) => p.filter(grown)).find((p) => p.length > 0) || [];
  glassHouseCultivationPending = false;
  glassHouseCultivationLastHarvestYear = currentYear;
  glassHouseCultivationPlantedYear = null;
  glassHouseCultivationPlantedMonth = null;
  glassHouseCultivationLastWateredYearMonth = null;

  if (pool.length === 0) {
    renderGlassHouseScene([{ who: "NARRATION", t: "Nothing came up this year." }], "Leave", "renderMap()");
    return;
  }
  const awarded = pool[Math.floor(Math.random() * pool.length)];
  unlockedCardIds.add(awarded.id);
  rebuildLiveDeckFromUnlocked();
  stage.innerHTML = `
    <div class="center-col screen-pad result">
      <div class="speech narration-line">Something has grown where you left the card.</div>
      <div class="speech" style="background:rgba(255,255,255,0.06);"><b style="display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px;">Octavia</b>See?</div>
      <div class="shop-mystery-card" style="margin-top:10px;">${gcardHTML(awarded)}</div>
      <button class="primary" style="margin-top:18px;" onclick="renderMap()">Continue</button>
    </div>
  `;
  updateTopBar("", true);
}

// --- Seasonal festival reactions (Characters spec §12) --------------------
// currentMonthEvent() already only returns a value during a festival's own
// peak month, which IS the exact trigger window the spec calls for ("from
// the moment the story screen has shown until the end of that month") -- no
// extra date-window bookkeeping needed on top of the existing event schedule.

function markSeasonalReactionSeen(characterId, eventId) {
  if (!seasonalReactionSeen[characterId]) seasonalReactionSeen[characterId] = {};
  if (!seasonalReactionSeen[characterId][currentYear]) seasonalReactionSeen[characterId][currentYear] = {};
  seasonalReactionSeen[characterId][currentYear][eventId] = true;
}
function seasonalReactionAlreadySeen(characterId, eventId) {
  return !!(seasonalReactionSeen[characterId] && seasonalReactionSeen[characterId][currentYear] && seasonalReactionSeen[characterId][currentYear][eventId]);
}
function getFestivalReactionFor(characterId, metFlag) {
  const eventId = currentMonthEvent();
  if (!eventId || !FESTIVAL_REACTIONS[eventId]) return null;
  if (!metFlag) return null;
  if (seasonalReactionAlreadySeen(characterId, eventId)) return null;
  const lines = FESTIVAL_REACTIONS[eventId][characterId];
  if (!lines) return null;
  return { eventId, lines };
}

// Small shared dispatcher used by every location's resolver: walks a list of
// {eligible, run} entries IN ORDER and executes the first one whose
// eligible() returns true, then stops -- exactly matching the short-circuit
// behavior of the if/return chain this replaces. The array order IS the
// priority order; nothing else determines it, so the whole priority list is
// readable top to bottom in one place instead of buried in nested ifs.
// An event that names its scene (`lines`) is skipped while that scene
// would show a dead Core Four character on screen.
function runFirstEligibleEvent(events) {
  for (const event of events) {
    if (event.lines && sceneShowsDead(event.lines)) continue;
    if (event.eligible()) { event.run(); return; }
  }
}

// Shared renderer for a single line of dialogue, used by briefs, the
// CLIENT_STAGES progressive Studio exchanges, and every secondary-character
// scene (Helena, Juliette, Maya, Octavia, Valery, etc.). "NARRATION" is not
// a speaker — it renders as unlabeled italic scene text (e.g. "Juniper
// smiles.") instead of a speech bubble, matching how the source documents
// distinguish spoken lines from stage direction.
//
// speakerName is an override for the label on every non-YOU line (used by
// single-character screens like the Studio, where every non-YOU line is
// that one client). Pass null/undefined for multi-speaker scenes (e.g.
// Night Castle, where a scene mixes HELENA, JULIETTE and NARRATION lines)
// so each line is labeled from its own `who` instead.
// Pill colours: the Soul you're talking with speaks in black, You in smoke,
// anyone else in a tint taken from her own card, so a three-way scene reads
// at a glance. `role` is "primary" (black) or "other" (tinted); single-client
// screens pass a speakerName and are always primary.
const SPEAKER_TINTS = {
  margo: "rgba(58,55,64,0.9)", juniper: "rgba(104,128,110,0.9)", ivy: "rgba(140,88,98,0.9)",
  holly: "rgba(112,128,145,0.9)", helena: "rgba(43,41,56,0.92)", juliette: "rgba(104,116,160,0.9)",
  maya: "rgba(176,128,128,0.9)", octavia: "rgba(118,116,122,0.9)", valery: "rgba(170,126,130,0.9)",
};

function dialogueLineHTML(line, speakerName, role, extraClass) {
  const extra = extraClass ? ` ${extraClass}` : "";
  if (line.who === "NARRATION") {
    return `<div class="speech narration-line${extra}" data-who="NARRATION">${line.t}</div>`;
  }
  const isYou = line.who === "YOU";
  const speakerLabel = isYou ? "You" : (speakerName || properCase(line.who));
  const tint = !isYou && !speakerName && role === "other" ? SPEAKER_TINTS[(line.who || "").toLowerCase()] : null;
  const cls = isYou ? " is-you" : (tint ? " is-tinted" : "");
  return `
    <div class="speech${cls}${extra}" data-who="${isYou ? "YOU" : (line.who || "")}"${tint ? ` style="--tint:${tint}"` : ""}>
      <span class="speaker">${speakerLabel}</span>
      ${line.t}
    </div>
  `;
}

// The first named (non-You, non-narration) speaker in a scene is its lead.
function leadSpeaker(lines) {
  const l = (lines || []).find((x) => x.who && x.who !== "YOU" && x.who !== "NARRATION");
  return l ? l.who : null;
}

function properCase(s) {
  return s.charAt(0) + s.slice(1).toLowerCase();
}

// Renders a brief's dialogue array as a stack of speech bubbles, reusing the
// exact look of the CLIENT_STAGES exchange above (speaker label + line) so
// a multi-line brief reads the same as any other back-and-forth in the game.
function briefDialogueHTML(brief, speakerName) {
  return brief.dialogue.map((line) => dialogueLineHTML(line, speakerName)).join("");
}

// Renders a whole scene (array of {who,t} lines, NARRATION included) as a
// static stack — used for secondary-character one-shot scenes that don't
// need the one-line-at-a-time stepping that CLIENT_STAGES uses.
function sceneHTML(lines, speakerName) {
  const lead = leadSpeaker(lines);
  return lines.map((line) => dialogueLineHTML(line, speakerName, line.who === lead ? "primary" : "other")).join("");
}

// Secondary-character portraits (Helena, Juliette, Maya, Octavia, Valery),
// hosted the same way as the Core Four's -- portrait_<name>.png in the same
// GitHub Pages portraits/ folder. Scenes at these locations often involve
// more than one named character at once (Helena and Juliette are almost
// always together at the Castle gate), so rather than have every single
// call site specify who's present, inferPortraitKeys() scans the scene's
// own dialogue lines and shows whichever of these five actually speak in
// it -- narration-only scenes correctly fall back to the location glyph.



// Every character who can appear in a scene: the four clients plus the
// secondary cast. Keyed by the lower-case speaker id used in dialogue lines.
function characterPortraits() {
  const map = {};
  CLIENTS.forEach((c) => { if (c.portrait) map[c.name.split(/[ ,]/)[0].toLowerCase()] = c.portrait; });
  Object.assign(map, SECONDARY_PORTRAITS);
  return map;
}
function characterOrder() {
  return [...CLIENTS.map((c) => c.name.split(/[ ,]/)[0].toLowerCase()), ...SECONDARY_PORTRAIT_ORDER];
}

// Scans a scene's lines for who is present: anyone who speaks, plus anyone
// narration names (e.g. "You recognize the bike before you see Ivy.").
// A YOU/other-character line merely mentioning someone doesn't count.
function inferPortraitKeys(lines) {
  const portraits = characterPortraits();
  const order = characterOrder();
  const present = new Set();
  (lines || []).forEach((l) => {
    const who = (l.who || "").toLowerCase();
    if (portraits[who]) present.add(who);
    if (who === "narration") {
      const text = (l.t || "").toLowerCase();
      order.forEach((k) => { if (new RegExp(`\\b${k}\\b`).test(text)) present.add(k); });
    }
  });
  return order.filter((k) => present.has(k));
}

function castHTML(keys) {
  const portraits = characterPortraits();
  keys = keys.filter((k) => portraits[k]);
  if (keys.length === 0) return "";
  const multi = keys.length > 1;
  const rowClass = `cast ${multi ? `cast-multi cast-${Math.min(keys.length, 4)}` : "cast-solo"}`;
  const nameOf = (k) => k.charAt(0).toUpperCase() + k.slice(1);
  return `<div class="${rowClass}">${keys.map((k) => `
    <figure class="cast-member" data-key="${k}">
      <figcaption class="cast-name">${nameOf(k)}</figcaption>
      <div class="portrait"><img src="${portraits[k]}" alt="${nameOf(k)}"></div>
    </figure>`).join("")}</div>`;
}

// Renders one portrait per named character present in `lines`, or the
// location's glyph if nobody named is there (pure narration).
function portraitHTML(lines, fallbackEmoji, fallbackBg) {
  const keys = inferPortraitKeys(lines);
  if (keys.length === 0) {
    const glyph = { "☕": "cup", "🗄️": "cabinet", "🌿": "leaf", "🪟": "window", "🏰": "castle", "🌹": "rose" }[fallbackEmoji] || "sparkle";
    return `<div class="portrait token">${icon(glyph)}</div>`;

/* ---------------- STUDIO VISIT SCHEDULING ----------------
   See STAGE_RULES / STAGE_ASKS in data-story.js. A visit = at most one stage
   conversation + today's job. profile.stagesSeen (play order) and
   profile.briefsHeard replace the old "stage = visit number" and "brief =
   9-slot yearly schedule", which put stages out of season and made Year 2
   replay Year 1's briefs word for word. */
let currentStageIndex = null;   // 0-based stage playing this visit, or null
let currentBriefSilent = false; // true: no separate brief conversation this visit

function ensureStudioHistory(key) {
  const p = soulProfiles[key];
  const stages = CLIENT_STAGES[key] || [];
  if (!Array.isArray(p.stagesSeen)) {
    // Saves from before scheduling: every visit so far played the next stage.
    p.stagesSeen = Array.from({ length: Math.min(p.visits || 0, stages.length) }, (_, i) => i);
  }
  if (!Array.isArray(p.briefsHeard)) {
    // Year 1 used 9 fixed slots; Year 2 replayed the same 9.
    const n = currentYear >= 2 ? BRIEF_VISIT_INDICES.length : Math.min(p.yearVisits || 0, BRIEF_VISIT_INDICES.length);
    p.briefsHeard = BRIEF_VISIT_INDICES.slice(0, n);
  }
}

// "J8" -> [1, 7]; 6 -> [key, 5]
function parseStageRef(ref, key) {
  if (typeof ref === "number") return [key, ref - 1];
  const who = { M: 0, J: 1, I: 2, H: 3 }[ref.charAt(0)];
  return [who, parseInt(ref.slice(1), 10) - 1];
}
function stageWasSeen(clientKey, idx) {
  const p = soulProfiles[clientKey];
  return !!p && Array.isArray(p.stagesSeen) && p.stagesSeen.includes(idx);
}
function stageReady(key, idx, visitIdx) {
  const rule = ((STAGE_RULES[key] || {})[idx + 1]) || {};
  if (rule.trigger) return false;
  if (rule.year && currentYear < rule.year) return false;
  if (visitIdx < idx - 3) return false;
  if (rule.season && !rule.season.includes(currentSeasonName())) return false;
  if (rule.flag && !storyFlags[rule.flag]) return false;
  return (rule.after || []).every((ref) => { const [k, i] = parseStageRef(ref, key); return stageWasSeen(k, i); });
}
// kind "ask": a stage in which she says what to wear (it becomes the job's
// brief). kind "talk": any other stage (offered through "Talk").
function isAskStage(key, idx) { return !!(STAGE_ASKS[key] && STAGE_ASKS[key][idx + 1]); }
function chooseStageForVisit(key, kind) {
  const p = soulProfiles[key];
  const stages = CLIENT_STAGES[key] || [];
  const visitIdx = p.visits - 1;
  for (let i = 0; i < stages.length; i++) {
    if (p.stagesSeen.includes(i) || isAskStage(key, i) !== (kind === "ask")) continue;
    if (kind === "ask" && visitIdx < i - 1) continue; // an ask plays close to its own number
    if (stageReady(key, i, visitIdx)) return i;
  }
  return null;
}
function heartsNeededForTalk(idx) {
  const n = idx + 1;
  const tier = TALK_HEARTS.find((t) => n <= t.upTo) || TALK_HEARTS[TALK_HEARTS.length - 1];
  return tier.hearts;
}

function chooseBriefForVisit(key, stageIdx) {
  const p = soulProfiles[key];
  const ask = stageIdx !== null && STAGE_ASKS[key] ? STAGE_ASKS[key][stageIdx + 1] : null;
  if (ask) {
    if (ask.usesBrief !== undefined && !p.briefsHeard.includes(ask.usesBrief)) p.briefsHeard.push(ask.usesBrief);
    return { brief: { dialogue: CLIENT_STAGES[key][stageIdx], want: ask.want, softDirection: ask.softDirection, fromStage: true }, silent: false };
  }
  const briefs = CLIENTS[key].briefs;
  // Order: her authored briefs, then her trust job (player choice), then the
  // Year Two briefs. Ids: authored = index, Year Two = "y2-n". A seasonal
  // Year Two brief jumps the queue while its season is on, so the Solstice
  // and Dead Day jobs actually land in winter.
  const order = [
    ...briefs.map((b, i) => i).filter((i) => !briefs[i].playerChoice).map((i) => ({ id: i, brief: briefs[i] })),
    ...briefs.map((b, i) => i).filter((i) => briefs[i].playerChoice).map((i) => ({ id: i, brief: briefs[i] })),
    ...(currentYear >= 2 ? (YEAR_TWO_BRIEFS[key] || []).map((b, n) => ({ id: `y2-${n}`, brief: b })) : []),
    ...(currentYear >= 3 ? (YEAR_THREE_BRIEFS[key] || []).map((b, n) => ({ id: `y3-${n}`, brief: b })) : []),
  ];
  const season = currentSeasonName();
  const month = currentMonthIndex();
  const timed = (b) => !!(b.season || b.months);
  const inTime = (b) => (!b.season || b.season.includes(season)) && (!b.months || b.months.includes(month));
  const unheard = order.filter((o) => !p.briefsHeard.includes(o.id));
  const next = unheard.find((o) => timed(o.brief) && inTime(o.brief)) || unheard.find((o) => !timed(o.brief));
  if (next) { p.briefsHeard.push(next.id); return { brief: next.brief, silent: false }; }
  // Every authored brief has been heard: reuse one's requirements without
  // replaying its conversation (the trust job isn't repeated).
  const pool = briefs.map((b, i) => i).filter((i) => !briefs[i].playerChoice);
  const pick = briefs[pool[(p.visits || 0) % pool.length]];
  return { brief: { dialogue: [], want: pick.want, softDirection: pick.softDirection, suppressPreference: pick.suppressPreference }, silent: true };
}

let talkStageIndex = null;
let talkedThisVisit = false;

function cardArtHTML(card) {
  const art = CARD_ART[card.id] || PLACEHOLDER_ART;

// Real vector card art is fetched once per URL and cached in memory, then
// injected as live DOM content (never as an <img> or background-image) —
// that's specifically what lets it inherit the page's Poppins font instead
// of silently falling back to a default font, the way a rasterized image
// or CSS background-image never could.
const svgArtCache = {};
const svgArtLoading = {};

function ensureSvgArtLoaded(url) {
  if (svgArtCache[url] || svgArtLoading[url]) return;
  svgArtLoading[url] = true;
  fetch(url)
    .then((r) => r.text())
    .then((svg) => {
      svgArtCache[url] = svg;
      delete svgArtLoading[url];
      document.querySelectorAll(`.art-fill[data-src="${CSS.escape(url)}"]`).forEach((el) => {
        if (el.innerHTML) return;
        if (el.classList.contains("lazy") && el.dataset.visible !== "1") return;
        el.innerHTML = svg;
      });
    })
    .catch(() => { delete svgArtLoading[url]; });
}

// Grids that can show the whole collection at once (the deck, the Quartett
// hand picker) use lazy cards: the heavy vector art is only put into the page
// while a card is on or near the screen, and taken out again once it scrolls
// far away. Without this, 100+ cards at ~450 KB of SVG each made those
// screens so heavy that scrolling stalled.
const lazyArtEls = new Map(); // element -> observer watching it
const lazyArtObservers = new Map(); // scroll container (or null = page) -> observer
function lazyArtObserverFor(scrollRoot) {
  if (lazyArtObservers.has(scrollRoot)) return lazyArtObservers.get(scrollRoot);
  // The observer's root must be the element that actually scrolls, or the
  // look-ahead margin is clipped away and cards only appear once visible.
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      const el = e.target;
      const url = el.dataset.src;
      if (e.isIntersecting) {
        el.dataset.visible = "1";
        if (svgArtCache[url]) { if (!el.innerHTML) el.innerHTML = svgArtCache[url]; }
        else ensureSvgArtLoaded(url);
      } else {
        el.dataset.visible = "";
        el.innerHTML = "";
      }
    });
  }, { root: scrollRoot, rootMargin: "700px 0px" });
  lazyArtObservers.set(scrollRoot, io);
  return io;
}

function observeLazyArt(root, scrollRoot = null) {
  lazyArtEls.forEach((io, el) => { if (!el.isConnected) { io.unobserve(el); lazyArtEls.delete(el); } });
  const io = lazyArtObserverFor(scrollRoot);
  (root || document).querySelectorAll(".art-fill.lazy").forEach((el) => {
    if (lazyArtEls.has(el)) return;
    lazyArtEls.set(el, io);
    io.observe(el);
  });
}

function gcardLazyHTML(card) {
  if (!card.fullArt || card.type === "KEY") return gcardHTML(card);
  return `<div class="gcard gcard-full"><div class="art-fill lazy" data-src="${card.fullArt}" role="img" aria-label="${card.name}"></div></div>`;
}

function gcardHTML(card) {
  if (card.type === "KEY") {
    // No real key art yet — plain glyph per Items/Keys spec §19.2. Swap in a
    // fullArt SVG later; nothing else about this branch needs to change.
    return `

          <div class="gpill">KEY</div>

          <div class="gattrs"><span>QUEST ITEM</span><span>CANNOT WEAR</span></div>

  }

    <div class="gcard">
